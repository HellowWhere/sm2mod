<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3f95e6">
<title>Небесные Бастионы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: full-bleed sky canvas. Hangar = ship stage + upgrade sheet (bottom in portrait, right in landscape). Battle = slim HUD bands top and bottom. */
:root{
  --ink:#1b2140;
  --panel:#2e3f70;
  --panel-deep:#202c55;
  --panel-soft:#3b4e87;
  --brass:#f5b833;
  --brass-deep:#c0850f;
  --go:#66d33e;
  --go-deep:#2f8f1d;
  --danger:#f0503f;
  --danger-deep:#a8291e;
  --sky:#86c8f6;
  --sky-soft:#c4e7fc;
  --text:#ffffff;
  --muted:#c3cdee;
  --dim:#8c97bd;
  --coin-hi:#fff4a6;
  --coin:#ffd23f;
  --coin-deep:#de9512;
  --hl:rgba(255,255,255,.35);
  --sh:rgba(0,0,0,.22);
  --veil:rgba(14,20,48,.62);
  --f-display:"Russo One","Arial Black",Impact,system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--text);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:absolute;inset:0;pointer-events:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--coin-hi);outline-offset:2px}

/* ---------- shared chunky controls ---------- */
.btn{font-family:var(--f-display);font-size:18px;color:var(--text);border:3px solid var(--ink);border-radius:16px;padding:10px 18px;cursor:pointer;letter-spacing:.02em;text-shadow:0 2px 0 var(--sh);box-shadow:inset 0 -5px 0 var(--sh),inset 0 3px 0 var(--hl),0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s;pointer-events:auto}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--sh),inset 0 2px 0 var(--hl),0 1px 0 var(--ink)}
.btn.go{background:linear-gradient(var(--go),var(--go-deep))}
.btn.gold{background:linear-gradient(var(--brass),var(--brass-deep))}
.btn.ghost{background:var(--panel-soft)}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel-deep);border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 5px;font-family:var(--f-display);font-size:17px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill .pk{font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--muted);padding-left:6px;text-transform:uppercase;letter-spacing:.06em}
.pill.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.15)}}
.coin{display:inline-block;flex:none;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--coin-hi) 0 20%,var(--coin) 22% 58%,var(--coin-deep) 60%);border:2px solid var(--ink)}
.iconbtn{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:3px solid var(--ink);background:var(--panel-soft);box-shadow:inset 0 -4px 0 var(--sh),0 3px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.iconbtn img{width:28px;height:28px}
.iconbtn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--sh),0 1px 0 var(--ink)}
.outlined{text-shadow:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink)}

/* ---------- hangar ---------- */
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);line-height:.95;font-size:22px;display:flex;flex-direction:column;pointer-events:none;text-transform:uppercase;letter-spacing:.02em}
.brand .b2{color:var(--brass);font-size:26px}
.tb-right{display:flex;align-items:center;gap:8px;pointer-events:auto}
.sheet{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--ink);pointer-events:auto;box-shadow:0 -6px 0 var(--sh)}
.port .sheet{left:0;right:0;bottom:0;height:min(54%,480px);border-radius:24px 24px 0 0;border-bottom:none;border-left:none;border-right:none}
.land .sheet{right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 64px);width:min(430px,46%);border-radius:24px 0 0 0;border-right:none;border-bottom:none}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-top:10px;padding-bottom:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.land .tabs{padding-left:12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel-deep);border:3px solid var(--ink);border-radius:14px;padding:4px 2px 5px;cursor:pointer;font-weight:800;font-size:11px;letter-spacing:.02em;color:var(--muted);box-shadow:0 3px 0 var(--ink);min-width:0}
.tab img{width:30px;height:30px}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-selected="true"]{background:linear-gradient(var(--brass),var(--brass-deep));color:var(--ink)}
.sheet-body{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:9px;padding-top:4px;padding-bottom:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.land .sheet-body{padding-left:12px}
.sheet-foot{display:flex;gap:10px;align-items:stretch;border-top:3px solid var(--ink);background:var(--panel-deep);padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.land .sheet-foot{padding-left:12px}
.liftbox{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.liftbox b{color:var(--text);font-family:var(--f-display);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}
.lb-row{display:flex;justify-content:space-between;gap:8px}
.meter{position:relative;height:12px;border-radius:999px;background:var(--ink);border:2px solid var(--ink);overflow:hidden}
.meter span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(var(--go),var(--go-deep));transition:width .25s}
.meter.bad span{background:linear-gradient(var(--danger),var(--danger-deep))}
.meter i{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--text);box-shadow:0 0 0 1px var(--ink)}
.lb-state{font-size:11.5px;color:var(--muted)}
.lb-state.bad{color:var(--coin)}
.liftbox.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fight{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 22px;min-width:132px}
.fight .f1{font-size:23px;line-height:1.05;text-transform:uppercase}
.fight .f2{font-family:var(--f-body);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.9;text-shadow:none}

.hint{margin:0;font-size:13px;line-height:1.4;color:var(--muted);font-weight:500}
.hint b{color:var(--text)}
.card{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:10px;background:var(--panel-deep);border:3px solid var(--ink);border-radius:16px;padding:7px 9px}
.card .ic{width:54px;height:54px;border-radius:12px;background:var(--sky-soft);border:2px solid var(--ink)}
.card.locked .ic{filter:grayscale(1) brightness(.75)}
.card .info{min-width:0}
.nm{font-family:var(--f-display);font-size:16px;line-height:1.15;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px}
.lv{font-family:var(--f-body);font-weight:800;font-size:11px;color:var(--ink);background:var(--brass);border-radius:999px;padding:1px 7px;letter-spacing:.03em}
.ds{font-size:12.5px;line-height:1.35;color:var(--muted);font-weight:500;margin-top:2px}
.ds b{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
.ds b.up{color:var(--go)}
.note{color:var(--dim)}
.buy{pointer-events:auto;display:flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:15px;color:var(--text);background:linear-gradient(var(--go),var(--go-deep));border:3px solid var(--ink);border-radius:13px;padding:7px 10px;cursor:pointer;box-shadow:inset 0 -4px 0 var(--sh),inset 0 2px 0 var(--hl),0 3px 0 var(--ink);text-shadow:0 2px 0 var(--sh);white-space:nowrap;font-variant-numeric:tabular-nums}
.buy:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--sh),0 1px 0 var(--ink)}
.buy[data-poor]{background:var(--panel-soft);color:var(--muted)}
.buy .bl{font-family:var(--f-body);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.maxed,.lock{font-family:var(--f-display);font-size:13px;color:var(--brass);padding:0 4px;text-align:center;line-height:1.15}
.lock{color:var(--dim);font-family:var(--f-body);font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel-deep);border:3px solid var(--ink);border-radius:14px;padding:6px 4px 7px;cursor:pointer;box-shadow:0 3px 0 var(--ink);min-width:0}
.tool img{width:42px;height:42px}
.tool span{font-family:var(--f-display);font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool small{font-size:10.5px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.tool small.on{color:var(--go)}
.tool[aria-pressed="true"]{background:linear-gradient(var(--brass),var(--brass-deep));color:var(--ink)}
.tool[aria-pressed="true"] small{color:var(--ink)}
.yard-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:700}
.yard-stats b{color:var(--text);font-family:var(--f-display);font-weight:400}

/* ---------- battle HUD ---------- */
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-top > *{pointer-events:auto}
.route{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.route-label{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:13px;letter-spacing:.03em}
.route-bar{position:relative;height:14px;background:var(--panel-deep);border:3px solid var(--ink);border-radius:999px;margin:0 8px}
#routeFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(var(--brass),var(--brass-deep))}
.mark{position:absolute;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);background-size:cover}
.mark.boss{width:26px;height:26px}
.mark.done{filter:grayscale(1) opacity(.55)}
#routeShip{position:absolute;top:50%;left:0;width:30px;height:30px;transform:translate(-50%,-55%);background-size:cover}
.speedbtn{font-family:var(--f-display);font-size:15px}
.hud-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.gauges{pointer-events:none;width:158px;background:var(--veil);border:3px solid var(--ink);border-radius:16px;padding:7px 9px 8px;display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gauges b{font-family:var(--f-display);font-weight:400;color:var(--text);font-size:14px;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.g-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.meter.hull span{background:linear-gradient(var(--coin),var(--coin-deep))}
.abil{display:flex;gap:12px;align-items:flex-end}
.ability{pointer-events:auto;position:relative;width:72px;height:72px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 50% 35%,var(--panel-soft),var(--panel-deep));box-shadow:inset 0 -5px 0 var(--sh),0 4px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;overflow:hidden}
.ability.ram{width:84px;height:84px;background:radial-gradient(circle at 50% 35%,var(--danger),var(--danger-deep))}
.ability img{width:40px;height:40px;position:relative;z-index:1}
.ability.ram img{width:48px;height:48px}
.ab-name{position:relative;z-index:1;font-family:var(--f-display);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-top:-3px}
.ability::after{content:"";position:absolute;inset:0;background:conic-gradient(var(--veil) calc(var(--p,0)*1%),transparent 0);z-index:2;pointer-events:none}
.ability.off{filter:grayscale(.85) brightness(.8)}
.ability:active{transform:translateY(2px)}
.ab-count{position:absolute;top:2px;right:6px;z-index:3;background:var(--brass);color:var(--ink);font-weight:800;font-size:12px;border:2px solid var(--ink);border-radius:999px;min-width:20px;height:20px;line-height:16px;text-align:center}
.warn{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);font-family:var(--f-display);font-size:18px;color:var(--text);background:var(--danger);border:3px solid var(--ink);border-radius:12px;padding:4px 14px;text-transform:uppercase;letter-spacing:.04em;animation:pulse .7s infinite alternate;white-space:nowrap;pointer-events:none}
@keyframes pulse{to{transform:translateX(-50%) scale(1.08)}}

/* ---------- toast & modal ---------- */
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);max-width:min(440px,calc(100% - 32px));width:max-content;background:var(--panel-deep);border:3px solid var(--ink);border-radius:14px;padding:9px 14px;font-size:14px;line-height:1.35;font-weight:700;text-align:center;box-shadow:0 4px 0 var(--ink);pointer-events:none;z-index:20}
.toast.show{animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
.modal{position:absolute;inset:0;background:var(--veil);display:grid;place-items:center;z-index:30;pointer-events:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mcard{width:min(400px,100%);background:var(--panel);border:4px solid var(--ink);border-radius:26px;padding:20px 18px 18px;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.mtitle{font-family:var(--f-display);font-size:36px;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.mtitle.win{color:var(--coin)}
.mtitle.lose{color:var(--danger)}
.stars{display:flex;justify-content:center;gap:6px}
.star{width:50px;height:50px;position:relative}
.star::before,.star::after{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%)}
.star::before{background:var(--ink)}
.star::after{inset:5px;background:var(--panel-deep)}
.star.on::after{background:linear-gradient(var(--coin-hi),var(--coin) 50%,var(--coin-deep))}
.star:nth-child(2){transform:translateY(-8px) scale(1.12)}
.rows{display:flex;flex-direction:column;gap:6px;background:var(--panel-deep);border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-weight:700;color:var(--muted);font-size:14px}
.rows div{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rows b{display:flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:400;color:var(--text);font-size:17px;font-variant-numeric:tabular-nums}
.rows .tot{border-top:2px dashed var(--panel-soft);padding-top:6px;color:var(--text)}
.rows .tot b{color:var(--coin);font-size:20px}
.mtip{font-size:13.5px;line-height:1.45;color:var(--muted);font-weight:500;margin:0;text-wrap:pretty}
.mtip b{color:var(--text)}
.macts{display:flex;gap:10px}
.macts .btn{flex:1}
@media (prefers-reduced-motion:reduce){.warn,.toast.show,.mcard,.pill.bump,.liftbox.shake{animation:none}}
</style>
</head>
<body>
<div id="app" class="port">
  <canvas id="cv" aria-label="Небо и корабли"></canvas>

  <div id="hangar" class="layer">
    <header class="topbar">
      <div class="brand outlined"><span>Небесные</span><span class="b2">Бастионы</span></div>
      <div class="tb-right">
        <div class="pill" title="Номер следующего рейса"><span class="pk">Рейс</span><b id="hLevel">1</b></div>
        <div class="pill" id="hCoinsPill"><i class="coin"></i><b id="hCoins">0</b></div>
        <button class="iconbtn" id="soundBtn" aria-label="Звук включён" aria-pressed="true"><img id="soundIc" alt=""></button>
      </div>
    </header>
    <section class="sheet" id="sheet">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы ангара">
        <button class="tab" role="tab" id="tab-yard" data-tab="yard"><img alt="" data-ic="tabyard"><span>Верфь</span></button>
        <button class="tab" role="tab" id="tab-hull" data-tab="hull"><img alt="" data-ic="wall"><span>Стены</span></button>
        <button class="tab" role="tab" id="tab-crew" data-tab="crew"><img alt="" data-ic="crew-gunner"><span>Экипаж</span></button>
        <button class="tab" role="tab" id="tab-bal" data-tab="bal"><img alt="" data-ic="blift"><span>Баллоны</span></button>
        <button class="tab" role="tab" id="tab-prop" data-tab="prop"><img alt="" data-ic="thrust"><span>Винты</span></button>
      </nav>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot">
        <div class="liftbox" id="liftBox">
          <div class="lb-row"><span>Подъём <b id="fLift">0</b></span><span>Вес <b id="fWeight">0</b></span></div>
          <div class="meter" id="fMeter"><span id="fLiftBar"></span><i id="fWeightMark"></i></div>
          <div class="lb-state" id="fState">Корабль держится в воздухе</div>
        </div>
        <button class="btn go fight" id="fightBtn"><span class="f1">В бой!</span><span class="f2" id="fightSub">Рейс 1</span></button>
      </div>
    </section>
  </div>

  <div id="hud" class="layer" hidden>
    <div class="hud-top">
      <button class="iconbtn" id="pauseBtn" aria-label="Пауза"><img id="pauseIc" alt=""></button>
      <div class="route">
        <div class="route-label outlined"><span id="bLevel">Рейс 1</span><span id="bName"></span></div>
        <div class="route-bar"><div id="routeFill"></div><div id="routeMarks"></div><div id="routeShip"></div></div>
      </div>
      <button class="iconbtn speedbtn" id="speedBtn" aria-label="Скорость игры">×1</button>
      <div class="pill" id="bCoinsPill"><i class="coin"></i><b id="bCoins">0</b></div>
    </div>
    <div id="warn" class="warn" hidden>Теряем высоту!</div>
    <div class="hud-bottom">
      <div class="gauges">
        <div class="g-row"><span>Высота</span><b id="altVal">0 м</b></div>
        <div class="meter" id="bMeter"><span id="bLiftBar"></span><i id="bWeightMark"></i></div>
        <div class="g-row"><span>Подъём <b id="bLift">0</b></span><span>Вес <b id="bWeight">0</b></span></div>
        <div class="meter hull"><span id="bHullBar"></span></div>
        <div class="g-row"><span>Корпус</span><b id="bHull">0</b></div>
      </div>
      <div class="abil">
        <button class="ability" id="ballastBtn" aria-label="Сбросить балласт"><img id="ballastIc" alt=""><span class="ab-name">Балласт</span><span class="ab-count" id="ballastN">1</span></button>
        <button class="ability ram" id="ramBtn" aria-label="Таран"><img id="ramIc" alt=""><span class="ab-name">Таран</span></button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

/* ================= drawing primitives ================= */
function rr(c,x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function circ(c,x,y,r){ c.beginPath(); c.arc(x,y,Math.max(0.01,r),0,TAU); }
function ell(c,x,y,rx,ry){ c.beginPath(); c.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),0,0,TAU); }
function line(c,x1,y1,x2,y2){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
function star(c,x,y,r1,r2,n){ c.beginPath(); for(let i=0;i<n*2;i++){ const a=-Math.PI/2+i*Math.PI/n, r=i%2?r2:r1; c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r); } c.closePath(); }

function drawBlock(c,x,y,mat,ratio,flash){
  const s=B;
  rr(c,x+0.5,y+0.5,s-1,s-1,4); c.fillStyle=mat.base; c.fill();
  c.save(); c.clip();
  c.fillStyle=mat.light; c.fillRect(x,y,s,4); c.fillRect(x,y,3,s);
  c.globalAlpha=0.5; c.fillStyle=mat.dark; c.fillRect(x,y+s-5,s,5); c.fillRect(x+s-4,y,4,s); c.globalAlpha=1;
  c.strokeStyle=mat.dark; c.lineWidth=2;
  if(mat.pat==='planks'){
    c.beginPath(); c.moveTo(x,y+12); c.lineTo(x+s,y+12); c.moveTo(x,y+24); c.lineTo(x+s,y+24); c.stroke();
    c.lineWidth=4.5; line(c,x+5,y+s-5,x+s-5,y+5);
    c.fillStyle=INK; for(const [px,py] of [[5,5],[s-5,5],[5,s-5],[s-5,s-5]]){ circ(c,x+px,y+py,1.4); c.fill(); }
  } else if(mat.pat==='bricks'){
    c.beginPath();
    for(let i=1;i<3;i++){ c.moveTo(x,y+i*12); c.lineTo(x+s,y+i*12); }
    for(let i=0;i<3;i++){ const o=i%2?9:18; for(let xx=x+o; xx<x+s; xx+=18){ c.moveTo(xx,y+i*12); c.lineTo(xx,y+i*12+12); } }
    c.stroke();
  } else if(mat.pat==='plates'){
    rr(c,x+6,y+6,s-12,s-12,3); c.stroke();
    for(const [px,py] of [[5,5],[s-5,5],[5,s-5],[s-5,s-5]]){ circ(c,x+px,y+py,2.2); c.fillStyle=mat.light; c.fill(); c.lineWidth=1.2; c.strokeStyle=INK; c.stroke(); }
  } else {
    c.beginPath(); c.moveTo(x+4,y+s); c.lineTo(x+s*0.5,y+6); c.lineTo(x+s-4,y+s); c.moveTo(x+s*0.5,y+6); c.lineTo(x+s*0.5,y+s); c.stroke();
    c.globalAlpha=0.55; c.fillStyle='#ffffff'; c.beginPath(); c.moveTo(x+7,y+4); c.lineTo(x+13,y+4); c.lineTo(x+4,y+16); c.lineTo(x+4,y+10); c.closePath(); c.fill(); c.globalAlpha=1;
  }
  if(ratio<0.66){ c.strokeStyle=INK; c.lineWidth=1.6; c.beginPath(); c.moveTo(x+s*0.3,y); c.lineTo(x+s*0.42,y+s*0.3); c.lineTo(x+s*0.3,y+s*0.48); c.lineTo(x+s*0.5,y+s*0.68); c.stroke(); }
  if(ratio<0.33){ c.beginPath(); c.moveTo(x+s,y+s*0.55); c.lineTo(x+s*0.72,y+s*0.62); c.lineTo(x+s*0.66,y+s*0.86); c.lineTo(x+s*0.5,y+s); c.stroke(); c.fillStyle='rgba(20,15,30,.18)'; c.fillRect(x,y,s,s); }
  if(flash>0){ c.fillStyle='rgba(255,255,255,'+Math.min(0.8,flash*6)+')'; c.fillRect(x,y,s,s); }
  c.restore();
  rr(c,x+0.5,y+0.5,s-1,s-1,4); c.strokeStyle=INK; c.lineWidth=2.4; c.stroke();
}

function drawCrewBody(c,type,x,fy,t,pirate){

function hullPath(c,w){

  c.bezierCurveTo(L+2,44,L-8,34,L-8,18);

  c.closePath();
}

function drawScaffold(c,s){

function drawCell(c,s,cell,t){

function hangarLayout(){

function makeLevel(L){
  const boss=L%5===0, len=2000+Math.min(L,25)*120, ev=[];
  const g=Math.min(4,1+Math.floor(L/3)), bm=Math.min(3,Math.floor(L/2));
  ev.push({at:160, type:'wave', g:Math.min(g,3), b:0});
  ev.push({at:520, type:'chest'});
  ev.push({at:800, type:'ship', kind:L<=2?'scout':'frigate'});
  ev.push({at:1150, type:'wave', g, b:bm});
  if(L>=4&&!boss) ev.push({at:1420, type:'ship', kind:'scout'});
  ev.push({at:Math.round(len*0.64), type:'chest'});
  if(L>=2) ev.push({at:len-700, type:'wave', g:Math.min(5,g+1), b:Math.min(4,bm+1)});
  ev.push({at:len-380, type:'ship', kind:boss?'boss':L>=3?'frigate':'scout'});
  ev.sort((a,b)=>a.at-b.at);
  return {len, ev, boss};
}
let hudTopPx=60;
function battleLayout(){

  cam.gsy=H-(LAND?32:150);

function targetScale(){
  let need=380;
  for(const s of ships){
    if(s.dead) continue;
    if(s!==P&&s.x-cam.x>W/cam.s+200) continue;
    let top=-s.topRows*B-34; for(const b of s.balloons) if(b.alive) top=Math.min(top,b.ly-b.R);
    need=Math.max(need,-(s.cruiseY+top)+26);

}

/* ================= particles & fx ================= */
function addP(o){ if(parts.length<650) parts.push(o); }
function shakeAdd(v){ shake=Math.min(16,shake+v*(reduceMotion?0.25:1)); }
function addText(x,y,txt,col,size,big){ addP({t:big?'banner':'text', x:x+rand(-6,6), y, vx:0, vy:big?-30:-70, life:big?1.3:0.75, max:big?1.3:0.75, txt, c:col, size:size||16}); }
function puff(x,y,n,col,sz){ for(let i=0;i<n;i++) addP({t:'smoke', x:x+rand(-8,8), y:y+rand(-8,8), vx:rand(-30,30), vy:rand(-40,-8), r:rand(5,10)*(sz||1), gr:rand(10,22), life:rand(0.5,1), max:1, c:col||'#eef0f6'}); }
function explosion(x,y,size){

  for(let i=0;i<6;i++) addP({t:'smoke', x:x+rand(-10,10), y:y+rand(-10,10), vx:rand(-40,40), vy:rand(-50,-10), r:size*rand(0.25,0.4), gr:rand(15,30), life:rand(0.7,1.2), max:1.2, c:'#5e5866'});

function addDebris(x,y,mat,n){ for(let i=0;i<n;i++) addP({t:'debris', x:x+rand(-10,10), y:y+rand(-10,10), vx:rand(-160,160), vy:rand(-260,-60), w:rand(6,13), h:rand(5,10), rot:rand(0,TAU), vr:rand(-10,10), life:rand(1,1.8), max:1.8, c:pick([mat.base,mat.dark,mat.light])}); }
function popFx(x,y,R,look){
  addP({t:'ring', x, y, r:R*0.6, gr:R*6, life:0.3, max:0.3, c:'#ffffff'});
  for(let i=0;i<14;i++){ const a=rand(0,TAU), sp=rand(80,260); addP({t:'shred', x:x+Math.cos(a)*R*0.6, y:y+Math.sin(a)*R*0.6, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-60, rot:rand(0,TAU), vr:rand(-12,12), s:rand(5,10), life:rand(0.8,1.4), max:1.4, c:i%2?look.a:look.b}); }
}
function addChute(x,y,crew,pirate){ addP({t:'chute', x, y, vx:rand(-20,20), vy:-40, life:5, max:5, crew, pirate, age:0}); }
function addLoose(x,y,b){ addP({t:'loose', x, y, vx:rand(-20,20), vy:-30, life:4, max:4, R:b.R, look:b.look, armor:b.armor}); }
function bolt(a,b){ const pts=[a]; const n=6; for(let i=1;i<n;i++){ const u=i/n; pts.push({x:lerp(a.x,b.x,u)+rand(-12,12), y:lerp(a.y,b.y,u)+rand(-12,12)}); } pts.push(b); addP({t:'bolt', pts, x:0, y:0, vx:0, vy:0, life:0.2, max:0.2}); }
function spawnCoins(wx,wy,amount){
  if(!run||amount<=0) return;
  run.coins+=amount;
  const n=Math.min(12,Math.max(1,Math.round(amount/5)));
  const sx=(wx-cam.x)*cam.s, sy=(wy-cam.y)*cam.s;
  for(let i=0;i<n;i++) coinsFx.push({x:sx, y:sy, vx:rand(-140,140), vy:rand(-300,-140), t:0, delay:i*0.035, val:amount/n, spin:rand(0,6)});
}

/* ================= damage ================= */
function damage(p,amt,hx,hy){
  if(!partAlive(p)) return;
  amt=Math.max(1,Math.round(amt));
  p.hp-=amt; p.hit=0.12;
  const own=p.kind==='flier'?-1:p.ship.side;
  addText(hx,hy-8,String(amt),own===1?'#ff9b8a':(p.kind==='balloon'?'#ffe066':'#ffffff'),own===1?14:16);
  if(p.hp<=0){ p.hp=0; destroyPart(p); }
}
function heal(p,amt){
  if(!partAlive(p)) return;
  const v=Math.min(p.max-p.hp,Math.round(amt)); if(v<=0) return;
  p.hp+=v; const q=partPos(p); addText(q.x,q.y-10,'+'+v,'#7dff8a',15);
  for(let i=0;i<4;i++) addP({t:'heal', x:q.x+rand(-12,12), y:q.y+rand(-10,10), vx:0, vy:-40, life:0.6, max:0.6});
}
function destroyPart(p){
  if(run&&run.focus===p) run.focus=null;
  if(p.kind==='cell'){
    p.alive=false; const s=p.ship, q=cellPos(s,p);
    addDebris(q.x,q.y,MATS[s.matTier],8); puff(q.x,q.y,4);
    if(p.type==='crew') addChute(q.x,q.y-6,p.crew,s.spec.pirate);
    Snd.play('crunch'); shakeAdd(2);
  } else if(p.kind==='balloon'){
    p.alive=false; const q=balPos(p.ship,p);
    popFx(q.x,q.y,p.R,BLOOK[p.look]||BLOOK.player); Snd.play('pop'); shakeAdd(3);
    if(p.ship.side===-1) addText(q.x,q.y-p.R,'ПУФ!','#ffffff',24,true);
    else if(run){ run.lostBalloon=true; if(!run.balWarned){ run.balWarned=true; toast('Баллон лопнул! Подъём упал',2.2); } }
  } else if(p.kind==='hull'){
    killShip(p.ship,'destroyed');
  } else if(p.kind==='flier'){
    p.dead=true;
    if(p.sub==='chest'){ popFx(p.x,p.y,p.r,BLOOK.gold); addP({t:'crate', x:p.x, y:p.y+26, vx:0, vy:-40, rot:0, vr:rand(-2,2), life:2.2, max:2.2}); Snd.play('pop'); addText(p.x,p.y-24,'Клад!','#ffe066',22,true); }
    else { explosion(p.x,p.y,p.sub==='bomb'?30:20); Snd.play('boom',0.6); if(p.sub==='glider') addChute(p.x,p.y,'gunner',true); }
    spawnCoins(p.x,p.y,p.reward);
  }
}
function killShip(s,how){
  if(s.dead) return;
  s.dead=true; s.hull.alive=false;
  s.vy=how==='crash'?0:-30; s.rotV=(s.side===1?1:-1)*rand(0.25,0.45);
  if(run&&run.focus&&run.focus.ship===s) run.focus=null;
  for(const c of s.cells) if(c.alive&&c.type==='crew'){ const q=cellPos(s,c); addChute(q.x,q.y-6,c.crew,s.spec.pirate); }
  for(const b of s.balloons) if(b.alive){ const q=balPos(s,b); addLoose(q.x,q.y,b); b.alive=false; }
  explosion(s.x,s.y+14,46); Snd.play('boom');
  if(how==='crash'){ crashFx(s); }
  if(s.side===-1&&run){
    const bonus=how==='crash'?1.5:1;
    spawnCoins(s.x,how==='crash'?-30:s.y,Math.round(s.spec.reward*bonus));
    addText(s.x,(how==='crash'?-60:s.y-60),how==='crash'?'СБИТ! ×1,5':'РАЗГРОМЛЕН!','#ffe066',30,true);
    if(run.tut&&run.tutStep<2){ run.tutStep=2; setTimeout(()=>{ if(mode==='battle'&&run&&!run.over) toast('Когда враг рядом, жмите «Таран» — удар носом корабля',3.4); },1400); }
  }
}
function crashFx(s){
  s.gone=true;
  explosion(s.x,-8,70);
  for(const c of s.cells) if(c.alive){ const q=cellPos(s,c); addDebris(q.x,Math.min(q.y,-10),MATS[s.matTier],3); }
  addDebris(s.x,-10,{base:'#b36f36',dark:'#7c4520',light:'#dc9d5f'},10);
  puff(s.x,-10,10,'#7a7484',2.2);
  Snd.play('boom'); shakeAdd(10);
}

/* ================= combat logic ================= */
function shipParts(s,withBal){ const a=[]; for(const c of s.cells) if(c.alive) a.push(c); a.push(s.hull); if(withBal) for(const b of s.balloons) if(b.alive) a.push(b); return a; }
function nearest(from,list,maxD){ let best=null, bd=(maxD||RANGE)*(maxD||RANGE); for(const p of list){ const q=partPos(p); const d=(q.x-from.x)*(q.x-from.x)+(q.y-from.y)*(q.y-from.y); if(d<bd){ bd=d; best=p; } } return best; }
function hostileShips(side){ return ships.filter(o=>o.side!==side&&!o.dead); }
function pickTarget(s,cell){
  const type=cell.crew, from=muzzleBase(s,cell);
  if(type==='mechanic'){ let best=null, br=0.97; for(const p of shipParts(s,true)){ const r=p.hp/p.max*(p.kind==='balloon'?0.85:1); if(r<br){ br=r; best=p; } } return best; }
  const foes=hostileShips(s.side);
  const fl=s.side===1?fliers.filter(f=>!f.dead&&!f.neutral):[];
  const parts=[]; for(const o of foes) for(const c of o.cells) if(c.alive) parts.push(c); for(const o of foes) parts.push(o.hull);
  let t=null;
  if(type==='harpoon'){
    const bals=[]; for(const o of foes) for(const b of o.balloons) if(b.alive) bals.push(b);
    t=nearest(from,bals)||nearest(from,fl.filter(f=>f.sub==='bomb'))||nearest(from,fl)||nearest(from,parts);
  } else if(type==='cannon'){
    const crewCells=parts.filter(p=>p.kind==='cell'&&p.type==='crew'&&Math.hypot(partPos(p).x-from.x,partPos(p).y-from.y)<RANGE);
    t=crewCells.length?pick(crewCells):(nearest(from,parts)||nearest(from,fl.filter(f=>f.sub==='glider'))||nearest(from,fl));
  } else if(type==='tesla'){
    t=nearest(from,fl,520)||nearest(from,parts)||nearest(from,fl);
  } else {
    t=nearest(from,fl,520)||nearest(from,parts)||nearest(from,fl);
  }
  if(!t&&s.side===1) t=nearest(from,fliers.filter(f=>!f.dead&&f.neutral),560);
  return t;
}
function fire(s,cell,tg,from,tp){
  const type=cell.crew, side=s.side, dmg=crewDmg(type,cell.lvl)*(s.spec.dmgMul||1);
  let tx=tp.x, ty=tp.y; if(side===-1){ tx+=rand(-14,14); ty+=rand(-14,14); }
  const dx=tx-from.x, dy=ty-from.y, dd=Math.hypot(dx,dy)||1;
  const mx=from.x+dx/dd*22, my=from.y+dy/dd*22;
  cell.recoil=1;
  if(type==='gunner'){
    const sp=side===1?780:560, a=Math.atan2(dy,dx)+rand(-0.025,0.025);
    projs.push({type:'bullet', side, x:mx, y:my, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, g:0, dmg, rad:3, life:2});
    Snd.play('shot',side===1?0.6:0.35); puff(mx,my,1,'#ffffff',0.6);
  } else if(type==='cannon'){
    const T=0.75+dd/700, g=520; projs.push({type:'ball', side, x:mx, y:my, vx:(tx-mx)/T, vy:(ty-my-0.5*g*T*T)/T, g, dmg, rad:6, splash:50, life:T+2, trail:0});
    Snd.play('cannon',side===1?0.8:0.5); puff(mx,my,3,'#ffffff',0.9); shakeAdd(side===1?1:0.5);
  } else if(type==='harpoon'){
    const sp=680, T=dd/sp, g=160; projs.push({type:'harpoon', side, x:mx, y:my, vx:(tx-mx)/T, vy:(ty-my-0.5*g*T*T)/T, g, dmg, rad:4, life:T+2});
    Snd.play('harpoon',side===1?0.8:0.5);
  } else if(type==='tesla'){
    zap(s,from,tg,dmg);
  } else if(type==='mechanic'){
    projs.push({type:'repair', side, x:from.x, y:from.y-6, vx:0, vy:-80, target:tg, heal:crewHeal(cell.lvl)*(side===1?1:s.spec.dmgMul), life:3});
    cell.act=0.7; Snd.play('heal',0.7);
  }
}
function zap(s,from,first,dmg){
  const hit=[first]; let last=first;
  const pool=[]; for(const o of hostileShips(s.side)) for(const p of shipParts(o,true)) pool.push(p);
  if(s.side===1) for(const f of fliers) if(!f.dead&&!f.neutral) pool.push(f);
  for(let i=0;i<3;i++){ const lp=partPos(last); let best=null, bd=170*170; for(const p of pool){ if(hit.indexOf(p)>=0) continue; const q=partPos(p); const d2=(q.x-lp.x)*(q.x-lp.x)+(q.y-lp.y)*(q.y-lp.y); if(d2<bd){ bd=d2; best=p; } } if(!best) break; hit.push(best); last=best; }
  const pos=hit.map(partPos); let prev=from;
  hit.forEach((p,i)=>{ bolt(prev,pos[i]); damage(p,dmg*Math.pow(0.85,i),pos[i].x,pos[i].y); prev=pos[i]; });
  Snd.play('zap',s.side===1?0.8:0.5);
}
function updateCrew(s,dt){
  for(const cell of s.cells){
    if(cell.hit>0) cell.hit-=dt;
    if(!cell.alive||cell.type!=='crew') continue;
    cell.recoil=Math.max(0,cell.recoil-dt*4); cell.act=Math.max(0,cell.act-dt);
    cell.cd-=dt; cell.retarget-=dt;
    let tg=cell.target;
    if(s.side===1&&run.focus&&partAlive(run.focus)&&cell.crew!=='mechanic') tg=run.focus;
    else if(!partAlive(tg)||cell.retarget<=0||(cell.crew==='mechanic'&&tg&&tg.hp>=tg.max)||tg===run.focus&&s.side===1&&!run.focus){ tg=pickTarget(s,cell); cell.retarget=0.7; }
    if(tg&&!partAlive(tg)) tg=null;
    cell.target=tg;
    const from=muzzleBase(s,cell);
    if(tg){
      const tp=partPos(tg), dx=tp.x-from.x, dy=tp.y-from.y, d=Math.hypot(dx,dy);
      if(cell.crew!=='mechanic'){ let la=Math.atan2(dy,dx*s.side); if(cell.crew==='cannon') la-=0.45; la=clamp(la,-1.3,0.95); cell.aim=lerp(cell.aim,la,1-Math.exp(-10*dt)); }
      if(cell.cd<=0&&d<RANGE){ fire(s,cell,tg,from,tp); cell.cd=crewRate(cell.crew,cell.lvl)*(s.side===1?1:1.15)*rand(0.94,1.06); }
    } else cell.aim=lerp(cell.aim,-0.15,dt*2);
  }
  for(const b of s.balloons) if(b.hit>0) b.hit-=dt;
  if(s.hull.hit>0) s.hull.hit-=dt;
}
function contactShip(s,x,y,r){
  for(const b of s.balloons){ if(!b.alive) continue; const q=balPos(s,b); const dx=(x-q.x)/(b.R*0.9+r), dy=(y-q.y)/(b.R+r); if(dx*dx+dy*dy<1) return b; }
  for(const c of s.cells){ if(!c.alive) continue; const q=cellPos(s,c); if(Math.abs(x-q.x)<B/2+r&&Math.abs(y-q.y)<B/2+r) return c; }
  const h=hullRect(s); if(x>h.x0-r&&x<h.x1+r&&y>h.y0-r&&y<h.y1+r) return s.hull;
  return null;
}
function hitTest(p){
  if(p.side===1){ for(const f of fliers){ if(f.dead) continue; const dx=p.x-f.x, dy=p.y-f.y; if(dx*dx+dy*dy<(f.r+p.rad)*(f.r+p.rad)){ onHit(p,f); return true; } } }
  for(const s of ships){ if(s.side===p.side||s.dead) continue; const part=contactShip(s,p.x,p.y,p.rad); if(part){ onHit(p,part); return true; } }
  return false;
}
function onHit(p,part){
  let dmg=p.dmg;
  if(p.type==='harpoon'&&part.kind==='balloon'){ dmg*=3; }
  if(p.type==='bullet'){ addP({t:'spark', x:p.x, y:p.y, vx:-p.vx*0.2+rand(-80,80), vy:rand(-120,0), life:0.2, max:0.2}); Snd.play('hit',0.5); }
  if(p.type==='harpoon'){ for(let i=0;i<4;i++) addP({t:'spark', x:p.x, y:p.y, vx:rand(-120,120), vy:rand(-150,20), life:0.25, max:0.25}); Snd.play('hit',0.7); }
  damage(part,dmg,p.x,p.y);
  if(p.type==='ball'){
    explosion(p.x,p.y,20); Snd.play('boom',0.45);
    const s=part.ship;
    if(s&&!s.dead){ for(const c of s.cells){ if(!c.alive||c===part) continue; const q=cellPos(s,c), d=Math.hypot(q.x-p.x,q.y-p.y); if(d<p.splash) damage(c,dmg*0.5*(1-d/p.splash*0.5),q.x,q.y); } if(part!==s.hull&&!s.dead){ const hr=hullRect(s); if(p.y>hr.y0-p.splash&&p.x>hr.x0&&p.x<hr.x1) damage(s.hull,dmg*0.35,p.x,hr.y0+6); } }
  }
}
function updateProjs(dt){
  for(const p of projs){
    if(p.dead) continue;
    if(p.type==='repair'){
      if(!partAlive(p.target)){ p.dead=true; continue; }
      const q=partPos(p.target), dx=q.x-p.x, dy=q.y-p.y, d=Math.hypot(dx,dy)||1;
      if(d<12){ heal(p.target,p.heal); p.dead=true; continue; }
      const k=1-Math.exp(-6*dt); p.vx=lerp(p.vx,dx/d*380,k); p.vy=lerp(p.vy,dy/d*380,k);
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0) p.dead=true; continue;
    }
    const sp=Math.hypot(p.vx,p.vy), steps=Math.max(1,Math.ceil(sp*dt/10)), sdt=dt/steps;
    for(let i=0;i<steps;i++){ p.vy+=p.g*sdt; p.x+=p.vx*sdt; p.y+=p.vy*sdt; if(hitTest(p)){ p.dead=true; break; } }

      case 'fire': c.globalAlpha=Math.min(1,k*1.6); circ(c,p.x,p.y,Math.max(0.5,p.r*(0.4+k*0.6))); c.fillStyle=k>0.65?'#fff2a8':k>0.35?'#ffb43a':'#ff6a2a'; c.fill(); break;
      case 'spark': c.globalAlpha=k; c.strokeStyle='#ffe27a'; c.lineWidth=2.2; line(c,p.x,p.y,p.x-p.vx*0.03,p.y-p.vy*0.03); break;
      case 'ring': c.globalAlpha=k; c.lineWidth=5*k+0.5; c.strokeStyle=p.c; circ(c,p.x,p.y,p.r); c.stroke(); break;
      case 'flash': { c.globalAlpha=k; const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r); g.addColorStop(0,'rgba(255,255,230,1)'); g.addColorStop(1,'rgba(255,220,120,0)'); c.fillStyle=g; circ(c,p.x,p.y,p.r); c.fill(); break; }
      case 'debris': c.globalAlpha=Math.min(1,k*3); c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.fillStyle=p.c; c.fillRect(-p.w/2,-p.h/2,p.w,p.h); c.lineWidth=1.5; c.strokeStyle=INK; c.strokeRect(-p.w/2,-p.h/2,p.w,p.h); c.restore(); break;
      case 'shred': c.globalAlpha=Math.min(1,k*2); c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.beginPath(); c.moveTo(-p.s,-p.s*0.4); c.lineTo(p.s,-p.s*0.6); c.lineTo(p.s*0.2,p.s*0.7); c.closePath(); c.fillStyle=p.c; c.fill(); c.lineWidth=1.2; c.strokeStyle=INK; c.stroke(); c.restore(); break;
      case 'text': { c.globalAlpha=Math.min(1,k*2.5); c.font=p.size+'px "Russo One", "Arial Black", sans-serif'; c.textAlign='center'; c.lineWidth=4; c.strokeStyle=INK; c.strokeText(p.txt,p.x,p.y); c.fillStyle=p.c; c.fillText(p.txt,p.x,p.y); break; }
      case 'banner': { const age=p.max-p.life; const sc=age<0.15?0.4+age/0.15*0.8:age<0.25?1.2-(age-0.15)*2:1; c.globalAlpha=Math.min(1,k*3); c.save(); c.translate(p.x,p.y); c.scale(sc,sc); c.font=p.size+'px "Russo One", "Arial Black", sans-serif'; c.textAlign='center'; c.lineWidth=7; c.strokeStyle=INK; c.strokeText(p.txt,0,0); c.fillStyle=p.c; c.fillText(p.txt,0,0); c.restore(); break; }
      case 'bolt': c.globalAlpha=k; for(const [lw,col] of [[7,'rgba(180,120,255,.6)'],[3,'#e9d8ff'],[1.4,'#ffffff']]){ c.lineWidth=lw; c.strokeStyle=col; c.beginPath(); p.pts.forEach((q,i)=>i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y)); c.stroke(); } break;
      case 'chute': { c.globalAlpha=Math.min(1,k*3); c.save(); c.translate(p.x,p.y); c.rotate(Math.sin(p.age*2)*0.15); const open=Math.min(1,p.age*2.5);
        c.strokeStyle='#4a3a2a'; c.lineWidth=1.2; line(c,-16*open,-40,0,-14); line(c,16*open,-40,0,-14); line(c,0,-40,0,-14);
        c.beginPath(); c.ellipse(0,-40,17*open+1,13*open+1,0,Math.PI,TAU); c.closePath(); c.fillStyle=p.pirate?'#2f2a40':'#fff1d6'; c.fill(); c.lineWidth=2; c.strokeStyle=INK; c.stroke();
        c.beginPath(); c.ellipse(0,-40,6*open+0.5,13*open+1,0,Math.PI,TAU); c.closePath(); c.fillStyle=p.pirate?'#c8302b':'#e8483b'; c.fill(); c.stroke();
        c.scale(0.85,0.85); drawCrewBody(c,p.crew,0,10,p.age,p.pirate); c.restore(); break; }
      case 'loose': { c.globalAlpha=Math.min(1,k*2); c.save(); c.translate(p.x,p.y); c.strokeStyle='#4a3a2a'; c.lineWidth=1.4; line(c,-5,p.R*0.9,-8+Math.sin(p.life*4)*3,p.R+22); line(c,5,p.R*0.9,8+Math.sin(p.life*4)*3,p.R+22); drawBalloon(c,{lx:0,ly:0,R:p.R,hp:1,max:1,wob:0,hit:0,armor:p.armor,look:p.look,patches:[]},0); c.restore(); break; }
      case 'bag': drawBag(c,p.x,p.y,1.3); break;
      case 'crate': { c.save(); c.translate(p.x,p.y); c.rotate(p.rot); rr(c,-12,-8,24,16,3); c.fillStyle='#a8692f'; c.fill(); c.lineWidth=2; c.strokeStyle=INK; c.stroke(); c.fillStyle='#e2ab3c'; c.fillRect(-12,-3,24,3.5); c.restore(); break; }
      case 'heal': c.globalAlpha=k; c.fillStyle='#7dff8a'; c.fillRect(p.x-1.5,p.y-5,3,10); c.fillRect(p.x-5,p.y-1.5,10,3); break;
    }
  }
  c.globalAlpha=1;
}

/* ================= HUD ================= */
let lastShownCoins=-1;
function updateHUD(){
  if(!run) return;
  hudT-=1/60; if(hudT>0) return; hudT=0.1;
  const prog=clamp((P.x-run.startX)/run.len,0,1);
  $('routeFill').style.width=(prog*100)+'%'; $('routeShip').style.left=(prog*100)+'%';
  for(const e of run.ev) if(e.mark&&e.ship&&e.ship.dead) e.mark.classList.add('done');
  const sc=Math.floor(run.shown+0.001); if(sc!==lastShownCoins){ lastShownCoins=sc; $('bCoins').textContent=fmt(sc); }
  const alt=Math.max(0,Math.round(-(P.y+HULL_H)*5));
  $('altVal').textContent=alt+' м';
  const wgt=Math.round(shipWeight(P)), lift=Math.round(P.dead?0:effLift(P)), max=Math.max(wgt,lift,1)*1.2;
  $('bLift').textContent=lift; $('bWeight').textContent=wgt;
  $('bLiftBar').style.width=(lift/max*100)+'%'; $('bWeightMark').style.left=(wgt/max*100)+'%';
  $('bMeter').classList.toggle('bad',lift<wgt);
  const hr=P.dead?0:P.hull.hp/P.hull.max;
  $('bHullBar').style.width=(hr*100)+'%'; $('bHull').textContent=Math.ceil(P.dead?0:P.hull.hp);
  $('warn').hidden=!(P.sinking&&!P.dead&&!run.over);
  const ne=nearestEnemy(), canRam=!P.dead&&!P.ram&&ne.s&&ne.gap<430;
  const cdp=P.ramT>0?clamp(P.ramT/P.spec.ramCd,0,1)*100:0;
  const rb=$('ramBtn'); rb.style.setProperty('--p',cdp.toFixed(1)); rb.classList.toggle('off',!canRam||P.ramT>0);
  const bb=$('ballastBtn'); $('ballastN').textContent=run.ballast; bb.classList.toggle('off',run.ballast<=0||P.dead);
  if(run.tut&&run.tutStep===2&&canRam&&P.ramT<=0&&!run.ramHinted){ run.ramHinted=true; }
}
function useRam(){
  if(!run||P.dead||run.over) return;
  const ne=nearestEnemy();
  if(P.ramT>0){ toast('Таран перезаряжается: '+fmt1(P.ramT)+' с',1.4); return; }
  if(!ne.s||ne.gap>=430){ toast('Таран: враг слишком далеко',1.4); return; }
  startRam(P,ne.s);
}
function useBallast(){
  if(!run||P.dead||run.over) return;
  if(run.ballast<=0){ toast('Балласт уже сброшен',1.4); return; }
  run.ballast--; P.weightMul=0.7;
  for(let i=0;i<5;i++) addP({t:'bag', x:P.x+rand(-P.w/2,P.w/2), y:P.y+HULL_H, vx:0, vy:rand(0,60), rot:0, vr:rand(-3,3), life:4, max:4});
  addText(P.x+P.w/2+30,P.y+80,'−30% веса','#7dff8a',20,true); Snd.play('bag');
}
function battleTap(sx,sy){
  if(!run||run.over) return;
  const wx=sx/cam.s+cam.x, wy=sy/cam.s+cam.y, tol=16/cam.s;
  let hit=null;
  for(const f of fliers){ if(f.dead) continue; const oy=f.sub==='chest'?12:f.sub==='bomb'?10:0; if(Math.hypot(wx-f.x,wy-f.y-oy)<f.r+tol+(f.sub!=='glider'?10:6)){ hit=f; break; } }
  if(!hit) for(const s of ships){ if(s.side!==-1||s.dead) continue; const p=contactShip(s,wx,wy,tol*0.6); if(p){ hit=p; break; } }
  if(hit){ run.focus=hit; Snd.play('click'); if(run.tut&&run.tutStep===1){ run.tutStep=1.5; } }
  else if(run.focus){ run.focus=null; }
}

/* ================= results ================= */
function showResult(win){
  const L=run.L;
  if(win){
    const bonus=40+20*L, total=run.coins+bonus;
    const hr=P.hull.hp/P.hull.max, stars=hr>=0.7&&!run.lostBalloon?3:hr>=0.35?2:1;
    save.coins+=total; save.level=L+1; save.maxLevel=Math.max(save.maxLevel,L+1); if(L>=1) save.tutorial=false; persist();
    const unlock=CREW_IDS.find(id=>CREW[id].unlockAt===L+1);
    showModal('<h2 class="mtitle win outlined">Победа!</h2><div class="stars">'+[1,2,3].map(i=>'<div class="star'+(i<=stars?' on':'')+'"></div>').join('')+'</div>'+
      '<div class="rows"><div>Добыча в бою <b><i class="coin"></i>+'+fmt(run.coins)+'</b></div><div>Награда за рейс <b><i class="coin"></i>+'+fmt(bonus)+'</b></div><div class="tot">Всего <b><i class="coin"></i>+'+fmt(total)+'</b></div></div>'+
      (unlock?'<p class="mtip">В таверне ждёт новый боец: <b>'+CREW[unlock].name+'</b>. Наймите его во вкладке «Экипаж».</p>':'<p class="mtip">'+pick(TIPS)+'</p>')+
      '<div class="macts"><button class="btn ghost" data-act="hangar">В ангар</button><button class="btn go" data-act="next">Рейс '+(L+1)+'</button></div>');
  } else {
    save.coins+=run.coins; persist();
    showModal('<h2 class="mtitle lose outlined">Корабль сбит</h2><div class="rows"><div>Добыча сохранена <b><i class="coin"></i>+'+fmt(run.coins)+'</b></div></div><p class="mtip">'+pick(TIPS)+'</p>'+
      '<div class="macts"><button class="btn ghost" data-act="retry">Ещё раз</button><button class="btn go" data-act="hangar">Улучшить</button></div>');
    Snd.play('lose');
  }
}
function showPause(){
  paused=true;
  showModal('<h2 class="mtitle outlined">Пауза</h2><p class="mtip">Рейс '+run.L+'. Добыча сейчас: <b>'+fmt(run.coins)+'</b>. Если вернуться в ангар, монеты останутся у вас.</p>'+
    '<div class="macts"><button class="btn ghost" data-act="quit">В ангар</button><button class="btn go" data-act="resume">Дальше</button></div>');
}

/* ================= loop & input ================= */
function resize(){
  const r=app.getBoundingClientRect(); W=Math.max(1,r.width); H=Math.max(1,r.height);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  LAND=W>H*1.05; app.classList.toggle('land',LAND); app.classList.toggle('port',!LAND);
  _safeTop=null;
  if(mode==='battle'){ battleLayout(); updateCoinTarget(); }
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const rdt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now;
  if(toastT>0){ toastT-=rdt; if(toastT<=0) $('toast').hidden=true; }
  try{
    if(mode==='hangar'){ gt+=rdt; updateHangar(rdt); renderHangar(); }
    else {
      if(!paused){ for(let i=0;i<speedMul;i++){ gt+=rdt; updateBattle(rdt); } }
      renderBattle();
    }
  }catch(e){ console.error(e); }
}
function bindUI(){
  cv.addEventListener('pointerdown',e=>{ Snd.init(); const r=cv.getBoundingClientRect(); const sx=e.clientX-r.left, sy=e.clientY-r.top; if(mode==='hangar') hangarTap(sx,sy); else if(!paused) battleTap(sx,sy); });
  document.addEventListener('pointerdown',()=>Snd.init(),{capture:true});
  $('tabs').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(!b) return; Snd.play('click'); setTab(b.dataset.tab); });
  $('sheetBody').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.buy) buy(b.dataset.buy);
    else if(b.dataset.hire) crewAction(b.dataset.hire,true);
    else if(b.dataset.crew) crewAction(b.dataset.crew,false);
    else if(b.dataset.tool){ tool=b.dataset.tool; Snd.play('click'); renderSheet(); }
  });
  $('fightBtn').addEventListener('click',()=>{
    Snd.init();
    const w=designWeight(), l=designLift();
    if(w>l){ toast('Перегруз! Улучшите баллоны или уберите блоки'); const lb=$('liftBox'); lb.classList.remove('shake'); void lb.offsetWidth; lb.classList.add('shake'); return; }
    if(!CREW_IDS.some(id=>id!=='mechanic'&&isPlaced(id))){ toast('Посадите на борт хотя бы одного бойца'); setTab('yard'); return; }
    Snd.play('click'); startBattle(save.level);
  });
  $('soundBtn').addEventListener('click',()=>{ save.sound=!save.sound; persist(); syncSound(); if(save.sound){ Snd.init(); Snd.play('click'); } });
  $('pauseBtn').addEventListener('click',()=>{ if(mode==='battle'&&run&&!run.over) showPause(); });
  $('speedBtn').addEventListener('click',()=>{ speedMul=speedMul===1?2:1; $('speedBtn').textContent='×'+speedMul; Snd.play('click'); });
  $('ramBtn').addEventListener('click',useRam);
  $('ballastBtn').addEventListener('click',useBallast);
  $('modal').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]'); if(!b) return; Snd.play('click');
    const a=b.dataset.act;
    if(a==='hangar') backToHangar();
    else if(a==='next') startBattle(save.level);
    else if(a==='retry') startBattle(run?run.L:save.level);
    else if(a==='resume'){ hideModal(); paused=false; }
    else if(a==='quit'){ save.coins+=run.coins; persist(); backToHangar(); }
  });
  window.addEventListener('keydown',e=>{
    if(mode!=='battle'||!run) return;
    if(e.code==='Space'){ e.preventDefault(); useRam(); }
    else if(e.key==='b'||e.key==='и'||e.key==='B'||e.key==='И') useBallast();
    else if(e.key==='Escape'){ if(paused){ hideModal(); paused=false; } else if(!run.over) showPause(); }
  });
  window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&mode==='battle'&&run&&!run.over&&!paused) showPause(); });
}
function syncSound(){ $('soundIc').src=icon(save.sound?'sound-on':'sound-off'); $('soundBtn').setAttribute('aria-pressed',String(save.sound)); $('soundBtn').setAttribute('aria-label',save.sound?'Звук включён':'Звук выключен'); }

function boot(data){
  save=(data&&data.save)?migrate(data.save):loadSave();
  resize();
  rebuildPreview();
  $('pauseIc').src=icon('pause'); $('ramIc').src=icon('ram'); $('ballastIc').src=icon('ballast');
  syncSound();
  bindUI();
  setTab('yard');
  requestAnimationFrame(t=>{ last=t; frame(t); });
  if(document.fonts&&document.fonts.load) document.fonts.load('20px "Russo One"').catch(()=>{});
  try{ window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({save})); }catch(e){}
  window.SkyBastions={ setSpeed:n=>{ speedMul=Math.max(1,Math.min(8,n|0)); }, cellScreen(c,r){ return {x:hox+(-preview.w/2+c*B+B/2)*hs, y:hoy-(r+0.5)*B*hs}; }, enemyBalloonScreen(){ for(const sh of ships){ if(sh.side!==-1||sh.dead) continue; const b=sh.balloons.find(x=>x.alive); if(b){ const q=balPos(sh,b); return {x:(q.x-cam.x)*cam.s, y:(q.y-cam.y)*cam.s}; } } return null; }, get state(){ return {mode, save, run:run&&{L:run.L,coins:run.coins,over:run.over,prog:P?P.x-run.startX:0,len:run.len}, ships:ships.length, fliers:fliers.length}; } };
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready) hot.ready(boot); else boot((hot&&hot.data)||{});
})();
</script>
