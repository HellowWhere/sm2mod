<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3f95e6">
<title>Небесные Бастионы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: full-bleed sky canvas. Hangar = shortcut rails on both sides of the ship stage + upgrade sheet (bottom in portrait, right in landscape). Battle = slim HUD bands. Map, wheel, shop and storage open as cards over the stage. */
:root{
  --ink:#1b2140;
  --panel:#2e3f70;
  --panel-deep:#202c55;
  --panel-soft:#3b4e87;
  --brass:#f5b833;
  --brass-deep:#c0850f;
  --go:#66d33e;
  --go-deep:#2f8f1d;
  --danger:#f0503f;
  --danger-deep:#a8291e;
  --gem:#3fd3ff;
  --gem-deep:#1478c4;
  --ad:#9b62ec;
  --ad-deep:#5b2fa6;
  --legend:#ffcc33;
  --legend-deep:#d4801a;
  --sky:#86c8f6;
  --sky-soft:#c4e7fc;
  --text:#ffffff;
  --muted:#c3cdee;
  --dim:#8c97bd;
  --coin-hi:#fff4a6;
  --coin:#ffd23f;
  --coin-deep:#de9512;
  --hl:rgba(255,255,255,.35);
  --sh:rgba(0,0,0,.22);
  --veil:rgba(14,20,48,.66);
  --f-display:"Russo One","Arial Black",Impact,system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--text);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:absolute;inset:0;pointer-events:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--coin-hi);outline-offset:2px}
img{max-width:100%}

/* ---------- shared chunky controls ---------- */
.btn{font-family:var(--f-display);font-size:18px;color:var(--text);border:3px solid var(--ink);border-radius:16px;padding:10px 16px;cursor:pointer;letter-spacing:.02em;text-shadow:0 2px 0 var(--sh);box-shadow:inset 0 -5px 0 var(--sh),inset 0 3px 0 var(--hl),0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s;pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--sh),inset 0 2px 0 var(--hl),0 1px 0 var(--ink)}
.btn:disabled{filter:grayscale(.8) brightness(.75);cursor:default}
.btn.go{background:linear-gradient(var(--go),var(--go-deep))}
.btn.gold{background:linear-gradient(var(--brass),var(--brass-deep))}
.btn.ghost{background:var(--panel-soft)}
.btn.ad{background:linear-gradient(var(--ad),var(--ad-deep))}
.btn.gem{background:linear-gradient(var(--gem),var(--gem-deep))}
.btn.small{font-size:14px;padding:7px 11px;border-radius:13px}
.btn img{width:22px;height:22px}
.pill{display:flex;align-items:center;gap:5px;background:var(--panel-deep);border:3px solid var(--ink);border-radius:999px;padding:2px 10px 2px 4px;font-family:var(--f-display);font-size:16px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text)}
.pill .ri{width:22px;height:22px;flex:none}
.pill.plus{cursor:pointer;padding-right:4px}
.plus-i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--go);border:2px solid var(--ink);font-family:var(--f-body);font-weight:800;font-size:15px;line-height:1;margin-left:2px}
.pill.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.15)}}
.coin{display:inline-block;flex:none;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--coin-hi) 0 20%,var(--coin) 22% 58%,var(--coin-deep) 60%);border:2px solid var(--ink);vertical-align:-4px}
.ii{width:20px;height:20px;vertical-align:-4px;flex:none}
.iconbtn{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:3px solid var(--ink);background:var(--panel-soft);box-shadow:inset 0 -4px 0 var(--sh),0 3px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.iconbtn img{width:28px;height:28px}
.iconbtn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--sh),0 1px 0 var(--ink)}
.outlined{text-shadow:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink)}
.badge{position:absolute;top:-5px;right:-2px;min-width:21px;height:21px;border-radius:999px;background:var(--danger);border:2px solid var(--ink);font-family:var(--f-body);font-weight:800;font-size:11px;line-height:17px;text-align:center;padding:0 4px;font-style:normal;color:var(--text);z-index:2}

/* ---------- hangar ---------- */
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.res{display:flex;gap:6px;align-items:center;pointer-events:auto;min-width:0;flex-wrap:wrap}
.rail{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.rail.l{left:max(10px,env(safe-area-inset-left,0px))}
.port .rail.r{right:max(10px,env(safe-area-inset-right,0px))}
.land .rail.r{right:calc(min(430px,46%) + 10px)}
.rbtn{position:relative;width:58px;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;padding:0;cursor:pointer}
.rb-ic{position:relative;width:48px;height:48px;border-radius:16px;background:radial-gradient(circle at 50% 30%,var(--panel-soft),var(--panel-deep));border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center}
.rbtn:active .rb-ic{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.rbtn img{width:34px;height:34px}
.rbtn > span{font-family:var(--f-display);font-size:10.5px;letter-spacing:.02em;white-space:nowrap;text-shadow:0 2px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink)}
.rbtn.hot .rb-ic{background:radial-gradient(circle at 50% 30%,var(--ad),var(--ad-deep))}
.sheet{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--ink);pointer-events:auto;box-shadow:0 -6px 0 var(--sh)}
.port .sheet{left:0;right:0;bottom:0;height:min(52%,470px);border-radius:24px 24px 0 0;border-bottom:none;border-left:none;border-right:none}
.land .sheet{right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 58px);width:min(430px,46%);border-radius:24px 0 0 0;border-right:none;border-bottom:none}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding-top:9px;padding-bottom:7px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.land .tabs{padding-left:10px}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--panel-deep);border:3px solid var(--ink);border-radius:13px;padding:3px 1px 4px;cursor:pointer;font-weight:800;font-size:10px;letter-spacing:.01em;color:var(--muted);box-shadow:0 3px 0 var(--ink);min-width:0}
.tab img{width:28px;height:28px}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-selected="true"]{background:linear-gradient(var(--brass),var(--brass-deep));color:var(--ink)}
.sheet-body{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:9px;padding-top:4px;padding-bottom:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.land .sheet-body{padding-left:12px}
.sheet-foot{display:flex;gap:10px;align-items:stretch;border-top:3px solid var(--ink);background:var(--panel-deep);padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.land .sheet-foot{padding-left:12px}
.liftbox{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.liftbox b{color:var(--text);font-family:var(--f-display);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}
.lb-row{display:flex;justify-content:space-between;gap:8px}
.meter{position:relative;height:12px;border-radius:999px;background:var(--ink);border:2px solid var(--ink);overflow:hidden}
.meter span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(var(--go),var(--go-deep));transition:width .25s}
.meter.bad span{background:linear-gradient(var(--danger),var(--danger-deep))}
.meter i{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--text);box-shadow:0 0 0 1px var(--ink)}
.lb-state{font-size:11.5px;color:var(--muted)}
.lb-state.bad{color:var(--coin)}
.liftbox.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fight{flex-direction:column;gap:0;padding:6px 16px;min-width:140px}
.fight .f1{font-size:23px;line-height:1.05;text-transform:uppercase}
.fight .f2{font-family:var(--f-body);font-weight:800;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.92;text-shadow:none;white-space:nowrap}

.hint{margin:0;font-size:13px;line-height:1.4;color:var(--muted);font-weight:500}
.hint b{color:var(--text)}
.sec{font-family:var(--f-display);font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--brass);margin:4px 2px -2px}
.card{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:10px;background:var(--panel-deep);border:3px solid var(--ink);border-radius:16px;padding:7px 9px}
.card .ic{width:54px;height:54px;border-radius:12px;background:var(--sky-soft);border:2px solid var(--ink)}
.card.locked .ic{filter:grayscale(1) brightness(.75)}
.card.legend{background:linear-gradient(135deg,var(--panel-deep),var(--ad-deep));border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--legend)}
.card.legend .ic{background:radial-gradient(circle,var(--coin-hi),var(--legend-deep))}
.card .info{min-width:0}
.nm{font-family:var(--f-display);font-size:16px;line-height:1.15;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px}
.lv{font-family:var(--f-body);font-weight:800;font-size:11px;color:var(--ink);background:var(--brass);border-radius:999px;padding:1px 7px;letter-spacing:.03em}
.lv.leg{background:linear-gradient(90deg,var(--legend),var(--ad))}
.ds{font-size:12.5px;line-height:1.35;color:var(--muted);font-weight:500;margin-top:2px}
.ds b{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
.ds b.up{color:var(--go)}
.note{color:var(--dim)}
.acts{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.buy{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--f-display);font-size:14px;color:var(--text);background:linear-gradient(var(--go),var(--go-deep));border:3px solid var(--ink);border-radius:13px;padding:6px 9px;cursor:pointer;box-shadow:inset 0 -4px 0 var(--sh),inset 0 2px 0 var(--hl),0 3px 0 var(--ink);text-shadow:0 2px 0 var(--sh);white-space:nowrap;font-variant-numeric:tabular-nums}
.buy:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--sh),0 1px 0 var(--ink)}
.buy[data-poor]{background:var(--panel-soft);color:var(--muted)}
.buy.gem{background:linear-gradient(var(--gem),var(--gem-deep));font-size:13px;padding:4px 8px}
.buy.ad{background:linear-gradient(var(--ad),var(--ad-deep))}
.buy.rub{background:linear-gradient(var(--brass),var(--brass-deep));color:var(--ink);text-shadow:none}
.buy .bl{font-family:var(--f-body);font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.buy .ii{width:18px;height:18px}
.buy .coin{width:17px;height:17px}
.maxed,.lock{font-family:var(--f-display);font-size:13px;color:var(--brass);padding:0 4px;text-align:center;line-height:1.15}
.lock{color:var(--dim);font-family:var(--f-body);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel-deep);border:3px solid var(--ink);border-radius:14px;padding:6px 4px 7px;cursor:pointer;box-shadow:0 3px 0 var(--ink);min-width:0}
.tool img{width:40px;height:40px}
.tool span{font-family:var(--f-display);font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool small{font-size:10px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.03em}
.tool small.on{color:var(--go)}
.tool.legend{box-shadow:inset 0 0 0 2px var(--legend),0 3px 0 var(--ink)}
.tool[aria-pressed="true"]{background:linear-gradient(var(--brass),var(--brass-deep));color:var(--ink)}
.tool[aria-pressed="true"] small{color:var(--ink)}
.yard-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:700}
.yard-stats b{color:var(--text);font-family:var(--f-display);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(var(--ad),var(--ad-deep));border:2px solid var(--ink);border-radius:999px;padding:1px 8px;font-weight:800;font-size:11px;color:var(--text);white-space:nowrap}

/* ---------- panels: map, wheel, shop, storage ---------- */
.panel{position:absolute;inset:0;z-index:25;background:var(--veil);display:flex;align-items:center;justify-content:center;pointer-events:auto;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pcard{width:min(540px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);overflow:hidden;animation:pop .25s cubic-bezier(.3,1.5,.5,1)}
.phead{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;background:var(--panel-deep);border-bottom:3px solid var(--ink)}
.phead h2{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;text-transform:uppercase;letter-spacing:.02em}
.phead .res{flex-wrap:nowrap}
.pbody{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.testnote{font-size:12px;line-height:1.4;font-weight:600;color:var(--ink);background:var(--coin);border:2px solid var(--ink);border-radius:12px;padding:7px 10px}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.offer{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--panel-deep);border:3px solid var(--ink);border-radius:16px;padding:10px 8px 8px;min-width:0}
.offer img.oi{width:64px;height:64px}
.offer .on{font-family:var(--f-display);font-size:14px;line-height:1.15}
.offer .oa{font-size:12px;color:var(--muted);font-weight:700;line-height:1.3}
.offer .oa b{color:var(--text)}
.offer .buy{width:100%}
.offer .tag{position:absolute;top:-8px;right:-6px;background:var(--danger);border:2px solid var(--ink);border-radius:999px;padding:1px 7px;font-weight:800;font-size:11px}
.offer.hot{box-shadow:inset 0 0 0 2px var(--brass)}
.starter{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;background:linear-gradient(135deg,var(--ad-deep),var(--panel-deep));border:3px solid var(--ink);border-radius:18px;padding:10px;box-shadow:inset 0 0 0 2px var(--legend)}
.starter img{width:76px;height:76px}
.starter .buy{margin-top:6px}
.locs{display:flex;flex-direction:column;gap:10px}
.loc{border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--panel-deep)}
.loc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;font-family:var(--f-display);font-size:15px}
.loc-head small{font-family:var(--f-body);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.9}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:10px 8px 8px;position:relative}
.nodes::before{content:"";position:absolute;left:10%;right:10%;top:33px;border-top:4px dashed var(--panel-soft)}
.node{position:relative;justify-self:center;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--panel-soft);font-family:var(--f-display);font-size:13px;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0;color:var(--text)}
.node.boss{width:52px;height:52px;margin-top:-3px}
.node img{width:30px;height:30px}
.node.done{background:linear-gradient(var(--go),var(--go-deep))}
.node.cur{background:linear-gradient(var(--brass),var(--brass-deep));animation:beat 1s infinite}
.node.lockd{background:var(--panel-deep);color:var(--dim);cursor:default}
@keyframes beat{50%{transform:scale(1.09)}}
.nst{display:flex;justify-content:center;gap:1px;margin-top:3px;height:12px}
.nst i{width:11px;height:11px;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%);background:var(--panel-soft)}
.nst i.on{background:var(--coin)}
.ncol{display:flex;flex-direction:column;align-items:center}
.circbar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--f-display);font-size:16px}
.wheel-wrap{position:relative;align-self:center;width:min(330px,100%);aspect-ratio:1}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.wheel-acts{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.odds{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12.5px;color:var(--muted);font-weight:600;background:var(--panel-deep);border:3px solid var(--ink);border-radius:14px;padding:8px 12px}
.odds b{color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
.linkbtn{background:none;border:none;color:var(--gem);font-weight:800;font-size:13px;cursor:pointer;text-decoration:underline;padding:2px;align-self:center}
.store-row{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;background:var(--panel-deep);border:3px solid var(--ink);border-radius:16px;padding:7px 9px}
.store-row img{width:60px;height:60px}

/* ---------- battle HUD ---------- */
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-top > *{pointer-events:auto}
.route{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.route-label{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-display);font-size:12.5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.route-label span{overflow:hidden;text-overflow:ellipsis;flex:none}
.route-label span + span{flex:0 1 auto;min-width:0}
.route-bar{position:relative;height:14px;background:var(--panel-deep);border:3px solid var(--ink);border-radius:999px;margin:0 8px}
#routeFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(var(--brass),var(--brass-deep))}
.mark{position:absolute;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);background-size:cover}
.mark.boss{width:26px;height:26px}
.mark.done{filter:grayscale(1) opacity(.55)}
#routeShip{position:absolute;top:50%;left:0;width:30px;height:30px;transform:translate(-50%,-55%);background-size:cover}
.speedbtn{font-family:var(--f-display);font-size:15px}
.powerchip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.gauges{pointer-events:none;width:158px;background:var(--veil);border:3px solid var(--ink);border-radius:16px;padding:7px 9px 8px;display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gauges b{font-family:var(--f-display);font-weight:400;color:var(--text);font-size:14px;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.g-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.meter.hull span{background:linear-gradient(var(--coin),var(--coin-deep))}
.abil{display:flex;gap:12px;align-items:flex-end}
.ability{pointer-events:auto;position:relative;width:72px;height:72px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 50% 35%,var(--panel-soft),var(--panel-deep));box-shadow:inset 0 -5px 0 var(--sh),0 4px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;overflow:hidden}
.ability.ram{width:84px;height:84px;background:radial-gradient(circle at 50% 35%,var(--danger),var(--danger-deep))}
.ability img{width:40px;height:40px;position:relative;z-index:1}
.ability.ram img{width:48px;height:48px}
.ab-name{position:relative;z-index:1;font-family:var(--f-display);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-top:-3px}
.ability::after{content:"";position:absolute;inset:0;background:conic-gradient(var(--veil) calc(var(--p,0)*1%),transparent 0);z-index:2;pointer-events:none}
.ability.off{filter:grayscale(.85) brightness(.8)}
.ability:active{transform:translateY(2px)}
.ab-count{position:absolute;top:2px;right:6px;z-index:3;background:var(--brass);color:var(--ink);font-weight:800;font-size:12px;border:2px solid var(--ink);border-radius:999px;min-width:20px;height:20px;line-height:16px;text-align:center}
.warn{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);font-family:var(--f-display);font-size:18px;color:var(--text);background:var(--danger);border:3px solid var(--ink);border-radius:12px;padding:4px 14px;text-transform:uppercase;letter-spacing:.04em;animation:pulse .7s infinite alternate;white-space:nowrap;pointer-events:none}
@keyframes pulse{to{transform:translateX(-50%) scale(1.08)}}

/* ---------- toast, modal, system overlays ---------- */
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);max-width:min(440px,calc(100% - 32px));width:max-content;background:var(--panel-deep);border:3px solid var(--ink);border-radius:14px;padding:9px 14px;font-size:14px;line-height:1.35;font-weight:700;text-align:center;box-shadow:0 4px 0 var(--ink);pointer-events:none;z-index:60}
.toast.show{animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
.modal{position:absolute;inset:0;background:var(--veil);display:grid;place-items:center;z-index:30;pointer-events:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);overflow-y:auto}
.mcard{width:min(400px,100%);background:var(--panel);border:4px solid var(--ink);border-radius:26px;padding:18px 16px 16px;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.mtitle{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.mtitle.win{color:var(--coin)}
.mtitle.lose{color:var(--danger)}
.mtitle.leg{color:var(--legend)}
.mimg{width:120px;height:120px;align-self:center}
.mimg.shake{animation:wobble .5s 2}
@keyframes wobble{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.stars{display:flex;justify-content:center;gap:6px}
.star{width:50px;height:50px;position:relative}
.star::before,.star::after{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%)}
.star::before{background:var(--ink)}
.star::after{inset:5px;background:var(--panel-deep)}
.star.on::after{background:linear-gradient(var(--coin-hi),var(--coin) 50%,var(--coin-deep))}
.star:nth-child(2){transform:translateY(-8px) scale(1.12)}
.rows{display:flex;flex-direction:column;gap:6px;background:var(--panel-deep);border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-weight:700;color:var(--muted);font-size:14px}
.rows div{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rows b{display:flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:400;color:var(--text);font-size:17px;font-variant-numeric:tabular-nums}
.rows .tot{border-top:2px dashed var(--panel-soft);padding-top:6px;color:var(--text)}
.rows .tot b{color:var(--coin);font-size:20px}
.rows .pop{animation:pop .35s both}
.mtip{font-size:13.5px;line-height:1.45;color:var(--muted);font-weight:500;margin:0;text-wrap:pretty}
.mtip b{color:var(--text)}
.macts{display:flex;gap:10px;flex-wrap:wrap}
.macts .btn{flex:1 1 140px}
.sys{position:absolute;inset:0;z-index:50;background:var(--ink);display:grid;place-items:center;pointer-events:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sys-card{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.sys-card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.sys-card p{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.sys-box{aspect-ratio:16/9;max-width:100%;border:3px solid var(--panel-soft);border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ad-deep),var(--panel-deep));font-family:var(--f-display);font-size:42px}
.sys-bar{height:8px;border-radius:999px;background:var(--panel-deep);overflow:hidden}
.sys-bar span{display:block;height:100%;width:0;background:var(--ad)}
.price{font-family:var(--f-display);font-size:30px;color:var(--coin)}
@media (prefers-reduced-motion:reduce){.warn,.toast.show,.mcard,.pcard,.pill.bump,.liftbox.shake,.node.cur,.mimg.shake,.rows .pop{animation:none}}
</style>
</head>
<body>
<div id="app" class="port">
  <canvas id="cv" aria-label="Небо и корабли"></canvas>

    <nav class="rail r" aria-label="Магазин и склад">

      <button class="rbtn" data-open="store"><span class="rb-ic"><img data-ic="crate-gold" alt=""><i class="badge" id="storeBadge" hidden>0</i></span><span>Склад</span></button>

        <button class="tab" role="tab" data-tab="crew"><img alt="" data-ic="crew-gunner"><span>Экипаж</span></button>
        <button class="tab" role="tab" data-tab="arsenal"><img alt="" data-ic="powder"><span>Арсенал</span></button>
        <button class="tab" role="tab" data-tab="bal"><img alt="" data-ic="blift"><span>Баллоны</span></button>
        <button class="tab" role="tab" data-tab="prop"><img alt="" data-ic="thrust"><span>Винты</span></button>
      </nav>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot">
        <div class="liftbox" id="liftBox">
          <div class="lb-row"><span>Подъём <b id="fLift">0</b></span><span>Вес <b id="fWeight">0</b></span></div>
          <div class="meter" id="fMeter"><span id="fLiftBar"></span><i id="fWeightMark"></i></div>
          <div class="lb-state" id="fState">Корабль держится в воздухе</div>
        </div>
        <button class="btn go fight" id="fightBtn"><span class="f1">В бой!</span><span class="f2" id="fightSub">Уровень 1</span></button>
      </div>
    </section>
  </div>

  <div id="hud" class="layer" hidden>
    <div class="hud-top">
      <button class="iconbtn" id="pauseBtn" aria-label="Пауза"><img id="pauseIc" alt=""></button>
      <div class="route">

        <div class="route-bar"><div id="routeFill"></div><div id="routeMarks"></div><div id="routeShip"></div></div>
      </div>
      <button class="iconbtn speedbtn" id="speedBtn" aria-label="Скорость игры">×1</button>
      <div class="pill" id="bCoinsPill"><i class="coin"></i><b id="bCoins">0</b></div>
    </div>
    <div class="powerchip" id="powerChip" hidden><span class="chip" id="powerChipTxt">Усиление</span></div>
    <div id="warn" class="warn" hidden>Теряем высоту!</div>
    <div class="hud-bottom">
      <div class="gauges">
        <div class="g-row"><span>Высота</span><b id="altVal">0 м</b></div>
        <div class="meter" id="bMeter"><span id="bLiftBar"></span><i id="bWeightMark"></i></div>
        <div class="g-row"><span>Подъём <b id="bLift">0</b></span><span>Вес <b id="bWeight">0</b></span></div>
        <div class="meter hull"><span id="bHullBar"></span></div>
        <div class="g-row"><span>Корпус</span><b id="bHull">0</b></div>
      </div>
      <div class="abil">
        <button class="ability" id="ballastBtn" aria-label="Сбросить балласт"><img id="ballastIc" alt=""><span class="ab-name">Балласт</span><span class="ab-count" id="ballastN">1</span></button>
        <button class="ability ram" id="ramBtn" aria-label="Таран"><img id="ramIc" alt=""><span class="ab-name">Таран</span></button>

  </div>

  <div id="panel" class="panel" hidden>
    <div class="pcard" role="dialog" aria-modal="true" aria-labelledby="pTitle">
      <div class="phead"><h2 id="pTitle">Магазин</h2><div class="res" id="pRes"></div><button class="iconbtn" id="pClose" aria-label="Закрыть"><img data-ic="close" alt=""></button></div>

  <div id="sys" class="sys" hidden><div class="sys-card" id="sysCard"></div></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script>
(function(){
'use strict';
/* ================= core: utils, data, save, platform, sound ================= */
const $=id=>document.getElementById(id);
const app=$('app'), cv=$('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,LAND=false;

const TAU=Math.PI*2, B=36, COLS=5, DECK=-200, HULL_H=44, ENGAGE=170, RANGE=720;
const INK='#1b2140';
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const h1=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const reduceMotion=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

function roundCost(v){ v=Math.max(1,v); if(v<100) return Math.max(5,Math.round(v/5)*5); const p=Math.pow(10,Math.floor(Math.log10(v))-1); return Math.round(v/p)*p; }
const SUF=['','К','М','Б','Т'];
function fmt(n){
  n=Math.floor(n||0); if(n<10000) return String(Math.max(0,n));
  const e=Math.floor(Math.log10(n)/3), v=n/Math.pow(1000,e);
  const k=e-SUF.length, suf=e<SUF.length?SUF[e]:String.fromCharCode(97+Math.floor(k/26)%26)+String.fromCharCode(97+k%26);
  return String(v<100?Math.floor(v*10)/10:Math.floor(v)).replace('.',',')+suf;
}
const fmt1=v=>String(Math.round(v*10)/10).replace('.',',');
const rub=v=>v.toLocaleString('ru-RU')+' ₽';
const pct=v=>String(Math.round(v*1000)/10).replace('.',',')+'%';

/* growth & cost curves shared by every upgrade */
const GROW=(base,l)=>base*(1+0.15*(l-1))*Math.pow(1.07,l-1);
const COSTF=(base,l)=>roundCost(base*Math.pow(1.15,l-1)*(1+0.08*(l-1)));
const gearCostAt=l=>l<9?0:Math.round(2*Math.pow(1.06,l-9)*(1+0.2*(l-9)));
const levelReward=n=>Math.round(40*Math.pow(1.045,n-1));
const gearMul=n=>Math.pow(1.03,n-1);
function diffOf(n){
  const ramp=Math.min(n-1,30);
  return {hp:Math.pow(1.032,n-1)*(1+0.03*ramp), dmg:0.7*Math.pow(1.02,n-1)*(1+0.012*ramp), rew:Math.pow(1.045,n-1)};
}

/* ================= locations & levels ================= */
const LEVELS_PER_LOC=5, CIRCLES=40;
const LOCS=[
 {name:'Облачные луга', boss:'Чёрный шквал', ground:'hills', weather:null,

  bal:{a:'#d9772b',b:'#4a2e1e',patch:'#f2b27a'}, hull:{light:'#b88a5a',base:'#8a5e36',dark:'#55361d',band:'#2f6f7a'}, flag:'#5a3018'},

  sky:{top:'#5a8fd6',mid:'#a9d0f2',bot:'#eef7ff',sun:'#ffffff',far:'#b6c8e4',near:'#eef4fb',nearD:'#b8cbe2',field:'#dbe8f6',haze:'rgba(235,245,255,0.55)',cloud:'#ffffff',cloudS:'#cfe0f2',island:'#eef4fb',rockA:'#9fb0c8',rockB:'#5d6e88'},
  bal:{a:'#3d6fb0',b:'#e8f2ff',patch:'#9cc3ec'}, hull:{light:'#8aa0bd',base:'#5f7594',dark:'#384a63',band:'#7fd6ff'}, flag:'#22344f'},
 {name:'Вулканические острова', boss:'Огненный кракен', ground:'volcano', weather:'ash',
  sky:{top:'#3a1f2e',mid:'#8a3a2e',bot:'#f08a4a',sun:'#ffd27a',far:'#4a2a30',near:'#2e2228',nearD:'#1c1418',field:'#ff6a2a',haze:'rgba(255,140,80,0.22)',cloud:'#c9a3a0',cloudS:'#7a5560',island:'#4a3a3a',rockA:'#5a4448',rockB:'#2a1e22'},

  bal:{a:'#4a5568',b:'#ffd23f',patch:'#8a95a8'}, hull:{light:'#6a7488',base:'#465064',dark:'#262c3a',band:'#ffd23f'}, flag:'#1c2230'},
 {name:'Звёздная высь', boss:'Полуночный левиафан', ground:'night', weather:'stars',
  sky:{top:'#0f1638',mid:'#27306a',bot:'#5a4a8a',sun:'#f4f1ff',far:'#2a2f5a',near:'#1c2247',nearD:'#121633',field:'#ffd86b',haze:'rgba(120,110,200,0.22)',cloud:'#8a8fc0',cloudS:'#4a4f80',island:'#3f4f7a',rockA:'#4a4a7a',rockB:'#24244a'},

];
const PER_CIRCLE=LOCS.length*LEVELS_PER_LOC, MAX_LEVEL=PER_CIRCLE*CIRCLES;
function levelInfo(n){ const i=n-1; return {n, circle:Math.floor(i/PER_CIRCLE)+1, loc:Math.floor(i/LEVELS_PER_LOC)%LOCS.length, stage:i%LEVELS_PER_LOC+1, boss:i%LEVELS_PER_LOC===LEVELS_PER_LOC-1}; }

/* ================= palettes ================= */
const MATS=[
 {name:'Дерево', base:'#c98545', dark:'#8f5426', light:'#eab37c', inner:'#5a3418', pat:'planks'},
 {name:'Камень', base:'#a9b0bb', dark:'#6b7381', light:'#d7dce3', inner:'#3d4350', pat:'bricks'},
 {name:'Железо', base:'#7d92a8', dark:'#4a5b70', light:'#b9c8d8', inner:'#2a3442', pat:'plates'},

 {light:'#cf8f55', base:'#a5612d', dark:'#6e3b1a', band:'#e7b54a', keel:'#8193a8'},
 {light:'#8f5e48', base:'#663f2e', dark:'#3f2419', band:'#f2c14e', keel:'#e2ab3c'},
 {light:'#7f8ea5', base:'#56647a', dark:'#2e3748', band:'#f2c14e', keel:'#e2ab3c'},
];
const hullTierOf=l=>Math.min(HULLS.length-1,Math.floor((l-1)/10));
const PROPC=[
 {a:'#d08d4f', b:'#9a5d2c', hub:'#e2ab3c'},
 {a:'#f4c454', b:'#c38d1d', hub:'#e2ab3c'},

const SAVE_KEY='skyBastions.v1';
function blankCrew(){ const o={}; for(const id of CREW_IDS) o[id]={own:id==='gunner'?1:0, lvl:1}; return o; }
function defaultSave(){
  return {v:2, coins:50, gears:0, gems:0, maxLevel:1, stars:{}, sound:true, tutorial:true,
    up:{wall:1,hull:1,frame:1,autoRep:0,powder:0,sights:0,loot:0,bCount:1,bLift:1,bHp:1,bPatch:0,thrust:1,rotor:0,boost:1,dodge:0},
    crew:blankCrew(), grid:[['W','W','gunner','W','W'],[null,null,null,null,null],[null,null,null,null,null],[null,null,null,null,null]],
    cont:{wood:0,steel:0,gold:0,ark:0}, daily:{day:'',wheelFree:0,wheelAd:0,adCoins:0,power:0}, powerUntil:0, bought:{}};
}
function migrate(s){
  const d=defaultSave();
  if(!s||typeof s!=='object'||(s.v!==1&&s.v!==2)) return d;
  if(s.v===1){ s.maxLevel=Math.max(1,s.maxLevel||s.level||1); s.v=2; }
  const num=(k)=>{ if(typeof s[k]!=='number'||!isFinite(s[k])||s[k]<0) s[k]=d[k]; };
  ['coins','gears','gems','maxLevel','powerUntil'].forEach(num);
  s.maxLevel=Math.max(1,Math.floor(s.maxLevel));
  s.up=Object.assign({},d.up,s.up||{});
  for(const k in UPG) s.up[k]=clamp(Math.floor(s.up[k]||0),UPG[k].min===0?0:1,UPG[k].max);
  s.crew=s.crew||{};
  for(const k of CREW_IDS) s.crew[k]=Object.assign({},d.crew[k],s.crew[k]||{});
  if(!Array.isArray(s.grid)||s.grid.length!==4||s.grid.some(r=>!Array.isArray(r)||r.length!==COLS)) s.grid=d.grid;
  for(const row of s.grid) for(let c=0;c<COLS;c++){ const v=row[c]; if(v&&v!=='W'&&!CREW[v]) row[c]=null; }
  s.cont=Object.assign({},d.cont,s.cont||{});
  s.daily=Object.assign({},d.daily,s.daily||{});
  s.stars=s.stars&&typeof s.stars==='object'?s.stars:{};
  s.bought=s.bought&&typeof s.bought==='object'?s.bought:{};
  if(typeof s.sound!=='boolean') s.sound=true;
  if(typeof s.tutorial!=='boolean') s.tutorial=s.maxLevel<=1;
  delete s.level;
  return s;
}
function loadSave(){ try{ const raw=localStorage.getItem(SAVE_KEY); if(raw) return migrate(JSON.parse(raw)); }catch(e){} return defaultSave(); }
function persist(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){} }

/* ================= platform: rewarded ads and payments =================
   Release build: the Android wrapper injects window.SkyNative with
     showRewarded(jsonArgs, callbackId)  and  purchase(jsonArgs, callbackId)
   and answers with SkyPlatform.resolve(callbackId, '{"ok":true}').
   Without the wrapper the game runs in an honest test mode: nothing is charged. */
const Platform={
  _cb:{}, _id:0,
  native(){ return window.SkyNative||null; },
  billingReady(){ const n=this.native(); return !!(n&&n.purchase); },
  adsReady(){ const n=this.native(); return !!(n&&n.showRewarded); },
  call(method,arg){ const n=this.native(); return new Promise(res=>{ const id='cb'+(++this._id); this._cb[id]=res; try{ n[method](JSON.stringify(arg||{}),id); }catch(e){ delete this._cb[id]; res({ok:false,error:String(e)}); } }); },
  resolve(id,json){ const f=this._cb[id]; if(!f) return; delete this._cb[id]; let r; try{ r=typeof json==='string'?JSON.parse(json):json; }catch(e){ r={ok:false}; } f(r||{ok:false}); },
  showRewarded(placement){ return this.adsReady()?this.call('showRewarded',{placement}):testAd(placement); },
  purchase(product){ return this.billingReady()?this.call('purchase',{productId:product.id, priceRub:product.rub}):testPay(product); },
};
window.SkyPlatform={resolve:(id,json)=>Platform.resolve(id,json)};

  ac:null, master:null, noise:null, last:{},
  init(){ if(this.ac){ if(this.ac.state==='suspended') this.ac.resume(); return; }

      const len=this.ac.sampleRate; const buf=this.ac.createBuffer(1,len,this.ac.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; this.noise=buf; }catch(e){ this.ac=null; } },
  play(n,v){ if(!save||!save.sound||!this.ac||this.ac.state!=='running') return; const t=this.ac.currentTime; if(this.last[n]&&t-this.last[n]<0.045) return; this.last[n]=t; const f=this['s_'+n]; if(f) try{ f.call(this,t,v==null?1:v); }catch(e){} },
  env(g,t,a,d,p){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002,p),t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); },

  tn(t,type,f0,f1,dur,p,a){ a=a||0.004; const o=this.ac.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur); const g=this.ac.createGain(); this.env(g,t,a,dur,p); o.connect(g); g.connect(this.master); o.start(t); o.stop(t+a+dur+0.05); },

/* ================= drawing primitives ================= */
function rr(c,x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function circ(c,x,y,r){ c.beginPath(); c.arc(x,y,Math.max(0.01,r),0,TAU); }
function ell(c,x,y,rx,ry){ c.beginPath(); c.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),0,0,TAU); }
function line(c,x1,y1,x2,y2){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
function star(c,x,y,r1,r2,n){ c.beginPath(); for(let i=0;i<n*2;i++){ const a=-Math.PI/2+i*Math.PI/n, r=i%2?r2:r1; c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r); } c.closePath(); }

function drawBlock(c,x,y,mat,ratio,flash){
  const s=B;
  rr(c,x+0.5,y+0.5,s-1,s-1,4); c.fillStyle=mat.base; c.fill();
  c.save(); c.clip();
  c.fillStyle=mat.light; c.fillRect(x,y,s,4); c.fillRect(x,y,3,s);
  c.globalAlpha=0.5; c.fillStyle=mat.dark; c.fillRect(x,y+s-5,s,5); c.fillRect(x+s-4,y,4,s); c.globalAlpha=1;
  c.strokeStyle=mat.dark; c.lineWidth=2;
  if(mat.pat==='planks'){
    c.beginPath(); c.moveTo(x,y+12); c.lineTo(x+s,y+12); c.moveTo(x,y+24); c.lineTo(x+s,y+24); c.stroke();
    c.lineWidth=4.5; line(c,x+5,y+s-5,x+s-5,y+5);
    c.fillStyle=INK; for(const [px,py] of [[5,5],[s-5,5],[5,s-5],[s-5,s-5]]){ circ(c,x+px,y+py,1.4); c.fill(); }
  } else if(mat.pat==='bricks'){
    c.beginPath();
    for(let i=1;i<3;i++){ c.moveTo(x,y+i*12); c.lineTo(x+s,y+i*12); }
    for(let i=0;i<3;i++){ const o=i%2?9:18; for(let xx=x+o; xx<x+s; xx+=18){ c.moveTo(xx,y+i*12); c.lineTo(xx,y+i*12+12); } }
    c.stroke();
  } else if(mat.pat==='plates'){
    rr(c,x+6,y+6,s-12,s-12,3); c.stroke();
    for(const [px,py] of [[5,5],[s-5,5],[5,s-5],[s-5,s-5]]){ circ(c,x+px,y+py,2.2); c.fillStyle=mat.light; c.fill(); c.lineWidth=1.2; c.strokeStyle=INK; c.stroke(); }
  } else {
    c.beginPath(); c.moveTo(x+4,y+s); c.lineTo(x+s*0.5,y+6); c.lineTo(x+s-4,y+s); c.moveTo(x+s*0.5,y+6); c.lineTo(x+s*0.5,y+s); c.stroke();
    c.globalAlpha=0.55; c.fillStyle='#ffffff'; c.beginPath(); c.moveTo(x+7,y+4); c.lineTo(x+13,y+4); c.lineTo(x+4,y+16); c.lineTo(x+4,y+10); c.closePath(); c.fill(); c.globalAlpha=1;
  }
  if(ratio<0.66){ c.strokeStyle=INK; c.lineWidth=1.6; c.beginPath(); c.moveTo(x+s*0.3,y); c.lineTo(x+s*0.42,y+s*0.3); c.lineTo(x+s*0.3,y+s*0.48); c.lineTo(x+s*0.5,y+s*0.68); c.stroke(); }
  if(ratio<0.33){ c.beginPath(); c.moveTo(x+s,y+s*0.55); c.lineTo(x+s*0.72,y+s*0.62); c.lineTo(x+s*0.66,y+s*0.86); c.lineTo(x+s*0.5,y+s); c.stroke(); c.fillStyle='rgba(20,15,30,.18)'; c.fillRect(x,y,s,s); }
  if(flash>0){ c.fillStyle='rgba(255,255,255,'+Math.min(0.8,flash*6)+')'; c.fillRect(x,y,s,s); }
  c.restore();
  rr(c,x+0.5,y+0.5,s-1,s-1,4); c.strokeStyle=INK; c.lineWidth=2.4; c.stroke();
}

/* ---------- crew ---------- */
function lookOf(type,pirate){ return pirate?(PLOOK[type]||PLOOK.gunner):(LOOK[type]||LOOK.gunner); }
function drawAura(c,x,y,t){
  const p=0.55+Math.sin(t*3)*0.2;
  const g=c.createRadialGradient(x,y,2,x,y,22); g.addColorStop(0,'rgba(255,214,90,'+p+')'); g.addColorStop(1,'rgba(180,110,255,0)');
  c.fillStyle=g; circ(c,x,y,22); c.fill();
}
function drawCrewBody(c,type,x,fy,t,pirate){
  const L=lookOf(type,pirate);
  const hy=fy-23+Math.sin(t*2.6)*0.7;
  c.lineWidth=2; c.strokeStyle=INK;
  if(L.hat==='hood'){ c.fillStyle=L.hatC; c.beginPath(); c.moveTo(x-4,fy-14); c.quadraticCurveTo(x-13,fy-6,x-11,fy); c.lineTo(x-3,fy); c.closePath(); c.fill(); c.stroke(); }
  if(L.hat==='winged'){ rr(c,x-9,hy+1,4,12,2); c.fillStyle='#ffd86b'; c.fill(); c.stroke(); }
  rr(c,x-7,fy-17,14,17,5); c.fillStyle=L.coat; c.fill(); c.stroke();
  c.fillStyle=L.trim; c.fillRect(x-6,fy-9,12,2.6);
  if(L.legend){ c.fillStyle='#ffd23f'; star(c,x+2,fy-13,2.6,1.1,5); c.fill(); }
  if(L.hat==='tesla'){ c.fillStyle=L.hatC; star(c,x-1,hy-2,10.5,6,7); c.fill(); c.lineWidth=1.6; c.stroke(); c.lineWidth=2; }
  if(L.hat==='robot'){
    rr(c,x-7.5,hy-7,15,14,3.5); c.fillStyle=L.skin; c.fill(); c.stroke();
    rr(c,x-1,hy-2.5,8.5,4.4,2); c.fillStyle='#1b2140'; c.fill();
    c.fillStyle='rgba(90,240,255,'+(0.75+Math.sin(t*6)*0.25)+')'; rr(c,x,hy-1.6,6.5,2.6,1.3); c.fill();
    c.lineWidth=1.5; line(c,x-2,hy-7,x-4,hy-12); c.fillStyle='#f0503f'; circ(c,x-4,hy-12.5,1.8); c.fill(); c.stroke();
    c.fillStyle='#ffd23f'; c.fillRect(x-6,hy+4,3,1.6);
    return;
  }
  circ(c,x,hy,7.2); c.fillStyle=L.skin; c.fill(); c.stroke();
  c.fillStyle=INK; circ(c,x+2.6,hy+0.3,1.25); c.fill(); circ(c,x+5.4,hy+0.3,1.25); c.fill();
  c.fillStyle='rgba(255,110,100,.45)'; circ(c,x+3.2,hy+3.3,1.6); c.fill();
  c.fillStyle=L.hatC; c.lineWidth=1.8; c.strokeStyle=INK;
  switch(L.hat){
    case 'aviator':
      c.beginPath(); c.arc(x,hy,7.9,Math.PI,TAU); c.closePath(); c.fill(); c.stroke();
      rr(c,x-8,hy-1,4.5,7.5,2); c.fill(); c.stroke();
      c.lineWidth=1.4; line(c,x-7,hy-4.8,x+7,hy-4.8);
      for(const gx of [x+1.6,x+5.6]){ circ(c,gx,hy-4.8,2.4); c.fillStyle='#9fe3ff'; c.fill(); c.stroke(); }
      break;
    case 'helmet':
      c.beginPath(); c.arc(x,hy-0.5,8.3,Math.PI,TAU); c.closePath(); c.fill(); c.stroke();
      rr(c,x-10,hy-2,20,3.4,1.7); c.fill(); c.stroke();
      c.fillStyle='#c9cfda'; circ(c,x+1,hy-5.5,1.3); c.fill();
      break;
    case 'beanie':
      c.beginPath(); c.arc(x,hy,8,Math.PI,TAU); c.closePath(); c.fill(); c.stroke();
      c.fillStyle='#d8483b'; rr(c,x-8.5,hy-3,17,3.8,1.5); c.fill(); c.stroke();
      c.fillStyle=L.hatC; circ(c,x-1.5,hy-9.5,2.8); c.fill(); c.stroke();
      break;
    case 'hardhat':
      c.beginPath(); c.ellipse(x,hy-1,8.6,8.2,0,Math.PI,TAU); c.closePath(); c.fill(); c.stroke();
      rr(c,x-9,hy-2.6,21,3.2,1.6); c.fill(); c.stroke();
      c.fillStyle='rgba(255,255,255,.5)'; c.fillRect(x-1,hy-8.5,2.4,6);
      break;
    case 'tesla':
      rr(c,x+0.5,hy-2.6,8,4.4,2.2); c.fillStyle='#c79bff'; c.fill(); c.stroke();
      break;
    case 'beret':
      c.beginPath(); c.ellipse(x-0.5,hy-5.5,9,3.8,-0.18,0,TAU); c.fill(); c.stroke();
      circ(c,x-1,hy-9.3,1.6); c.fill(); c.stroke();
      c.fillStyle='#e2ab3c'; circ(c,x+5,hy-6.5,1.5); c.fill();
      break;
    case 'pilot':
      c.beginPath(); c.arc(x,hy-0.5,8.4,Math.PI*0.95,TAU+0.1); c.closePath(); c.fill(); c.stroke();
      c.fillStyle='#d8483b'; c.fillRect(x-1.2,hy-8.6,2.4,7);
      rr(c,x-1,hy-2.3,10,4.8,2.4); c.fillStyle='#ffb43a'; c.fill(); c.stroke();
      break;
    case 'mask':
      c.beginPath(); c.arc(x,hy,8,Math.PI,TAU); c.closePath(); c.fill(); c.stroke();
      circ(c,x+3.4,hy-0.4,2.3); c.fillStyle='#7dff8a'; c.fill(); c.stroke();
      circ(c,x+6.2,hy+3.6,3.1); c.fillStyle='#4a4f5c'; c.fill(); c.stroke();
      c.fillStyle='#2b2f3a'; circ(c,x+7.4,hy+4.4,1.2); c.fill();
      break;
    case 'ushanka':
      rr(c,x-9,hy-11,18,7.5,3.5); c.fill(); c.stroke();
      rr(c,x-9.5,hy-4,5,9,2.5); c.fill(); c.stroke();
      c.fillStyle='#b8946a'; rr(c,x-8,hy-5.6,17,3.4,1.7); c.fill(); c.stroke();
      break;
    case 'headband':
      c.fillStyle=L.hatC; rr(c,x-7.6,hy-5,15.2,3.2,1.6); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(x-7,hy-4); c.lineTo(x-12,hy-1); c.lineTo(x-8,hy-1.5); c.closePath(); c.fill(); c.stroke();
      break;
    case 'knight':
      c.beginPath(); c.arc(x,hy,8.4,Math.PI*0.9,TAU+0.35); c.closePath(); c.fill(); c.stroke();
      c.fillStyle=INK; rr(c,x+1.5,hy-1.2,7,2,1); c.fill();
      c.fillStyle='#d8483b'; c.beginPath(); c.ellipse(x-3,hy-10,6,2.6,-0.5,0,TAU); c.fill(); c.stroke();
      break;
    case 'bicorne':
      c.beginPath(); c.moveTo(x-12,hy-3); c.quadraticCurveTo(x,hy-17,x+12,hy-3); c.quadraticCurveTo(x,hy-7,x-12,hy-3); c.closePath(); c.fill(); c.stroke();
      c.strokeStyle='#f2c14e'; c.lineWidth=1.4; c.beginPath(); c.moveTo(x-10,hy-4.2); c.quadraticCurveTo(x,hy-8,x+10,hy-4.2); c.stroke();
      c.fillStyle='#f0503f'; circ(c,x+1,hy-8.5,2); c.fill(); c.strokeStyle=INK; c.lineWidth=1.2; c.stroke();
      break;
    case 'winged':
      c.beginPath(); c.arc(x,hy-0.5,8.2,Math.PI,TAU); c.closePath(); c.fill(); c.stroke();
      c.fillStyle='#ffffff'; c.beginPath(); c.moveTo(x-6,hy-5); c.lineTo(x-14,hy-12); c.lineTo(x-11,hy-6); c.lineTo(x-14,hy-4); c.closePath(); c.fill(); c.stroke();
      break;
    case 'hood':
      c.beginPath(); c.arc(x-0.5,hy+0.5,9,Math.PI*0.75,TAU+0.2); c.quadraticCurveTo(x+3,hy-3,x-2,hy+2); c.closePath(); c.fill(); c.stroke();
      c.strokeStyle='#ffffff'; c.lineWidth=1.2; for(let i=0;i<3;i++){ const a=i*Math.PI/3; line(c,x-3+Math.cos(a)*2.6,hy-5+Math.sin(a)*2.6,x-3-Math.cos(a)*2.6,hy-5-Math.sin(a)*2.6); }
      break;
    case 'bandana':
      c.beginPath(); c.arc(x,hy,8,Math.PI,TAU); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(x-7,hy-3); c.lineTo(x-13,hy-1); c.lineTo(x-9,hy+3); c.closePath(); c.fill(); c.stroke();
      c.fillStyle='#fff3e0'; for(const [dx,dy] of [[-3,-5],[2,-6],[5,-3],[-5,-2]]){ circ(c,x+dx,hy+dy,0.9); c.fill(); }
      if(L.patch){ c.fillStyle=INK; circ(c,x+5.4,hy+0.3,2.2); c.fill(); c.lineWidth=1.1; line(c,x+5,hy-1.8,x-6,hy-5); }
      break;
  }
}

function drawWeapon(c,type,x,fy,aim,recoil,t,act,loaded,skin){
  if(type==='shield'){
    c.save(); c.translate(x+5,fy-19);
    rr(c,0,0,9,20,3); c.fillStyle='#4a6fb0'; c.fill(); c.lineWidth=2; c.strokeStyle=INK; c.stroke();
    c.strokeStyle='#e2ab3c'; c.lineWidth=1.6; rr(c,1.6,1.6,5.8,16.8,2); c.stroke();
    c.fillStyle='#e2ab3c'; star(c,4.5,10,3,1.3,5); c.fill();
    if(act>0){ c.globalAlpha=Math.min(1,act); c.strokeStyle='#8ee8ff'; c.lineWidth=2; circ(c,4.5,10,14); c.stroke(); c.globalAlpha=1; }
    c.restore(); return;
  }
  c.save(); c.translate(x+1,fy-11);
  let a=aim;
  if(type==='mechanic') a=-0.7+Math.sin(t*7)*(act>0?0.6:0.12);
  if(type==='thunder') a=-1.1+(act>0?Math.sin(t*20)*0.15:0);
  if(type==='blizzard'||type==='valkyrie') a=Math.min(aim,-0.35);
  c.rotate(a); c.translate(-recoil*3.5,0);
  c.lineWidth=1.8; c.strokeStyle=INK;
  let mx=24;
  switch(type){
    case 'gunner':
      rr(c,-7,-2.6,11,5.2,2); c.fillStyle='#8a5a32'; c.fill(); c.stroke();
      rr(c,2,-1.7,23,3.4,1.2); c.fillStyle='#3c4253'; c.fill(); c.stroke(); mx=26; break;

      rr(c,-5,-4.6,19,9.2,3); c.fillStyle='#3a3f4d'; c.fill(); c.stroke();
      c.fillStyle='#d19a2c'; c.fillRect(1,-4,2.4,8); c.fillRect(8,-4,2.4,8);
      rr(c,13,-5.8,5.5,11.6,2); c.fillStyle='#2b2f3a'; c.fill(); c.stroke(); mx=20; break;
    case 'harpoon':
      rr(c,-5,-3.2,15,6.4,2); c.fillStyle='#4f7fa8'; c.fill(); c.stroke();
      if(loaded){ rr(c,8,-0.9,14,1.8,0.9); c.fillStyle='#8a5a32'; c.fill(); c.beginPath(); c.moveTo(21,-3.4); c.lineTo(28,0); c.lineTo(21,3.4); c.closePath(); c.fillStyle='#dfe6ee'; c.fill(); c.stroke(); }
      break;
    case 'mechanic':
      rr(c,-1,-1.6,15,3.2,1.5); c.fillStyle='#9aa3b1'; c.fill(); c.stroke();
      circ(c,16,0,4.4); c.fill(); c.stroke(); c.fillStyle='#4a5160'; c.fillRect(16,-1.6,5,3.2); break;
    case 'tesla': case 'blizzard': {
      rr(c,-3,-1.5,17,3,1.5); c.fillStyle=type==='tesla'?'#3a2e55':'#c9e8f7'; c.fill(); c.stroke();
      if(type==='tesla'){ c.strokeStyle='#d58a3a'; c.lineWidth=1.7; for(const k of [4,7.5,11]){ ell(c,k,0,1.5,4.3); c.stroke(); } }
      const pulse=0.55+Math.sin(t*9)*0.25, col=type==='tesla'?'230,200,255':'190,240,255';
      const g=c.createRadialGradient(18,0,0,18,0,9); g.addColorStop(0,'rgba('+col+','+pulse+')'); g.addColorStop(1,'rgba('+col+',0)');
      c.fillStyle=g; circ(c,18,0,9); c.fill();
      if(type==='tesla'){ circ(c,18,0,3.4); c.fillStyle='#f6ecff'; c.fill(); c.strokeStyle='#8a54d6'; c.lineWidth=1.5; c.stroke(); }
      else { c.strokeStyle='#ffffff'; c.lineWidth=1.8; for(let i=0;i<3;i++){ const q=i*Math.PI/3+t; line(c,18+Math.cos(q)*5,Math.sin(q)*5,18-Math.cos(q)*5,-Math.sin(q)*5); } }
      mx=20; break; }
    case 'sniper':
      rr(c,-8,-2.6,12,5.2,2); c.fillStyle='#6b4a2b'; c.fill(); c.stroke();
      rr(c,3,-1.4,30,2.8,1); c.fillStyle='#2f3542'; c.fill(); c.stroke();
      rr(c,5,-6,11,3.6,1.5); c.fillStyle='#1b2140'; c.fill(); c.stroke(); c.fillStyle='#9fe3ff'; circ(c,16,-4.2,1.4); c.fill();
      mx=34; break;
    case 'rocket':
      rr(c,-9,-4.4,27,8.8,3.5); c.fillStyle='#5f6e3a'; c.fill(); c.stroke();
      c.fillStyle='#f0503f'; c.fillRect(13,-4,2.6,8); c.fillStyle='#ffd23f'; c.fillRect(-6,-4,2.6,8);
      if(loaded){ c.beginPath(); c.moveTo(18,-3.2); c.lineTo(24,0); c.lineTo(18,3.2); c.closePath(); c.fillStyle='#f0503f'; c.fill(); c.stroke(); }
      mx=22; break;
    case 'flamer':
      rr(c,-4,-3,15,6,2.5); c.fillStyle='#c98a2c'; c.fill(); c.stroke();
      rr(c,10,-2,8,4,1.5); c.fillStyle='#3a3f4d'; c.fill(); c.stroke();
      c.fillStyle='rgba(90,170,255,'+(0.6+Math.sin(t*30)*0.3)+')'; circ(c,20,0,1.8); c.fill();
      mx=20; break;
    case 'frost':
      rr(c,-4,-3.5,16,7,3); c.fillStyle='#e9f6ff'; c.fill(); c.stroke();

      c.beginPath(); c.moveTo(12,-4); c.lineTo(20,0); c.lineTo(12,4); c.lineTo(14,0); c.closePath(); c.fillStyle='#7fe3ff'; c.fill(); c.stroke();
      mx=21; break;
    case 'gatling': {
      rr(c,-5,-4.5,12,9,3); c.fillStyle='#6b7b8c'; c.fill(); c.stroke();
      const sp=(t*(act>0?40:6))%3;
      for(let i=0;i<3;i++){ const y=-3.4+((i+sp)%3)*2.6; rr(c,6,y-0.8,17,1.8,0.9); c.fillStyle=i===1?'#59606e':'#3c4253'; c.fill(); c.lineWidth=1; c.stroke(); }

      if(act>0||Math.sin(t*5)>0.7){ c.strokeStyle='#ffe066'; c.lineWidth=1.6; c.beginPath(); c.moveTo(24,-2); c.lineTo(28,-7); c.lineTo(26,-6); c.lineTo(31,-12); c.stroke(); }
      mx=27; break;
    case 'atlas': {

      c.fillStyle='#4b5566'; c.fillRect(3,-4,2.4,8);
      const g=c.createRadialGradient(17,0,0,17,0,8); g.addColorStop(0,'rgba(120,255,255,.95)'); g.addColorStop(1,'rgba(60,200,255,0)');
      c.fillStyle=g; circ(c,17,0,8); c.fill(); c.fillStyle='#e8ffff'; circ(c,17,0,2.4); c.fill();

function drawPortrait(c,id,cx,fy,sc,t){

/* ---------- balloons, hull, ship ---------- */
function drawSkull(c,x,y,r){
  c.lineWidth=1.4; c.strokeStyle=INK; c.fillStyle='#f4efe2';
  rr(c,x-r*0.55,y+r*0.45,r*1.1,r*0.6,r*0.2); c.fill(); c.stroke();
  circ(c,x,y,r); c.fill(); c.stroke();
  c.fillStyle=INK; circ(c,x-r*0.38,y+r*0.05,r*0.26); c.fill(); circ(c,x+r*0.38,y+r*0.05,r*0.26); c.fill();
  c.beginPath(); c.moveTo(x,y+r*0.35); c.lineTo(x-r*0.12,y+r*0.58); c.lineTo(x+r*0.12,y+r*0.58); c.closePath(); c.fill();
}
function drawBalloon(c,b,t){
  const R=b.R, rx=R*0.9, look=BLOOK[b.look]||BLOOK.p0;
  const low=b.hp/b.max;
  const x=b.lx+(low<0.3?Math.sin(t*38)*0.9:0), y=b.ly+Math.sin(t*1.3+b.wob)*2;
  c.save(); c.translate(x,y);
  c.lineWidth=2; c.strokeStyle=INK;
  rr(c,-R*0.2,R*0.86,R*0.4,R*0.2,3); c.fillStyle=look.neck; c.fill(); c.stroke();
  ell(c,0,0,rx,R); c.fillStyle=look.a; c.fill();
  c.save(); c.clip();
  ell(c,0,0,rx*0.64,R*1.02); c.fillStyle=look.b; c.fill();
  ell(c,0,0,rx*0.27,R*1.04); c.fillStyle=look.a; c.fill();
  if(b.armor>=4){ c.strokeStyle='#e2ab3c'; c.lineWidth=R*0.11; c.beginPath(); c.ellipse(0,R*0.42,rx,R*0.12,0,0,Math.PI); c.stroke(); }
  if(b.armor>=8){ c.beginPath(); c.ellipse(0,-R*0.15,rx,R*0.12,0,0,Math.PI); c.stroke(); }
  if(b.armor>=12){ c.fillStyle='#fff3c4'; for(let i=-2;i<=2;i++){ circ(c,i*rx*0.36,R*0.5-Math.abs(i)*1.5,1.6); c.fill(); } }
  const g=c.createRadialGradient(-rx*0.35,-R*0.4,R*0.1,0,0,R*1.05);
  g.addColorStop(0,'rgba(255,255,255,0.32)'); g.addColorStop(0.45,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(20,20,60,0.38)');
  c.fillStyle=g; c.fillRect(-rx,-R,rx*2,R*2);
  if(low<0.6&&b.patches){ c.lineWidth=1.3; c.strokeStyle=INK; for(let i=0;i<b.patches.length;i++){ if(low>0.4&&i>0) break; const p=b.patches[i]; c.save(); c.translate(p.x*rx,p.y*R); c.rotate(p.a); rr(c,-R*0.13,-R*0.1,R*0.26,R*0.2,2); c.fillStyle=look.patch; c.fill(); c.stroke(); c.beginPath(); c.moveTo(-R*0.08,-R*0.04); c.lineTo(-R*0.02,R*0.04); c.moveTo(R*0.02,-R*0.04); c.lineTo(R*0.08,R*0.04); c.stroke(); c.restore(); } }
  if(look.skull) drawSkull(c,0,-R*0.05,R*0.25);
  if(b.hit>0){ c.fillStyle='rgba(255,255,255,'+Math.min(0.8,b.hit*6)+')'; c.fillRect(-rx,-R,rx*2,R*2); }
  c.restore();
  c.save(); c.translate(-rx*0.42,-R*0.45); c.rotate(-0.5); ell(c,0,0,rx*0.13,R*0.24); c.fillStyle='rgba(255,255,255,.65)'; c.fill(); c.restore();
  ell(c,0,0,rx,R); c.strokeStyle=INK; c.lineWidth=2.6; c.stroke();
  c.restore();
}
function hullPath(c,w){
  const L=-w/2-14, R=w/2+20;
  c.beginPath(); c.moveTo(L,-2); c.lineTo(R,-2);
  c.bezierCurveTo(R+20,-2,R+26,10,R+20,22);
  c.bezierCurveTo(R+12,38,R-4,44,R-20,44);
  c.lineTo(L+16,44);
  c.bezierCurveTo(L+2,44,L-8,34,L-8,18);
  c.bezierCurveTo(L-8,6,L-6,-2,L,-2);
  c.closePath();
}
function drawHull(c,s){
  const w=s.w, L=-w/2-14, R=w/2+20, sp=s.spec, pal=sp.hullPal||HULLS[0];
  hullPath(c,w);
  const g=c.createLinearGradient(0,-2,0,HULL_H); g.addColorStop(0,pal.light); g.addColorStop(0.55,pal.base); g.addColorStop(1,pal.dark);
  c.fillStyle=g; c.fill();
  c.save(); hullPath(c,w); c.clip();
  c.strokeStyle=pal.dark; c.lineWidth=1.5; c.globalAlpha=0.75; c.beginPath();
  const bands=[-2,11,22,33];
  for(let k=0;k<bands.length;k++){ const y0=bands[k]; if(k>0){ c.moveTo(L-12,y0); c.lineTo(R+30,y0); } for(let xx=L-12+(k%2)*16; xx<R+30; xx+=32){ c.moveTo(xx,y0); c.lineTo(xx,y0+11); } }
  c.stroke(); c.globalAlpha=1;
  if(pal.keel){ c.fillStyle=pal.keel; c.fillRect(L-12,35,w+80,12); c.strokeStyle=INK; c.lineWidth=1.4; line(c,L-12,35,R+30,35); c.fillStyle=INK; for(let xx=L; xx<R+20; xx+=12){ circ(c,xx,40,1.3); c.fill(); } }
  c.fillStyle=pal.band; c.fillRect(L-12,1,w+80,6); c.strokeStyle=INK; c.lineWidth=1.4; c.beginPath(); c.moveTo(L-12,1); c.lineTo(R+30,1); c.moveTo(L-12,7); c.lineTo(R+30,7); c.stroke();
  if(sp.pirate){
    c.beginPath(); c.moveTo(R-34,25); c.quadraticCurveTo(R-6,42,R+18,22); c.quadraticCurveTo(R-8,30,R-34,25); c.closePath();
    c.fillStyle='#7a1620'; c.fill(); c.strokeStyle=INK; c.lineWidth=1.6; c.stroke();
    c.fillStyle='#fffaf0';
    for(let i=1;i<=6;i++){ const u=i/7, px=(1-u)*(1-u)*(R-34)+2*(1-u)*u*(R-8)+u*u*(R+18), py=(1-u)*(1-u)*25+2*(1-u)*u*30+u*u*22; c.beginPath(); c.moveTo(px-2.6,py-0.5); c.lineTo(px+2.6,py-0.5); c.lineTo(px,py+4.5); c.closePath(); c.fill(); c.lineWidth=1; c.stroke(); }
    circ(c,R-2,13,4); c.fillStyle='#fffaf0'; c.fill(); c.lineWidth=1.4; c.stroke(); circ(c,R-0.6,13.5,1.9); c.fillStyle=sp.boss?'#f0503f':INK; c.fill();
    c.lineWidth=2.2; line(c,R-8,8,R+3,10.5);
  }
  const hr=s.hull.hp/s.hull.max;
  if(hr<0.6){ c.strokeStyle=INK; c.lineWidth=1.8; c.beginPath(); c.moveTo(-w*0.1,-2); c.lineTo(-w*0.05,10); c.lineTo(-w*0.12,18); c.lineTo(-w*0.04,30); c.stroke(); }
  if(hr<0.3){ c.beginPath(); c.moveTo(w*0.25,44); c.lineTo(w*0.2,34); c.lineTo(w*0.28,26); c.lineTo(w*0.22,16); c.stroke(); c.fillStyle='rgba(20,10,10,.2)'; c.fillRect(L-12,-2,w+80,50); }
  if(s.hull.hit>0){ c.fillStyle='rgba(255,255,255,'+Math.min(0.7,s.hull.hit*5)+')'; c.fillRect(L-12,-2,w+80,50); }
  c.restore();
  hullPath(c,w); c.strokeStyle=INK; c.lineWidth=2.6; c.stroke();
  const pEnd=sp.pirate?R-40:R-8;
  for(let xx=L+18; xx<pEnd; xx+=34){ circ(c,xx,21,6.2); c.fillStyle='#e2ab3c'; c.fill(); c.lineWidth=1.8; c.strokeStyle=INK; c.stroke(); circ(c,xx,21,3.9); c.fillStyle=s.dead?'#3a3f4d':'#9fe0ff'; c.fill(); c.stroke(); c.fillStyle='rgba(255,255,255,.85)'; circ(c,xx-1.4,19.6,1.3); c.fill(); }
  c.beginPath(); c.moveTo(R+20,12); c.lineTo(R+38,20); c.lineTo(R+19,28); c.closePath();
  c.fillStyle=(sp.thrustLvl||1)>=10?'#f2c14e':'#c9d2dc'; c.fill(); c.lineWidth=2; c.strokeStyle=INK; c.stroke();
  c.fillStyle='rgba(255,255,255,.6)'; c.beginPath(); c.moveTo(R+22,15); c.lineTo(R+33,20); c.lineTo(R+22,19); c.closePath(); c.fill();
}
function drawProp(c,x,y,len,n,a,col){
  ell(c,x,y,3.6,len+1); c.fillStyle='rgba(255,255,255,.3)'; c.fill();
  for(let i=0;i<n;i++){ const an=a+i*TAU/n, sy=Math.sin(an)*len, th=Math.cos(an);
    ell(c,x,y+sy/2,1.6+Math.abs(th)*2.6,Math.abs(sy)/2+0.6); c.fillStyle=th>=0?col.a:col.b; c.fill(); c.lineWidth=1.4; c.strokeStyle=INK; c.stroke(); }
  c.beginPath(); c.moveTo(x+1,y-4.5); c.lineTo(x-8,y); c.lineTo(x+1,y+4.5); c.closePath(); c.fillStyle=col.hub; c.fill(); c.lineWidth=1.6; c.stroke();
}
function drawStern(c,s){
  const tl=s.spec.thrustLvl||1, L=-s.w/2-14, col=PROPC[propTier(tl)];
  const ys=tl>=10?[11,31]:[21], blades=tl>=20?5:tl>=10?4:tl>=4?3:2, len=ys.length>1?14+Math.min(tl,40)*0.12:16+tl*0.6;
  for(const py of ys){
    rr(c,L-30,py-2.5,26,5,2); c.fillStyle='#5d6372'; c.fill(); c.lineWidth=1.6; c.strokeStyle=INK; c.stroke();
    drawProp(c,L-31,py,len,blades,s.propA+py*0.1,col);
  }
}
function drawRotor(c,s){
  const lv=s.spec.rotorLvl||0; if(!lv) return;
  const xs=lv>=5?[-s.w*0.28,s.w*0.28]:[0], len=15+Math.min(lv,30)*0.6, col=PROPC[Math.min(4,1+Math.floor(lv/8))];
  for(const x of xs){
    rr(c,x-2.6,40,5.2,15,2); c.fillStyle='#5d6372'; c.fill(); c.lineWidth=1.6; c.strokeStyle=INK; c.stroke();
    ell(c,x,57,len+1,3); c.fillStyle='rgba(255,255,255,.3)'; c.fill();
    for(let i=0;i<3;i++){ const an=s.propA*1.3+i*TAU/3+x, bx=Math.cos(an)*len, d=Math.sin(an);
      ell(c,x+bx/2,57+d*0.8,Math.abs(bx)/2+0.6,2.2); c.fillStyle=d>0?col.a:col.b; c.fill(); c.lineWidth=1.3; c.stroke(); }
    circ(c,x,57,3.3); c.fillStyle=col.hub; c.fill(); c.lineWidth=1.5; c.stroke();
  }
}
function drawFlag(c,s,t){
  const px=-s.w/2-6, top=-s.topRows*B-28;
  rr(c,px-1.8,top,3.6,-top-2,1.5); c.fillStyle='#6b4a2b'; c.fill(); c.lineWidth=1.5; c.strokeStyle=INK; c.stroke();
  const fw=28, fh=18;
  c.beginPath(); c.moveTo(px,top+2);
  for(let i=0;i<=8;i++){ const u=i/8; c.lineTo(px-u*fw,top+2+Math.sin(t*6-u*4)*2.6*u); }
  for(let i=8;i>=0;i--){ const u=i/8; c.lineTo(px-u*fw,top+2+fh+Math.sin(t*6-u*4)*2.6*u); }
  c.closePath(); c.fillStyle=s.spec.flag||'#2f6fd0'; c.fill(); c.lineWidth=1.8; c.stroke();
  const ex=px-fw*0.5, ey=top+2+fh/2+Math.sin(t*6-2)*1.3;
  if(s.spec.pirate) drawSkull(c,ex,ey-1,4.6);
  else { c.fillStyle='#ffd23f'; star(c,ex,ey,6,2.6,5); c.fill(); c.lineWidth=1.2; c.stroke(); }
  circ(c,px,top,2.8); c.fillStyle='#e2ab3c'; c.fill(); c.lineWidth=1.4; c.stroke();
}
function drawScaffold(c,s){
  const w=s.w, rows=s.topRows, x0=-w/2, top=-rows*B;
  c.lineCap='round';
  for(const pass of [0,1]){
    c.strokeStyle=pass?'#8a6440':INK; c.lineWidth=pass?3.2:6.4;
    c.beginPath();
    for(let i=0;i<=s.cols;i++){ c.moveTo(x0+i*B,-1); c.lineTo(x0+i*B,top); }
    for(let r=1;r<=rows;r++){ c.moveTo(x0,-r*B); c.lineTo(x0+w,-r*B); }
    c.stroke();
  }
  const filled=new Set(); for(const cell of s.cells) if(cell.alive) filled.add(cell.c+','+cell.r);
  c.strokeStyle='#6d4c30'; c.lineWidth=2;
  c.beginPath();
  for(let r=0;r<rows;r++) for(let col=0;col<s.cols;col++){ if(filled.has(col+','+r)) continue; const x=x0+col*B, y=-(r+1)*B; c.moveTo(x+5,y+5); c.lineTo(x+B-5,y+B-5); c.moveTo(x+B-5,y+5); c.lineTo(x+5,y+B-5); }
  c.stroke();
}
function drawRopes(c,s,t){
  c.strokeStyle='#4a3a2a'; c.lineWidth=1.6;
  c.beginPath();
  for(const b of s.balloons){ if(!b.alive) continue; const by=b.ly+Math.sin(t*1.3+b.wob)*2, rx=b.R*0.9;
    c.moveTo(b.lx-rx*0.5,by+b.R*0.82); c.lineTo(b.ax-9,b.ay);
    c.moveTo(b.lx+rx*0.5,by+b.R*0.82); c.lineTo(b.ax+9,b.ay);
    c.moveTo(b.lx,by+b.R*1.05); c.lineTo(b.ax,b.ay); }
  c.stroke();
}
function drawPost(c,s,cell,x,y,mat,covered,t){
  const L=lookOf(cell.crew,s.spec.pirate);
  rr(c,x+0.5,y+0.5,B-1,B-1,4); c.fillStyle=mat.inner; c.fill();
  if(L.legend) drawAura(c,x+B/2,y+B/2-4,t+cell.bob);
  drawCrewBody(c,cell.crew,x+B/2-1,y+B-3,t+cell.bob,s.spec.pirate);
  c.lineWidth=2.2; c.strokeStyle=INK; c.fillStyle=L.legend?'#f2c14e':mat.base;
  const py=y+B*0.56;
  rr(c,x+0.5,py,B-1,B-py+y-0.5,3); c.fill(); c.stroke();
  c.fillStyle=L.legend?'#fff3c4':mat.light; c.fillRect(x+3,py+2.5,B-6,2.5);
  const pt=covered?y+0.5:y+9;
  c.fillStyle=L.legend?'#f2c14e':mat.base;
  rr(c,x+0.5,pt,5.5,B-0.5-(pt-y),2); c.fill(); c.stroke();
  rr(c,x+B-6,pt,5.5,B-0.5-(pt-y),2); c.fill(); c.stroke();
  if(covered){ rr(c,x+0.5,y+0.5,B-1,5,2); c.fill(); c.stroke(); }
  else { rr(c,x-1,pt-4,8.5,5,2); c.fill(); c.stroke(); rr(c,x+B-7.5,pt-4,8.5,5,2); c.fill(); c.stroke(); }
  if(L.legend){ c.fillStyle='#b52a3e'; star(c,x+B/2,py+9,4,1.8,5); c.fill(); c.lineWidth=1; c.stroke(); }
  const ratio=cell.hp/cell.max;
  if(ratio<0.5){ c.strokeStyle=INK; c.lineWidth=1.5; c.beginPath(); c.moveTo(x+B*0.25,py); c.lineTo(x+B*0.38,py+7); c.lineTo(x+B*0.3,py+12); c.stroke(); }
  const loaded=cell.cd<crewRate(cell.crew,cell.lvl)*0.55;
  drawWeapon(c,cell.crew,x+B/2-1,y+B-3,cell.aim,cell.recoil,t+cell.bob,cell.act||0,loaded,L.skin);
  if(s.freeze>0){ rr(c,x+2,y+2,B-4,B-4,5); c.fillStyle='rgba(180,235,255,.55)'; c.fill(); c.strokeStyle='#ffffff'; c.lineWidth=1.5; c.stroke(); }
  else if(s.chill>0){ rr(c,x+0.5,y+0.5,B-1,B-1,4); c.fillStyle='rgba(150,220,255,.28)'; c.fill(); }
  if(cell.hit>0){ rr(c,x+0.5,y+0.5,B-1,B-1,4); c.fillStyle='rgba(255,255,255,'+Math.min(0.7,cell.hit*6)+')'; c.fill(); }
}
function drawCell(c,s,cell,t){
  const x=-s.w/2+cell.c*B, y=-(cell.r+1)*B;
  const pop=cell.pop>0?1+Math.sin(cell.pop*Math.PI)*0.18:1;
  if(pop!==1){ c.save(); c.translate(x+B/2,y+B/2); c.scale(pop,pop); c.translate(-x-B/2,-y-B/2); }
  const mat=MATS[s.matTier];
  if(cell.type==='W') drawBlock(c,x,y,mat,cell.hp/cell.max,cell.hit);
  else { let covered=false; for(const o of s.cells) if(o.alive&&o.c===cell.c&&o.r===cell.r+1){ covered=true; break; } drawPost(c,s,cell,x,y,mat,covered,t); }
  if(pop!==1) c.restore();
}
function drawShieldBubble(c,s,t){
  if(!(s.shield>0)) return;
  let top=-s.topRows*B-20; for(const b of s.balloons) if(b.alive) top=Math.min(top,b.ly-b.R-8);
  const cx=0, cy=(top+60)/2, rx=s.w/2+72, ry=(60-top)/2+10;
  const a=0.16+0.08*Math.sin(t*4)+0.25*clamp(s.shieldHit||0,0,1);
  ell(c,cx,cy,rx,ry); c.fillStyle='rgba(110,215,255,'+a+')'; c.fill();
  c.lineWidth=2.5; c.strokeStyle='rgba(170,235,255,'+(0.5+a)+')'; c.stroke();
}
function drawShip(c,s,t){
  c.save();
  c.translate(s.x,s.y+(s.dead?0:Math.sin(s.t*1.6)*2.5));
  if(s.rot) c.rotate(s.rot);
  c.scale(s.side,1);
  c.lineJoin='round'; c.lineCap='round';
  drawRopes(c,s,t);
  const order=s.balloons.filter(b=>b.alive).sort((a,b)=>a.ly-b.ly);
  for(const b of order) drawBalloon(c,b,t);
  drawFlag(c,s,t);
  drawStern(c,s);
  drawScaffold(c,s);
  drawRotor(c,s);
  drawHull(c,s);
  for(const cell of s.cells) if(cell.alive) drawCell(c,s,cell,t);
  if(!s.dead) drawShieldBubble(c,s,t);
  if(s.invuln>0&&Math.sin(t*25)>0){ c.globalAlpha=0.35; hullPath(c,s.w); c.fillStyle='#ffffff'; c.fill(); c.globalAlpha=1; }
  c.restore();
}

/* ---------- resource art ---------- */
function drawGear(c,x,y,r,col){
  c.beginPath();
  for(let i=0;i<32;i++){ const a=i/32*TAU, rad=(Math.floor(i/2)%2===0)?r:r*0.74; c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad); }
  c.closePath(); c.fillStyle=col||'#b9c3d3'; c.fill(); c.lineWidth=Math.max(1.4,r*0.14); c.strokeStyle=INK; c.stroke();
  circ(c,x,y,r*0.48); c.fillStyle='#8c97a8'; c.fill(); c.stroke();
  circ(c,x,y,r*0.2); c.fillStyle=INK; c.fill();

/* ================= toast & modal helpers ================= */
let toastT=0;

let modalActs={};
function showModal(html,acts){ modalActs=acts||{}; $('mcard').innerHTML=html; $('modal').hidden=false; refreshIcons($('mcard')); }
function hideModal(){ $('modal').hidden=true; modalActs={}; }
function refreshIcons(root){ for(const img of (root||document).querySelectorAll('img[data-ic]')){ const u=icon(img.dataset.ic); if(img.getAttribute('src')!==u) img.src=u; } }
const IC=(k,cls)=>'<img class="'+(cls||'ii')+'" src="'+icon(k)+'" alt="">';
const COIN='<i class="coin"></i>';

function rewardRows(items){ return '<div class="rows">'+items.map((it,i)=>'<div class="pop" style="animation-delay:'+(0.12*i)+'s"><span>'+it.label+'</span><b>'+(it.ic==='coin'?COIN:IC(it.ic))+(it.amount!=null?'+'+fmt(it.amount):'')+'</b></div>').join('')+'</div>'; }

/* ================= spending ================= */
function gemsFor(coins,gears){ const rate=8*Math.pow(1.045,save.maxLevel-1); return Math.max(1,Math.ceil(Math.max(0,coins)/rate+Math.max(0,gears)/2)); }

    {no:hideModal, yes:()=>{ hideModal(); if(save.gems<amount) return; save.gems-=amount; persist(); fn(); refreshAll(); }});

async function watchAd(placement){

async function buyProduct(id){

/* ================= hangar stage ================= */
function rebuildPreview(){
  const old=preview;
  preview=makeShip(playerSpec(),0); preview.y=0; preview.cruiseY=0;
  if(old){ preview.t=old.t; preview.propA=old.propA; }
}
function hangarLayout(){
  const tb=document.querySelector('.topbar').getBoundingClientRect(), sh=$('sheet').getBoundingClientRect();
  const area=LAND?{x:66,y:tb.bottom,w:sh.left-66-66,h:H-tb.bottom}:{x:44,y:tb.bottom,w:W-88,h:sh.top-tb.bottom};
  const R=preview.balloons.length?preview.balloons[0].R:32;
  const top=-(preview.topRows*B+22+2*R+(preview.balloons.length>=3?R*0.55:0))-6, bot=118, bw=preview.w+120, bh=bot-top;
  hs=clamp(Math.min(area.w/(bw*1.04),area.h/(bh*1.04)),0.38,2.3);
  hox=area.x+area.w/2+4*hs; hoy=area.y+area.h/2-((top+bot)/2)*hs;
}
function drawDock(){
  const w=preview.w, isl=islandSprites()[0], iw=w+150, ih=iw*230/240*0.62;
  ctx.drawImage(isl,-iw/2,58,iw,ih);
  ctx.lineWidth=2.4; ctx.strokeStyle=INK;
  for(const px of [-w/2-26,w/2+30]){ rr(ctx,px-4,46,8,30,3); ctx.fillStyle='#8a5a32'; ctx.fill(); ctx.stroke(); }
  ctx.strokeStyle='#4a3a2a'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(-w/2-26,48); ctx.quadraticCurveTo(-w/2-16,46,-w/2-6,30); ctx.moveTo(w/2+30,48); ctx.quadraticCurveTo(w/2+20,46,w/2+12,30); ctx.stroke();
}
let railT=0;
function updateHangar(dt){
  cam.x+=dt*22;
  preview.t+=dt; preview.propA+=dt*9;
  for(const c of preview.cells) if(c.pop>0) c.pop=Math.max(0,c.pop-dt*3.5);
  for(const p of hfx){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=60*dt; }
  hfx=hfx.filter(p=>p.life>0);
  if(yardFlash){ yardFlash.t-=dt; if(yardFlash.t<=0) yardFlash=null; }
  railT-=dt; if(railT<=0){ railT=1; updateRail(); }
}
function renderHangar(){
  setLoc(levelInfo(Math.min(save.maxLevel,MAX_LEVEL)).loc);
  cam.s=1; cam.gsy=H;
  drawSkyBack(); drawWeather();
  hangarLayout();
  ctx.setTransform(DPR*hs,0,0,DPR*hs,DPR*hox,DPR*hoy);
  ctx.lineJoin='round'; ctx.lineCap='round';
  drawDock();
  drawShip(ctx,preview,gt);
  if(tab==='yard') drawYardGrid();
  for(const p of hfx){ ctx.globalAlpha=clamp(p.life/p.max,0,1); ctx.fillStyle=p.c; star(ctx,p.x,p.y,p.r,p.r*0.45,4); ctx.fill(); }
  ctx.globalAlpha=1;
  if(wheel.dirty) drawWheel();
}
function drawYardGrid(){
  const rows=STAT.rows(save.up.frame), w=preview.w, g=save.grid, pulse=0.55+Math.sin(gt*4)*0.25;
  ctx.save(); ctx.translate(0,Math.sin(preview.t*1.6)*2.5);
  for(let r=0;r<rows;r++) for(let c=0;c<COLS;c++){
    const x=-w/2+c*B, y=-(r+1)*B; if(g[r][c]) continue;
    const sup=r===0||!!g[r-1][c];
    ctx.setLineDash(sup?[5,4]:[2,5]); ctx.lineWidth=2; ctx.strokeStyle=sup?'rgba(255,255,255,'+pulse+')':'rgba(255,255,255,.35)';
    rr(ctx,x+3,y+3,B-6,B-6,6); ctx.stroke();
    if(sup){ ctx.setLineDash([]); ctx.lineWidth=3; line(ctx,x+B/2,y+B/2-6,x+B/2,y+B/2+6); line(ctx,x+B/2-6,y+B/2,x+B/2+6,y+B/2); }
  }
  ctx.setLineDash([]);
  if(yardFlash){ const x=-w/2+yardFlash.c*B, y=-(yardFlash.r+1)*B; ctx.strokeStyle=yardFlash.bad?'#f0503f':'#fff4a6'; ctx.lineWidth=3; ctx.globalAlpha=clamp(yardFlash.t*3,0,1); rr(ctx,x-2,y-2,B+4,B+4,7); ctx.stroke(); ctx.globalAlpha=1; }
  ctx.restore();
}
function sparkle(lx,ly,n,col){ for(let i=0;i<n;i++) hfx.push({x:lx+rand(-14,14),y:ly+rand(-14,14),vx:rand(-60,60),vy:rand(-110,-30),life:rand(0.5,0.9),max:0.9,r:rand(4,7),c:col||'#fff4a6'}); }
function upgradeFx(id){
  const s=preview;
  if(id==='wall'||id==='frame'||id==='autoRep') for(const c of s.cells) if(c.type==='W') c.pop=1;
  if(id==='wall'||id==='frame'||id==='hull'||id==='autoRep') sparkle(0,id==='hull'?20:-B,14);
  if(id==='powder'||id==='sights'||id==='loot') for(const c of s.cells) if(c.type==='crew'){ c.pop=1; sparkle(-s.w/2+c.c*B+B/2,-(c.r+0.5)*B,5); }
  if(id[0]==='b'&&id!=='boost') for(const b of s.balloons) sparkle(b.lx,b.ly,6);
  if(id==='thrust'||id==='boost'||id==='dodge') sparkle(-s.w/2-45,20,12);
  if(id==='rotor') sparkle(0,56,12);
}
function hangarTap(sx,sy){
  if(!preview) return;
  const lx=(sx-hox)/hs, ly=(sy-hoy)/hs-Math.sin(preview.t*1.6)*2.5;
  const c=Math.floor((lx+preview.w/2)/B), r=Math.floor(-ly/B), rows=STAT.rows(save.up.frame);
  if(c<0||c>=COLS||r<0||r>=rows) return;
  if(tab!=='yard'){ setTab('yard'); return; }
  applyTool(c,r);
}
function applyTool(c,r){
  const g=save.grid, cur=g[r][c];
  const flash=bad=>{ yardFlash={c,r,t:0.6,bad}; };
  if(tool==='erase'){
    if(!cur){ flash(true); return; }
    for(let r2=r;r2<4;r2++) g[r2][c]=null;
    Snd.play('crunch',0.6);
  } else {
    if(r>0&&!g[r-1][c]){ flash(true); toast('Блоку нужна опора снизу'); return; }
    if(tool==='W'){ if(cur==='W'){ flash(false); return; } if(cur){ flash(true); toast('Здесь стоит '+CREW[cur].name.toLowerCase()+'. Чтобы поставить стену, сначала уберите бойца'); return; } g[r][c]='W'; }
    else {
      if(cur===tool){ flash(false); return; }
      for(let r2=0;r2<4;r2++) for(let c2=0;c2<COLS;c2++) if(g[r2][c2]===tool){ const above=r2<3&&g[r2+1][c2]; g[r2][c2]=cur?cur:(above?'W':null); }
      g[r][c]=tool;
    }
    Snd.play('click');
  }
  persist(); rebuildPreview();
  const cell=preview.cells.find(x=>x.c===c&&x.r===r); if(cell) cell.pop=1;
  flash(false);
  if(designWeight()>designLift()) toast('Перегруз: подъём меньше веса. Улучшите баллоны или уберите блок');
  renderSheet();
}

async function doSpin(){

function weightedPick(list){ let r=Math.random()*list.reduce((a,s)=>a+s.w,0); for(let i=0;i<list.length;i++){ r-=list[i].w; if(r<=0) return i; } return 0; }
function startSpin(){
  if(panelName!=='wheel') openPanel('wheel');
  const idx=weightedPick(WHEEL), N=WHEEL.length, seg=TAU/N;
  let target=-Math.PI/2-(idx+0.5)*seg+rand(-0.35,0.35)*seg;
  while(target<wheel.angle+TAU*5) target+=TAU;
  Object.assign(wheel,{spinning:true, from:wheel.angle, to:target, t:0, idx, lastSeg:Math.floor(wheel.angle/seg)});
  const b=$('pBody').querySelector('[data-spin]'); if(b) b.disabled=true;
}
function updateWheel(dt){
  if(!wheel.spinning) return;
  wheel.t+=dt; const u=clamp(wheel.t/wheel.dur,0,1), e=1-Math.pow(1-u,4);
  wheel.angle=lerp(wheel.from,wheel.to,e);
  const seg=TAU/WHEEL.length, sg=Math.floor(wheel.angle/seg); if(sg!==wheel.lastSeg){ wheel.lastSeg=sg; Snd.play('tick'); }
  wheel.dirty=true;
  if(u>=1){ wheel.spinning=false; wheel.angle%=TAU; grantWheel(WHEEL[wheel.idx]); }
}

function makeLevel(n){
  const info=levelInfo(n), c=info.circle, st=info.stage, len=2000+st*180, ev=[];
  const g=Math.min(6,1+Math.floor(st/2)+Math.floor((c-1)/2)), bm=Math.min(5,Math.floor(st/2)+Math.floor((c-1)/2));
  ev.push({at:160, type:'wave', g:Math.min(g,3), b:n>=2?Math.min(bm,2):0});
  ev.push({at:520, type:'chest'});
  ev.push({at:800, type:'ship', kind:n<=2?'scout':(st>=3||c>1)?'frigate':'scout'});
  ev.push({at:1150, type:'wave', g, b:bm});
  if(!info.boss&&(st>=2||c>=2)) ev.push({at:1450, type:'ship', kind:'scout'});
  if(!info.boss&&(st>=4||c>=3)) ev.push({at:1700, type:'ship', kind:c>=3?'frigate':'scout'});
  ev.push({at:Math.round(len*0.64), type:'chest'});
  if(n>=2) ev.push({at:len-700, type:'wave', g:Math.min(7,g+1), b:Math.min(6,bm+1)});
  ev.push({at:len-380, type:'ship', kind:info.boss?'boss':(st>=3||c>1)?'frigate':'scout'});
  if(info.boss&&c>=2) ev.push({at:len-360, type:'ship', kind:'scout'});
  ev.sort((a,b)=>a.at-b.at);
  return {len, ev, boss:info.boss, info};
}

/* ================= damage & statuses ================= */
function damage(p,amt,hx,hy){
  if(!partAlive(p)) return;
  const s=p.ship;
  if(s&&s.invuln>0) return;
  amt=Math.max(1,amt);
  if(s&&s.shield>0){ const a=Math.min(s.shield,amt); s.shield-=a; amt-=a; s.shieldHit=1; if(amt<0.5){ if(Math.random()<0.25) addText(hx,hy-8,'щит','#9fe8ff',13); return; } }
  amt=Math.max(1,Math.round(amt));
  p.hp-=amt; p.hit=0.12;
  const own=p.kind==='flier'?-1:s.side;
  addText(hx,hy-8,fmt(amt),own===1?'#ff9b8a':(p.kind==='balloon'?'#ffe066':'#ffffff'),own===1?14:16);
  if(p.hp<=0){ p.hp=0; destroyPart(p); }
}
function heal(p,amt,quiet){
  if(!partAlive(p)) return;
  const v=Math.min(p.max-p.hp,Math.round(amt)); if(v<=0) return;
  p.hp+=v; if(quiet) return;
  const q=partPos(p); addText(q.x,q.y-10,'+'+fmt(v),'#7dff8a',15);
  for(let i=0;i<4;i++) addP({t:'heal', x:q.x+rand(-12,12), y:q.y+rand(-10,10), vx:0, vy:-40, life:0.6, max:0.6});
}
function addBurn(p,dps){
  if(!partAlive(p)) return;
  if(p.kind==='flier'){ damage(p,dps,p.x,p.y); return; }
  const b=burns.find(x=>x.p===p); if(b){ b.t=3; b.dps=Math.max(b.dps,dps); } else burns.push({p,t:3,dps,acc:0});
}
function updateBurns(dt){
  for(const b of burns){
    b.t-=dt; b.acc+=dt;
    if(!partAlive(b.p)){ b.t=0; continue; }
    const q=partPos(b.p);
    if(Math.random()<dt*14) addP({t:'fire', x:q.x+rand(-12,12), y:q.y+rand(-8,10), vx:rand(-10,10), vy:-50, r:rand(4,7), life:0.4, max:0.4});
    if(b.acc>=0.5){ b.acc-=0.5; damage(b.p,b.dps*0.5,q.x,q.y); }

function shipParts(s,withBal){ const a=[]; for(const c of s.cells) if(c.alive) a.push(c); a.push(s.hull); if(withBal) for(const b of s.balloons) if(b.alive) a.push(b); return a; }

function zap(s,from,first,dmg,chains){

}
function skyStrike(s,dmg){

  const tg=pool.slice(0,6), pos=tg.map(partPos);
  tg.forEach((p,i)=>{ const q=pos[i]; bolt({x:q.x+rand(-40,40),y:q.y-700},q,'#fff6a0'); addP({t:'flash', x:q.x, y:q.y, r:40, life:0.15, max:0.15}); damage(p,dmg,q.x,q.y); });

}
function blizzard(s,dmg){
  for(const o of hostileShips(s.side)){

    for(const c of o.cells) if(c.alive&&c.type==='crew'){ const q=cellPos(o,c); damage(c,dmg*0.5,q.x,q.y); snowBurst(q.x,q.y,6); }

function updateCrew(s,dt){

    if(s.side===1&&run.focus&&partAlive(run.focus)&&!sup) tg=run.focus;
    else if(!partAlive(tg)||cell.retarget<=0||(cell.crew==='mechanic'&&tg&&tg.hp>=tg.max)){ tg=pickTarget(s,cell); cell.retarget=0.7; }

function onHit(p,part){

function wrapA(a){ while(a>Math.PI) a-=TAU; while(a<-Math.PI) a+=TAU; return a; }

function randomPlayerPart(){ if(!P||P.dead) return null; const bl=P.balloons.filter(b=>b.alive); if(bl.length&&Math.random()<0.5) return pick(bl); const cs=P.cells.filter(c=>c.alive); if(cs.length) return pick(cs); return P.hull; }
