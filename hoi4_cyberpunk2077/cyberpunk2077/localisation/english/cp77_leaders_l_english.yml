l_english:
 ZNC_corpo_board_desc:0 "Представители Арасаки, Милитеха, Кан Тао и Биотехники заседают за одним столом и мило улыбаются, держа руки на кобурах."
 ZNC_hanako_desc:0 "Дочь Сабуро Арасаки. Элегантна, расчётлива, верна отцу — даже если отец теперь живёт в теле её брата."
 ZNC_stout_desc:0 "Бывший агент Милитеха с холодным взглядом и горячим нравом. Теперь — генерал-губернатор."
 ZNC_peralez_desc:0 "Харизматичный кандидат в мэры, честный политик… Или очень хорошо запрограммированный."
 ZNC_johnny_desc:0 "Рокер, террорист, легенда. Взорвал Арасака-тауэр в 2023 году, умер, был оцифрован, вернулся. Курит даже будучи энграммой."
 ZNC_v_desc:0 "Наёмник(ца) из Найт-Сити. С биочипом в голове, пушкой в руке и полным отсутствием инстинкта самосохранения."
 ZNC_panam_desc:0 "Кочевница из клана Альдекальдо. Ненавидит корпоратов, обожает свою машину. Возможно, и вас."
 ZNC_brick_desc:0 "Лидер Мальстрёма. Больше металла, чем мяса. Голос звучит как скрежет мусоропровода."
 ZNC_padre_desc:0 "Фиксер Хейвуда, бывший священник. Говорит тихо, стреляет точно."
 ZNC_wakako_desc:0 "Старейший фиксер Уэстбрука. Улыбается как бабушка, торгуется как дьявол."
 ZNC_jackie_desc:0 "Лучший друг Ви. Умер в отеле «Конпеки Плаза». Или не умер? Хейвуд верит в чудеса."
 ZNC_placide_desc:0 "Правая рука Вуду-боев. Подозрителен, суров и очень не любит чужаков из Уотсона."
 ZNC_alt_desc:0 "Гениальный нетраннер, убитая Soulkiller-ом в 2013 году. Теперь — сущность за Чёрным Заслоном, которой глубоко безразличны человеческие чувства."
 ZNC_netwatch_desc:0 "Глава отделения NetWatch по Западному побережью. Никогда не снимает очки. Никогда не моргает."
 ZNC_delamain_desc:0 "Искусственный интеллект службы такси. Безупречно вежлив. Знает каждую улицу. Страдает от раздвоения… нет, от двадцатиодноения личности."
 ZNC_brendan_desc:0 "Торговый автомат с ИИ. Любит философию, людей и газировку. Возможно, единственный честный политик в истории города."
 ZNC_blue_eyes_desc:0 "Неизвестно, кто он. Неизвестно, человек ли он. Известно только, что он всегда на шаг впереди."
 ZNC_judy_desc:0 "Лучший редактор брейндансов в городе. Мечтательница, бунтарка, ныряльщица. Ненавидит Тигриных Когтей."
 ZNC_lizzy_desc:0 "Поп-дива, полностью заменившая тело хромом. Голос — синтезатор, сердце — турбина, харизма — оружие массового поражения."
 USA_myers_engram_desc:0 "Цифровая копия президента, транслируемая в голографические трибуны по всей стране. Никогда не устаёт. Никогда не ошибается. Никогда не умрёт."
 JAP_yorinobu_desc:0 "Блудный сын, бывший лидер банды «Стальные драконы». Ненавидит корпорацию отца и мечтает её уничтожить."
 JAP_hanako_desc:0 "Наследница, верная воле отца. Её главный план — поместить энграмму Сабуро в тело брата."
 JAP_saburo_reborn_desc:0 "Основатель корпорации в молодом теле собственного сына. Жутко? Арасака предпочитает слово «преемственность»."
 JAP_digital_saburo_desc:0 "Энграмма Сабуро Арасаки, слившаяся с корпоративной сетью. Он не человек. Он — бренд."
 ZFT_corn_king_desc:0 "Бывший генеральный директор Петрохема. Считает, что кукуруза разумна, а люди — её инструмент. Возможно, прав."
 ZFP_druid_desc:0 "Коллективный разум миллиона генномодифицированных деревьев. Мыслит медленно, но очень глубоко."
 USA_myers_desc:0 "Президент НСША, бывшая глава Милитеха. Железная воля, стальные нервы и, по слухам, титановый позвоночник."
 JAP_saburo_desc:0 "Основатель и глава корпорации Арасака. 158 лет, из них 100 — у власти. Тело — почти полностью кибернетическое."
 CHI_kangtao_desc:0 "Самая быстрорастущая оружейная корпорация мира и фактическое правительство Китая."
 SOV_sovoil_desc:0 "Нефтяной гигант, который пережил распад, войны и Коллапс. И стал государством."
 FRA_eec_desc:0 "Лицо Европейского экономического сообщества. Улыбается в камеры и подписывает торговые соглашения."
 ZNC_council_desc:0 "После гибели мэра Люциуса Райна городом управляет совет. Половина его членов подкуплена Арасакой, половина — Милитехом, ещё половина — бандами. Да, это три половины. Это Найт-Сити."
 ZFT_maddox_desc:0 "Нефтяник, ковбой и убеждённый сепаратист. Носит шляпу даже в душе."
 ZFP_valiant_desc:0 "Бывший биоинженер Биотехники, ставшая главой Свободных штатов Северо-Запада."
 ZBL_saul_desc:0 "Глава клана Альдекальдо. Осторожный, мудрый, упрямый как мул. Панам с ним вечно спорит."
