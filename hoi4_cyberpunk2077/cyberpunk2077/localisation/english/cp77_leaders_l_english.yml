l_english:
 ZCA_beaumont_desc:0 "Лидер Квебека, мечтающий о дружбе с Европой и о круассанах с имплантами."
 ZCA_maple_desc:0 "Коллективный разум миллиона кленов. Вежлив до невозможности. Извиняется перед каждым приказом."
 ZMX_aztlan_desc:0 "Генерал-националист с мечтой о Великом Ацтлане."
 ZMX_muerte_desc:0 "Голограмма-скелет в свадебном платье. Утверждает, что она — Святая Смерть. Никто не спорит."
 ZCM_comandante_desc:0 "Партизанка во втором поколении. Знает каждую тропу в джунглях."
 ZCM_lock_desc:0 "Управляющая программа Панамского канала. Пропускает суда, считает деньги, презирает людей."
 ZBR_silva_desc:0 "Биоинженер Биотехники, ставшая президентом. Говорит с деревьями. Деревья отвечают."
 ZBR_rei_momo_desc:0 "Король карнавала, которого забыли переизбрать. Уже двенадцать лет."
 ZAD_inti_desc:0 "Шахтёр из Потоси, ставший вождём революции."
 ZAD_eldorado_desc:0 "Золотой ИИ неизвестного происхождения. Говорит на кечуа, испанском и ассемблере."
 ZSC_general_desc:0 "Ветеран войны в Андах. Мечтает о Великом Юге."
 ZSC_penguin_desc:0 "Императорский пингвин с имплантом-переводчиком. Говорит медленно, думает быстро, носит фрак от природы."
 ZEU_form_desc:0 "Бюрократический ИИ. Требует заполнить форму, чтобы получить форму для заполнения формы."
 ZUK_ada_desc:0 "Бывший нетраннер MI6. Знает пароли всех министров."
 ZUK_holo_desc:0 "Мерцающий король. Иногда виснет посреди тронной речи. Подданные делают вид, что так и надо."
 ZEE_volkov_desc:0 "Бывший директор СовОйла в Варшаве."
 ZEE_count_desc:0 "Носит плащ, спит в капсуле, пьёт синтетическую кровь с витаминами. Утверждает, что ему 600 лет."
 ZSV_lenin_desc:0 "Энграмма Владимира Ильича в голографической кепке. Пишет 40 статей в день и критикует всех."
 ZME_nadia_desc:0 "Радиобиолог, двадцать лет очищавшая землю от изотопов."
 ZME_baron_desc:0 "Владелец уцелевших скважин и частной армии в свинцовой броне."
 ZME_glow_desc:0 "Мутант, светящийся зелёным. Слышит голос реактора и щёлкает, как счётчик Гейгера."
 ZAF_amara_desc:0 "Бывший профсоюзный лидер шахтёров. Мечтает объединить континент."
 ZAF_matriarch_desc:0 "Пожилая слониха-нетраннер с отличной памятью. Помнит всё. Буквально всё."
 ZSH_kone_desc:0 "Молодой офицер, возглавивший революцию. Носит берет и нейроимплант."
 ZSH_pharaoh_desc:0 "ИИ неизвестного происхождения. Говорит иероглифами, требует золотые серверные стойки."
 ZCH_zhou_desc:0 "Аппаратчик старой школы. Ненавидит корпорации и голограммы."
 ZCH_emperor_desc:0 "ИИ-император, рассчитавший свой Мандат Неба с точностью до шестого знака."
 ZIN_singh_desc:0 "Генерал, мечтающий о господстве в Индийском океане."
 ZIN_star_desc:0 "Голографическая кинозвезда, ведущая страну в ритме танца. Каждая речь — музыкальный номер."
 ZSE_pirate_desc:0 "Король пиратов пролива. Абордажи совершает через Сеть и с гарпуном."
 ZSE_tide_desc:0 "Архитектурный ИИ, считающий сушу устаревшей технологией."
 ZAU_max_desc:0 "Молчаливый водитель перехватчика. Говорит редко, ездит быстро."
 ZAU_roo_desc:0 "Двухметровый кенгуру в кевларе. Нокаутирует министров на совещаниях. Министры не против."
 ZNC_corpo_board_desc:0 "Представители Арасаки, Милитеха, Кан Тао и Биотехники заседают за одним столом и мило улыбаются, держа руки на кобурах."
 ZNC_hanako_desc:0 "Дочь Сабуро Арасаки. Элегантна, расчётлива, верна отцу — даже если отец теперь живёт в теле её брата."
 ZNC_stout_desc:0 "Бывший агент Милитеха с холодным взглядом и горячим нравом. Теперь — генерал-губернатор."
 ZNC_peralez_desc:0 "Харизматичный кандидат в мэры, честный политик… Или очень хорошо запрограммированный."
 ZNC_johnny_desc:0 "Рокер, террорист, легенда. Взорвал Арасака-тауэр в 2023 году, умер, был оцифрован, вернулся. Курит даже будучи энграммой."
 ZNC_v_desc:0 "Наёмник(ца) из Найт-Сити. С биочипом в голове, пушкой в руке и полным отсутствием инстинкта самосохранения."
 ZNC_panam_desc:0 "Кочевница из клана Альдекальдо. Ненавидит корпоратов, обожает свою машину. Возможно, и вас."
 ZNC_brick_desc:0 "Лидер Мальстрёма. Больше металла, чем мяса. Голос звучит как скрежет мусоропровода."
 ZNC_padre_desc:0 "Фиксер Хейвуда, бывший священник. Говорит тихо, стреляет точно."
 ZNC_wakako_desc:0 "Старейший фиксер Уэстбрука. Улыбается как бабушка, торгуется как дьявол."
 ZNC_jackie_desc:0 "Лучший друг Ви. Умер в отеле «Конпеки Плаза». Или не умер? Хейвуд верит в чудеса."
 ZNC_placide_desc:0 "Правая рука Вуду-боев. Подозрителен, суров и очень не любит чужаков из Уотсона."
 ZNC_alt_desc:0 "Гениальный нетраннер, убитая Soulkiller-ом в 2013 году. Теперь — сущность за Чёрным Заслоном, которой глубоко безразличны человеческие чувства."
 ZNC_netwatch_desc:0 "Глава отделения NetWatch по Западному побережью. Никогда не снимает очки. Никогда не моргает."
 ZNC_delamain_desc:0 "Искусственный интеллект службы такси. Безупречно вежлив. Знает каждую улицу. Страдает от раздвоения… нет, от двадцатиодноения личности."
 ZNC_brendan_desc:0 "Торговый автомат с ИИ. Любит философию, людей и газировку. Возможно, единственный честный политик в истории города."
 ZNC_blue_eyes_desc:0 "Неизвестно, кто он. Неизвестно, человек ли он. Известно только, что он всегда на шаг впереди."
 ZNC_judy_desc:0 "Лучший редактор брейндансов в городе. Мечтательница, бунтарка, ныряльщица. Ненавидит Тигриных Когтей."
 ZNC_lizzy_desc:0 "Поп-дива, полностью заменившая тело хромом. Голос — синтезатор, сердце — турбина, харизма — оружие массового поражения."
 USA_myers_engram_desc:0 "Цифровая копия президента, транслируемая в голографические трибуны по всей стране. Никогда не устаёт. Никогда не ошибается. Никогда не умрёт."
 JAP_yorinobu_desc:0 "Блудный сын, бывший лидер банды «Стальные драконы». Ненавидит корпорацию отца и мечтает её уничтожить."
 JAP_hanako_desc:0 "Наследница, верная воле отца. Её главный план — поместить энграмму Сабуро в тело брата."
 JAP_saburo_reborn_desc:0 "Основатель корпорации в молодом теле собственного сына. Жутко? Арасака предпочитает слово «преемственность»."
 JAP_digital_saburo_desc:0 "Энграмма Сабуро Арасаки, слившаяся с корпоративной сетью. Он не человек. Он — бренд."
 ZFT_corn_king_desc:0 "Бывший генеральный директор Петрохема. Считает, что кукуруза разумна, а люди — её инструмент. Возможно, прав."
 ZFP_druid_desc:0 "Коллективный разум миллиона генномодифицированных деревьев. Мыслит медленно, но очень глубоко."
 USA_myers_desc:0 "Президент НСША, бывшая глава Милитеха. Железная воля, стальные нервы и, по слухам, титановый позвоночник."
 JAP_saburo_desc:0 "Основатель и глава корпорации Арасака. 158 лет, из них 100 — у власти. Тело — почти полностью кибернетическое."
 ZNC_council_desc:0 "После гибели мэра Люциуса Райна городом управляет совет. Половина его членов подкуплена Арасакой, половина — Милитехом, ещё половина — бандами. Да, это три половины. Это Найт-Сити."
 ZFT_maddox_desc:0 "Нефтяник, ковбой и убеждённый сепаратист. Носит шляпу даже в душе."
 ZFP_valiant_desc:0 "Бывший биоинженер Биотехники, ставшая главой Свободных штатов Северо-Запада."
 ZBL_saul_desc:0 "Глава клана Альдекальдо. Осторожный, мудрый, упрямый как мул. Панам с ним вечно спорит."
 ZCA_start_desc:0 "Осторожный политик, пережившая Коллапс в Оттаве. Мечтает, чтобы Канада осталась скучной и живой."
 ZMX_start_desc:0 "Бывший адвокат картелей, ставшая президентом. Знает всех, всем должна."
 ZCM_start_desc:0 "Командующий оккупационными силами Милитеха. Здесь с 2050-х. Уехать не может — некуда."
 ZBR_start_desc:0 "Глава военно-корпоративной хунты. Футбольный фанат и любитель экзоскелетов."
 ZAD_start_desc:0 "Глава Медельинского синдиката. Официально — министр сельского хозяйства."
 ZSC_start_desc:0 "Аргентинский технократ, объединившая Аргентину, Чили, Уругвай и Парагвай."
 ZEU_start_desc:0 "Председатель Еврокомиссии. Подписывает по 400 регламентов в день. Не спит, потому что не успевает."
 ZEE_start_desc:0 "Польский политик, собравший Восточную Европу в союз между ЕЭС и СССР."
 ZSV_start_desc:0 "Генсек и одновременно гендиректор СовОйла. Обе должности в одном кресле — удобно."
 ZME_start_desc:0 "После ядерного «Ближневосточного расплава» 1990-х здесь правят те, кто выжил: вожди кланов, инженеры и нефтяные бароны."
 ZAF_start_desc:0 "Глава совета корпораций Союза. Алмазы, платина и импланты — его сфера."
 ZSH_start_desc:0 "Лидер федерации от Атлантики до Красного моря. Ездит по стране в бронированном поезде на солнечных батареях."
 ZCH_start_desc:0 "Председатель совета директоров Кан Тао и одновременно Председатель КНР. Никто уже не помнит, какая должность главнее."
 ZIN_start_desc:0 "Технократ из Бангалора. Управляет страной через приложение, которым пользуется миллиард человек."
 ZSE_start_desc:0 "Глава управляющей компании Юго-Восточной Азии. Город-государство превратилось в государство-корпорацию."
 ZAU_start_desc:0 "Бывший шахтёр и кочевник. Правит из передвижного штаба на краю пустыни."
 ZUK_start_desc:0 "Монарх, владеющий 51% акций королевства. Остальные 49% — у банков Сити."
