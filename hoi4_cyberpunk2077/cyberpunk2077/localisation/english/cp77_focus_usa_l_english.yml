l_english:
 CP77_USA_new_united_states:0 "Новые Соединённые Штаты"
 CP77_USA_new_united_states_desc:0 "Америка разорвана: Свободные штаты, Найт-Сити, Пустоши. Президент Розалинд Майерс собирает её заново."
 CP77_USA_militech_state:0 "Государство Милитеха"
 CP77_USA_militech_state_desc:0 "Майерс — бывшая глава Милитеха. Совпадение? Нет."
 CP77_USA_myers_doctrine:0 "Доктрина Майерс"
 CP77_USA_myers_doctrine_desc:0 "Единая страна. Единая армия. Единая корпорация… то есть правительство."
 CP77_USA_fia_network:0 "Сеть FIA"
 CP77_USA_fia_network_desc:0 "Федеральная разведка — длинная рука Вашингтона."
 CP77_USA_militech_army:0 "Армия Милитеха"
 CP77_USA_militech_army_desc:0 "Частная армия, которая официально является государственной."
 CP77_USA_war_economy:0 "Военная экономика"
 CP77_USA_war_economy_desc:0 "Заводы Милитеха работают в три смены."
 CP77_USA_orbital_industry:0 "Орбитальная промышленность"
 CP77_USA_orbital_industry_desc:0 "Невесомость — идеальное место для производства микросхем."
 CP77_USA_chimera_program:0 "Программа «Химера»"
 CP77_USA_chimera_program_desc:0 "Гигантский паукообразный мех Милитеха. Тот самый, что гонялся за Ви в Догтауне."
 CP77_USA_crystal_palace:0 "Хрустальный дворец"
 CP77_USA_crystal_palace_desc:0 "Орбитальная станция становится вторым правительственным центром."
 CP77_USA_mech_divisions:0 "Дивизии мехов"
 CP77_USA_mech_divisions_desc:0 "Шагающая бронетехника на каждом фронте."
 CP77_USA_rods_from_god:0 "Стержни Господни"
 CP77_USA_rods_from_god_desc:0 "Вольфрамовые стержни с орбиты. Кинетическая бомбардировка без радиации — гуманно!"
 CP77_USA_unification_war_ii:0 "Вторая война за объединение"
 CP77_USA_unification_war_ii_desc:0 "Свободные штаты вернутся в Союз. Под звуки маршей или канонады."
 CP77_USA_new_federalism:0 "Новый федерализм"
 CP77_USA_new_federalism_desc:0 "Широкая автономия для штатов — в обмен на лояльность."
 CP77_USA_reclaim_night_city:0 "Вернуть Найт-Сити"
 CP77_USA_reclaim_night_city_desc:0 "Город на западном побережье слишком долго играл в независимость."
 CP77_USA_crush_free_states:0 "Сломить Свободные штаты"
 CP77_USA_crush_free_states_desc:0 "Техас, Северо-Запад, Пустоши — всех вернуть под звёздно-полосатый флаг."
 CP77_USA_one_nation:0 "Единая нация"
 CP77_USA_one_nation_desc:0 "От Атлантики до Тихого океана — одна страна."
 CP77_USA_myers_forever:0 "Майерс навсегда"
 CP77_USA_myers_forever_desc:0 "На 50-летие президентства Майерс выглядит на 45. Шёпотом говорят: оригинал умер в 2071, а страной правит её энграмма в Хрустальном дворце."
 CP77_USA_dogtown_operation:0 "Операция в Догтауне"
 CP77_USA_dogtown_operation_desc:0 "Кошмар: самолёт президента падает в Догтаун, район Курта Хансена. Нужна помощь лучшего наёмника города."
 CP77_USA_save_songbird:0 "Спасти Сойку"
 CP77_USA_save_songbird_desc:0 "Сонг Со Ми — лучший нетраннер FIA — хочет свободы. Отпустим её на Луну."
 CP77_USA_betray_songbird:0 "Предать Сойку"
 CP77_USA_betray_songbird_desc:0 "Соломон Рид сдаёт её FIA. Государство превыше дружбы."
 CP77_USA_cynosure_moon:0 "Синошур: путь к Луне"
 CP77_USA_cynosure_moon_desc:0 "Вслед за Сойкой — тысячи колонистов."
 CP77_USA_lunar_republic:0 "Лунная республика"
 CP77_USA_lunar_republic_desc:0 "Правительство решает, что на Луне спокойнее. Столица переезжает. Вашингтон остаётся «филиалом»."
 CP77_USA_blackwall_weapon:0 "Заслон как оружие"
 CP77_USA_blackwall_weapon_desc:0 "Сойка умела говорить с ИИ за Заслоном. FIA хочет поставить это на конвейер."
 CP77_USA_fia_black_ops:0 "Чёрные операции FIA"
 CP77_USA_fia_black_ops_desc:0 "Спящие агенты в каждом Свободном штате."
 CP77_USA_reed_legacy:0 "Наследие Соломона Рида"
 CP77_USA_reed_legacy_desc:0 "Лучший агент FIA учит новое поколение. Его уроки: не доверяй никому, особенно себе."
 CP77_USA_netwatch_takeover:0 "Поглощение NetWatch"
 CP77_USA_netwatch_takeover_desc:0 "Главная служба кибербезопасности теперь — отдел FIA."
 CP77_USA_av_corps:0 "Корпус AV"
 CP77_USA_av_corps_desc:0 "Тысяча боевых AV над Пустошами."
 CP77_USA_barghest_contracts:0 "Контракты с «Баргестом»"
 CP77_USA_barghest_contracts_desc:0 "Полковник Курт Хансен и его головорезы из Догтауна готовы работать на федералов. За правильную цену."
 CP77_USA_fifth_corporate_war:0 "Пятая корпоративная война"
 CP77_USA_fifth_corporate_war_desc:0 "Милитех против Арасаки. Снова. На этот раз — с армией целой страны."
