l_english:
 CP77_BOOKMARK:0 "2077: Город мечты"
 CP77_BOOKMARK_DESC:0 "2077 год. Мир поделён между мегакорпорациями, обломками старых держав, кочевниками и ИИ за Чёрным Заслоном. Кем станете вы — легендой или удобрением?"
 CP77_ZNC_BM:0 "Свободный город на западном побережье. Семь политических путей: от корпоративной префектуры Арасаки до президента-такси и вендократии торгового автомата Брендана."
 CP77_ZNU_BM:0 "Президент Розалинд Майерс собирает расколотую Америку. Вторая война за объединение, Догтаун, Сойка и Луна — или вечная энграмма Майерс."
 CP77_ZJP_BM:0 "Корпоративная Япония Арасаки. Ёринобу против отца, Ханако против брата, Микоси против всего человечества."
 CP77_ZCH_BM:0 "Кан Тао — самая быстрорастущая корпорация мира. Её цель — сбросить Арасаку с трона."
 CP77_ZSV_BM:0 "Советский Союз жив, и всё благодаря СовОйлу. Партия и корпорация — одно целое."
 CP77_ZEU_BM:0 "Европа пережила Коллапс благодаря одной вещи — общей валюте. Теперь эдди правят миром."
 CP77_OTHERS_BM:0 "Свободные штаты, Британия, Индия, Бразилия, Пустоши Ближнего Востока и все остальные державы 2077 года."
 CP77_ZFT_BM:0 "Свободный штат Техас: нефть, кукуруза CHOOH2 и, возможно, Кукурузный император."
 CP77_ZBL_BM:0 "Кочевники Пустошей: семьи на колёсах, Василиски и Великая орда."
 CP77_ZFP_BM:0 "Свободные Штаты Северо-Запада: леса Биотехники, снежный человек-министр и ИИ-друид."
 CP77_ZCA_BM:0 "Канада пережила Коллапс тише всех. Теперь надо решить, с кем идти дальше."
 CP77_ZMX_BM:0 "Беженцы с севера, картели на юге, корпорации повсюду. Мексика выбирает путь."
 CP77_ZCM_BM:0 "Здесь воевали все: США, корпорации, партизаны. Кто будет хозяином теперь?"
 CP77_ZBR_BM:0 "Бразилия — крупнейшая держава Южной Америки. Но чья она?"
 CP77_ZAD_BM:0 "Колумбия, Венесуэла, Перу, Эквадор и Боливия живут под одним флагом — и под одним синдикатом."
 CP77_ZSC_BM:0 "Аргентина, Чили, Уругвай и Парагвай вместе — чтобы не стать добычей Бразилии."
 CP77_ZUK_BM:0 "Британия осталась вне ЕЭС и выжила. Теперь у неё король-акционер и самая мокрая Сеть в мире."
 CP77_ZEE_BM:0 "Восточная Европа пережила все войны XX и XXI века. Переживёт и эту."
 CP77_ZME_BM:0 "Ядерная война 90-х превратила Ближний Восток в пустошь. Пора решить, что строить на пепле."
 CP77_ZAF_BM:0 "Южная и Восточная Африка объединены корпоративным договором. Вопрос — надолго ли."
 CP77_ZSH_BM:0 "Северная и Центральная Африка объединились вокруг энергии солнца. Осталось договориться обо всём остальном."
 CP77_ZIN_BM:0 "Полтора миллиарда человек, миллион стартапов и ни одной скучной минуты."
 CP77_ZSE_BM:0 "Индокитай, Индонезия, Малайзия, Филиппины — одна компания, один совет директоров."
 CP77_ZAU_BM:0 "Австралия и Океания пережили Коллапс в изоляции. Здесь всё хочет тебя убить, и это закаляет."
