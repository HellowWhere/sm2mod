l_english:
 ZMX_root:0 "Мексика 2077"
 ZMX_root_desc:0 "Беженцы с севера, картели на юге, корпорации повсюду. Мексика выбирает путь."
 ZMX_p0_0:0 "Картельный мир"
 ZMX_p0_0_desc:0 "Правительство заключает перемирие с картелями. Официально."
 ZMX_p0_1:0 "Наркоэкономика"
 ZMX_p0_1_desc:0 "Деньги картелей легализованы и обложены налогом."
 ZMX_p0_2:0 "Связи с Хейвудом"
 ZMX_p0_2_desc:0 "Валентинос из Найт-Сити — наши братья."
 ZMX_p0_3:0 "Картель-государство"
 ZMX_p0_3_desc:0 "Президент — глава крупнейшего картеля. Наконец-то честно."
 ZMX_p1_0:0 "Возрождение Ацтлана"
 ZMX_p1_0_desc:0 "Юго-запад США когда-то был мексиканским. Пора вспомнить."
 ZMX_p1_1:0 "Армия Ацтлана"
 ZMX_p1_1_desc:0 "Призыв во имя предков."
 ZMX_p1_2:0 "Претензии на Техас"
 ZMX_p1_2_desc:0 "Техас должен вернуться."
 ZMX_p1_3:0 "Война за Ацтлан"
 ZMX_p1_3_desc:0 "Север будет нашим."
 ZMX_p2_0:0 "Неоновая Санта-Муэрте"
 ZMX_p2_0_desc:0 "Культ Святой Смерти обзавёлся ИИ, который отвечает на молитвы в мессенджере."
 ZMX_p2_1:0 "Вечный День мёртвых"
 ZMX_p2_1_desc:0 "Праздник длится круглый год. Экономика в восторге, кладбища — тоже."
 ZMX_p2_2:0 "Энграммы предков"
 ZMX_p2_2_desc:0 "Каждая семья получает цифровую копию бабушки. Бабушки недовольны."
 ZMX_p2_3:0 "Армия скелетов"
 ZMX_p2_3_desc:0 "Солдаты с полностью хромированными скелетами. Видно сквозь кожу."
 ZMX_eco_0:0 "Макиладоры 2.0"
 ZMX_eco_0_desc:0 "Сборочные заводы для всех корпораций мира."
 ZMX_eco_1:0 "Пемекс возрождённый"
 ZMX_eco_1_desc:0 "Национальная нефтяная корпорация снова в деле."
 ZMX_eco_2:0 "Песо-крипто"
 ZMX_eco_2_desc:0 "Цифровая валюта для теневой экономики."
 ZMX_eco_3:0 "Мехико-мегаполис"
 ZMX_eco_3_desc:0 "Тридцать миллионов жителей в аркологиях."
 ZMX_eco_4:0 "Порт Веракрус"
 ZMX_eco_4_desc:0 "Ворота в Карибское море."
 ZMX_eco_5:0 "Риперы Тихуаны"
 ZMX_eco_5_desc:0 "Самые дешёвые импланты к югу от Найт-Сити."
 ZMX_eco_6:0 "Оружейные мастерские"
 ZMX_eco_6_desc:0 "Каждый гараж — маленький арсенал."
 ZMX_mil_0:0 "Национальная гвардия"
 ZMX_mil_0_desc:0 "Армия, привыкшая воевать с картелями."
 ZMX_mil_1:0 "Спецназ против картелей"
 ZMX_mil_1_desc:0 "Опытные бойцы городских боёв."
 ZMX_mil_2:0 "Пустынная кавалерия"
 ZMX_mil_2_desc:0 "Пикапы с пулемётами."
 ZMX_mil_3:0 "Дроны пустыни"
 ZMX_mil_3_desc:0 "Дешёвые и злые."
 ZMX_mil_4:0 "Народная оборона"
 ZMX_mil_4_desc:0 "Каждый мексиканец — солдат."
