l_english:
 ZCA_root:0 "Канада в 2077 году"
 ZCA_root_desc:0 "Канада пережила Коллапс тише всех. Теперь надо решить, с кем идти дальше."
 ZCA_p0_0:0 "Северный щит НСША"
 ZCA_p0_0_desc:0 "Майерс предлагает оборонный пакт против Свободных штатов."
 ZCA_p0_1:0 "Заводы Милитеха на севере"
 ZCA_p0_1_desc:0 "Милитех строит конвейеры у Великих озёр."
 ZCA_p0_2:0 "Арктическая стена"
 ZCA_p0_2_desc:0 "Сенсорная стена вдоль полярного круга."
 ZCA_p0_3:0 "Пятьдесят первый штат"
 ZCA_p0_3_desc:0 "Канада становится автономией НСША. Зато с армией Майерс за спиной."
 ZCA_p1_0:0 "Республика Квебек"
 ZCA_p1_0_desc:0 "Франкоязычные провинции диктуют условия всей конфедерации."
 ZCA_p1_1:0 "Атлантический мост"
 ZCA_p1_1_desc:0 "Торговый коридор с ЕЭС через северную Атлантику."
 ZCA_p1_2:0 "Ассоциация с ЕЭС"
 ZCA_p1_2_desc:0 "Канада — заокеанский партнёр Европы."
 ZCA_p1_3:0 "Ледовые трассы"
 ZCA_p1_3_desc:0 "Атомные ледоколы открывают северный путь."
 ZCA_p2_0:0 "Кленовый ИИ"
 ZCA_p2_0_desc:0 "Сеть датчиков в кленовых лесах обрела разум и предлагает свои услуги правительству."
 ZCA_p2_1:0 "Стратегический резерв сиропа"
 ZCA_p2_1_desc:0 "Сироп — новая нефть. Клён в этом уверен."
 ZCA_p2_2:0 "Кибер-лоси"
 ZCA_p2_2_desc:0 "Лоси с имплантами патрулируют границу. Очень эффективно. Очень страшно."
 ZCA_p2_3:0 "Великая северная тишина"
 ZCA_p2_3_desc:0 "Клён закрывает границы и уходит в медитацию. Учёные в тишине работают вдвое быстрее."
 ZCA_eco_0:0 "Северная промышленность"
 ZCA_eco_0_desc:0 "Заводы Онтарио снова дымят."
 ZCA_eco_1:0 "Нефтеносные пески Альберты"
 ZCA_eco_1_desc:0 "Последние нефтяные поля континента."
 ZCA_eco_2:0 "Лесные корпорации"
 ZCA_eco_2_desc:0 "ГМО-тайга растёт быстрее, чем её рубят."
 ZCA_eco_3:0 "Банки Торонто"
 ZCA_eco_3_desc:0 "Самые скучные и самые надёжные банки мира."
 ZCA_eco_4:0 "Порты Ванкувера"
 ZCA_eco_4_desc:0 "Тихоокеанские ворота Канады."
 ZCA_eco_5:0 "Технопарк Ватерлоо"
 ZCA_eco_5_desc:0 "Канадские нетраннеры и стартапы."
 ZCA_eco_6:0 "Северная энергосеть"
 ZCA_eco_6_desc:0 "Гидро- и термоядерные станции."
 ZCA_mil_0:0 "Вооружённые силы Канады"
 ZCA_mil_0_desc:0 "Маленькая, но очень вежливая армия."
 ZCA_mil_1:0 "Арктические рейнджеры"
 ZCA_mil_1_desc:0 "Бойцы, выживающие при минус шестидесяти."
 ZCA_mil_2:0 "Северные AV"
 ZCA_mil_2_desc:0 "Воздушные машины для бескрайних расстояний."
 ZCA_mil_3:0 "Снежные мехи"
 ZCA_mil_3_desc:0 "Шагающие танки для тундры."
 ZCA_mil_4:0 "Линия Великих озёр"
 ZCA_mil_4_desc:0 "Укрепления на южной границе. На всякий случай."
