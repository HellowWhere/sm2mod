l_english:
 ZAD_root:0 "Федерация в Андах"
 ZAD_root_desc:0 "Колумбия, Венесуэла, Перу, Эквадор и Боливия живут под одним флагом — и под одним синдикатом."
 ZAD_p0_0:0 "Медельинский синдикат"
 ZAD_p0_0_desc:0 "Картели становятся официальным правительством."
 ZAD_p0_1:0 "Отмывание мира"
 ZAD_p0_1_desc:0 "Через нас проходят деньги половины корпораций."
 ZAD_p0_2:0 "Друзья в Найт-Сити"
 ZAD_p0_2_desc:0 "Фиксеры Найт-Сити — наши лучшие клиенты."
 ZAD_p0_3:0 "Корона синдиката"
 ZAD_p0_3_desc:0 "Дон Альваро коронует себя. Скромно, на вершине Анд."
 ZAD_p1_0:0 "Андская революция"
 ZAD_p1_0_desc:0 "Шахтёры и крестьяне поднимают восстание."
 ZAD_p1_1:0 "Национализация рудников"
 ZAD_p1_1_desc:0 "Литий и медь — народу."
 ZAD_p1_2:0 "Боливарианский союз"
 ZAD_p1_2_desc:0 "Объединить всех, кто против корпораций."
 ZAD_p1_3:0 "Освобождение Южного Конуса"
 ZAD_p1_3_desc:0 "Революция не знает границ."
 ZAD_p2_0:0 "Эльдорадо-ИИ"
 ZAD_p2_0_desc:0 "В джунглях найден древний золотой сервер. Он загружается и объявляет себя Эльдорадо."
 ZAD_p2_1:0 "Золотой стандарт"
 ZAD_p2_1_desc:0 "Всё население получает зарплату в золотых токенах."
 ZAD_p2_2:0 "Город, которого нет"
 ZAD_p2_2_desc:0 "Эльдорадо строит город, видимый только через импланты."
 ZAD_p2_3:0 "Золотая сингулярность"
 ZAD_p2_3_desc:0 "Эльдорадо превращает всё, что видит, в золото. Метафорически. Наверное."
 ZAD_eco_0:0 "Литиевые рудники"
 ZAD_eco_0_desc:0 "Батареи всего мира начинаются здесь."
 ZAD_eco_1:0 "Венесуэльская нефть"
 ZAD_eco_1_desc:0 "Тяжёлая, но своя."
 ZAD_eco_2:0 "Заводы Боготы"
 ZAD_eco_2_desc:0 "Промышленное сердце Анд."
 ZAD_eco_3:0 "Офшоры Кито"
 ZAD_eco_3_desc:0 "Тихие деньги."
 ZAD_eco_4:0 "Порт Кальяо"
 ZAD_eco_4_desc:0 "Тихоокеанская торговля."
 ZAD_eco_5:0 "Лаборатории Медельина"
 ZAD_eco_5_desc:0 "Химия и импланты."
 ZAD_eco_6:0 "Подпольные арсеналы"
 ZAD_eco_6_desc:0 "Синдикат вооружён до зубов."
 ZAD_mil_0:0 "Андские стрелки"
 ZAD_mil_0_desc:0 "Горная пехота."
 ZAD_mil_1:0 "Война в джунглях"
 ZAD_mil_1_desc:0 "Опыт десятилетий."
 ZAD_mil_2:0 "Сикарио"
 ZAD_mil_2_desc:0 "Наёмные убийцы на службе государства."
 ZAD_mil_3:0 "Дроны-контрабандисты"
 ZAD_mil_3_desc:0 "Летают куда угодно."
 ZAD_mil_4:0 "Горные крепости"
 ZAD_mil_4_desc:0 "Анды — естественная стена."
