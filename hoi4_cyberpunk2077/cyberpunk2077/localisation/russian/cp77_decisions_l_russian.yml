l_russian:
 cp77_gangs_category:0 "Банды Найт-Сити"
 cp77_gangs_category_desc:0 "Каждая банда города чего-то хочет. Обычно — денег. Иногда — крови."
 cp77_relic_category:0 "Биочип «Relic»"
 cp77_relic_category_desc:0 "Чип в голове лидера убивает носителя. Найдите выход, пока не поздно.\n\nТекущий уровень киберпсихоза в городе: [?cp77_cyberpsychosis]"
 cp77_netrunning_category:0 "Нетраннинг"
 cp77_netrunning_category_desc:0 "Взлом чужих сетей — оружие XXI века."
 cp77_blackwall_category:0 "Последствия падения Заслона"
 cp77_blackwall_category_desc:0 "Дикие ИИ рыщут по Сети. Надо защищаться."
 cp77_pay_maelstrom:0 "Заплатить Мальстрёму"
 cp77_pay_maelstrom_desc:0 "Ящик хрома — и Мальстрём делится оружием."
 cp77_pay_tyger_claws:0 "Договориться с Тигриными Когтями"
 cp77_pay_tyger_claws_desc:0 "Когти обучают наших бойцов кендзюцу на мотоциклах."
 cp77_pay_valentinos:0 "Почтить Валентинос"
 cp77_pay_valentinos_desc:0 "Офренда, золото и обещание защиты — и Хейвуд даст людей."
 cp77_pay_sixth_street:0 "Наградить Шестую улицу"
 cp77_pay_sixth_street_desc:0 "Ветераны любят медали и патриотические речи."
 cp77_pay_animals:0 "Нанять Животных"
 cp77_pay_animals_desc:0 "Качки на биотестостероне. Не очень умные, но очень сильные."
 cp77_pay_mox:0 "Поддержать Мокс"
 cp77_pay_mox_desc:0 "Мокс защищают работниц «Облаков». Народ это ценит."
 cp77_pay_voodoo:0 "Сделка с Вуду-боями"
 cp77_pay_voodoo_desc:0 "Нетраннеры Пасифики поделятся парой секретов."
 cp77_maxtac_sweep:0 "Зачистка MaxTac"
 cp77_maxtac_sweep_desc:0 "Спецназ прочёсывает худшие кварталы города."
 cp77_cyberpsycho_hunt:0 "Охота на киберпсихов"
 cp77_cyberpsycho_hunt_desc:0 "Регина Джонс платит за каждого обезвреженного киберпсиха.\n\nТекущий уровень киберпсихоза: [?cp77_cyberpsychosis]"
 cp77_cure_cyberpsychosis:0 "Лечение киберпсихоза"
 cp77_cure_cyberpsychosis_desc:0 "Клиники риперов работают бесплатно. Город выдыхает."
 cp77_relic_mission:0 "Время уходит"
 cp77_relic_mission_desc:0 "Биочип «Relic» переписывает нейроны носителя. Если ничего не предпринять, лидер города умрёт, а Джонни останется ни с чем."
 cp77_relic_misty:0 "Расклад Мисти"
 cp77_relic_misty_desc:0 "Мисти раскладывает таро. Карты говорят странное. Карты всегда говорят странное."
 cp77_relic_viktor:0 "Таблетки Виктора"
 cp77_relic_viktor_desc:0 "Виктор Вектор выписывает подавители. Помогает. Ненадолго."
 cp77_relic_devil:0 "Довериться Ханако Арасаке"
 cp77_relic_devil_desc:0 "Арасака умеет извлекать чипы. Цена — вечный контракт."
 cp77_relic_star:0 "Уехать с Панам"
 cp77_relic_star_desc:0 "Кочевники знают нетраннера в Пустошах, который может помочь."
 cp77_relic_sun:0 "Штурм с Роуг"
 cp77_relic_sun_desc:0 "Ворваться в Арасака-тауэр, добраться до Микоси и выбить ответы силой."
 cp77_relic_temperance:0 "Отдать тело Джонни"
 cp77_relic_temperance_desc:0 "Пусть Джонни живёт. Ви уйдёт за Заслон с Альт."
 cp77_relic_tower:0 "Сделка с Соломоном Ридом"
 cp77_relic_tower_desc:0 "FIA обещает операцию. Нужно только немного поработать на НСША."
 cp77_relic_republic_v:0 "Скопировать Ви в каждого"
 cp77_relic_republic_v_desc:0 "Безумная идея учёных «Посмертия»: если нельзя спасти одного Ви, пусть их будет миллион."
 cp77_hack_country:0 "Взломать сети: [From.GetNameDef]"
 cp77_hack_country_desc:0 "Нетраннеры атакуют государственные сети противника, крадут технологии и сеют хаос."
 cp77_hire_netrunners:0 "Нанять нетраннеров"
 cp77_hire_netrunners_desc:0 "Лучшие нетраннеры города готовы работать на государство."
 cp77_firewall:0 "Поставить файрвол"
 cp77_firewall_desc:0 "Изолировать государственные сети от диких ИИ."
