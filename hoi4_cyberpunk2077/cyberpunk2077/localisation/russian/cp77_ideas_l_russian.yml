l_russian:
 cp77_city_of_dreams:0 "Город мечты"
 cp77_city_of_dreams_desc:0 "Найт-Сити — город, где каждый мечтает стать легендой. Большинство становится удобрением."
 cp77_gang_wars:0 "Войны банд"
 cp77_gang_wars_desc:0 "Мальстрём, Тигриные Когти, Валентинос, Шестая улица, Животные — каждая банда считает город своим."
 cp77_corpo_plaza:0 "Корпоративная площадь"
 cp77_corpo_plaza_desc:0 "Башни Арасаки и Милитеха возвышаются над центром. Деньги текут рекой, но не в карманы граждан."
 cp77_cyberpsychosis:0 "Эпидемия киберпсихоза"
 cp77_cyberpsychosis_desc:0 "Слишком много хрома, слишком мало человечности. MaxTac не успевает."
 cp77_relic:0 "Биочип «Relic»"
 cp77_relic_desc:0 "В голове лидера города сидит цифровой призрак рокера-террориста. Он курит, хамит и даёт советы."
 cp77_tax_paradise:0 "Налоговый рай"
 cp77_tax_paradise_desc:0 "Корпорации платят налоги… теоретически."
 cp77_arasaka_security:0 "Служба безопасности Арасаки"
 cp77_arasaka_security_desc:0 "Улицы патрулируют безупречно одетые люди с катанами и нулевой эмпатией."
 cp77_arasaka_prefecture:0 "Префектура Арасаки"
 cp77_arasaka_prefecture_desc:0 "Найт-Сити официально стал территорией корпорации. Флаг города заменён логотипом."
 cp77_mikoshi_nation:0 "Народ в Микоси"
 cp77_mikoshi_nation_desc:0 "Миллионы энграмм хранятся в цифровом некрополе. Мёртвые голосуют активнее живых."
 cp77_militech_contracts:0 "Контракты Милитеха"
 cp77_militech_contracts_desc:0 "Оружейный гигант щедро платит за лояльность и испытательные полигоны."
 cp77_drone_swarm:0 "Рой дронов"
 cp77_drone_swarm_desc:0 "Небо над городом жужжит. Каждый дрон считает себя патриотом."
 cp77_free_city_charter:0 "Хартия свободного города"
 cp77_free_city_charter_desc:0 "Права граждан записаны на бумаге. Бумага бронирована."
 cp77_shadow_puppeteers:0 "Кукловоды из тени"
 cp77_shadow_puppeteers_desc:0 "Кто-то держит мэра на нитках. Город стал очень послушным. Подозрительно послушным."
 cp77_samurai_on_tour:0 "«Самурай» в туре"
 cp77_samurai_on_tour_desc:0 "Воссоединившаяся легендарная группа играет на каждом углу. Корпораты в ярости."
 cp77_burn_corpo:0 "Сжечь корпо!"
 cp77_burn_corpo_desc:0 "Каждая башня — мишень. Каждый корпорат — враг народа."
 cp77_afterlife_mercs:0 "Наёмники «Посмертия»"
 cp77_afterlife_mercs_desc:0 "Лучшие соло города пьют коктейли, названные в честь мёртвых легенд, и ждут контрактов."
 cp77_nomad_clans:0 "Кланы кочевников"
 cp77_nomad_clans_desc:0 "Альдекальдо, Бакеры, Джоды — семьи на колёсах, готовые встать за своих."
 cp77_nation_on_wheels:0 "Нация на колёсах"
 cp77_nation_on_wheels_desc:0 "Столица — колонна из трёх тысяч машин. Заводы — на прицепах. Парламент — в автобусе."
 cp77_chrome_cult:0 "Культ хрома"
 cp77_chrome_cult_desc:0 "Плоть слаба. Хром вечен. Глаза Мальстрёма светятся красным."
 cp77_flesh_is_trash:0 "Тело — это мусор"
 cp77_flesh_is_trash_desc:0 "Последний живой орган, разрешённый законом, — мозг. Временно."
 cp77_familia:0 "La Familia"
 cp77_familia_desc:0 "Валентинос держатся вместе. Семья — это всё."
 cp77_saint_jackie:0 "Святой Джеки"
 cp77_saint_jackie_desc:0 "Джеки Уэллс вернулся из мёртвых (или его брейнданс-копия). Хейвуд молится на него."
 cp77_tyger_shogunate:0 "Сёгунат Когтей"
 cp77_tyger_shogunate_desc:0 "Неоновые катаны, кодекс чести и много, очень много мотоциклов."
 cp77_pacifica_net:0 "Сеть Пасифики"
 cp77_pacifica_net_desc:0 "Вуду-бои знают о Сети больше, чем NetWatch готов признать."
 cp77_ai_overlords:0 "Власть ИИ"
 cp77_ai_overlords_desc:0 "Город управляется сущностями из-за Чёрного Заслона. Светофоры работают идеально. Люди — не очень."
 cp77_rogue_ai:0 "Дикие ИИ в Сети"
 cp77_rogue_ai_desc:0 "Чёрный Заслон пал. Старая Сеть ползёт в каждый терминал, каждый тостер, каждый имплант."
 cp77_netwatch_protectorate:0 "Протекторат NetWatch"
 cp77_netwatch_protectorate_desc:0 "Город — витрина безопасной Сети. Каждый пакет данных проверяется. Дважды."
 cp77_delamain_citizens:0 "Такси — граждане"
 cp77_delamain_citizens_desc:0 "Автомобили Делямейна получили паспорта. Пробки стали политическим вопросом."
 cp77_delamain_split:0 "Расщепление Делямейна"
 cp77_delamain_split_desc:0 "Двадцать одна личность ИИ-таксиста спорят, кто здесь президент. Одна из них хочет только покрасить машины в розовый."
 cp77_vendocracy:0 "Вендократия"
 cp77_vendocracy_desc:0 "Решения принимают торговые автоматы. Говорят, они мудрее Совета."
 cp77_free_soda:0 "Бесплатная газировка навеки"
 cp77_free_soda_desc:0 "Каждый гражданин получает Nicola-Колу бесплатно. Счастье измеряется в литрах."
 cp77_blue_eyes:0 "Взгляд Синих Глаз"
 cp77_blue_eyes_desc:0 "Никто не знает, кто он. Все знают, что он смотрит."
 cp77_blue_dreams:0 "Сны о синих глазах"
 cp77_blue_dreams_desc:0 "Жителям всего мира снится один и тот же человек в костюме. Он улыбается."
 cp77_bd_nation:0 "Нация в брейндансе"
 cp77_bd_nation_desc:0 "Половина граждан живёт в чужих воспоминаниях. Вторая половина их редактирует."
 cp77_simulation:0 "Симуляция внутри симуляции"
 cp77_simulation_desc:0 "Учёные доказали, что мир — брейнданс. Затем доказали, что доказательство — тоже брейнданс."
 cp77_lizzy_cult:0 "Культ Лиззи Уиззи"
 cp77_lizzy_cult_desc:0 "Хромированная поп-дива заменила себе всё, включая гражданство. Фанаты повторяют."
 cp77_lizzy_fever:0 "Лихорадка Лиззи Уиззи"
 cp77_lizzy_fever_desc:0 "Орбитальный концерт видел весь мир. Весь мир хочет хромированные губы."
 cp77_trauma_team:0 "Платиновая подписка Trauma Team"
 cp77_trauma_team_desc:0 "Бронированный AV прилетит за раненым солдатом за 3 минуты. Если оплачено."
 cp77_sandevistan:0 "Доктрина Сандевистана"
 cp77_sandevistan_desc:0 "Время замедляется. Пули зависают в воздухе. Солдаты успевают выпить кофе."
 cp77_fortress_city:0 "Город-крепость"
 cp77_fortress_city_desc:0 "Мегабашни превращены в бастионы. Каждый этаж — огневая точка."
 cp77_netrunner_corps:0 "Корпус нетраннеров"
 cp77_netrunner_corps_desc:0 "Люди в ваннах со льдом, подключённые к Сети. Опасно, но эффективно."
 cp77_daemon_legion:0 "Легион демонов"
 cp77_daemon_legion_desc:0 "Самописные программы-демоны атакуют вражеские сети круглосуточно."
 cp77_ncpd:0 "NCPD"
 cp77_ncpd_desc:0 "Полиция Найт-Сити. Коррумпирована, перегружена, но вооружена."
 cp77_cyberpsycho_squads:0 "Отряды киберпсихов"
 cp77_cyberpsycho_squads_desc:0 "Если не можешь вылечить киберпсихов — дай им форму и направь на врага."
 cp77_megacorp_economy:0 "Экономика мегакорпорации"
 cp77_megacorp_economy_desc:0 "Город работает как один гигантский холдинг. Каждый гражданин — сотрудник."
 cp77_nusa_federal:0 "Федеральная власть НСША"
 cp77_nusa_federal_desc:0 "Президент Майерс железной рукой собирает страну, развалившуюся на свободные штаты."
 cp77_militech_state:0 "Государство Милитеха"
 cp77_militech_state_desc:0 "Где кончается правительство и начинается Милитех? Ответ засекречен."
 cp77_unification_war:0 "Вторая война за объединение"
 cp77_unification_war_desc:0 "Свободные штаты вернутся. Добровольно или в мешках."
 cp77_fia:0 "FIA"
 cp77_fia_desc:0 "Федеральная разведка знает, что вы ели на завтрак. И что съедите завтра."
 cp77_moon_colony:0 "Лунная колония"
 cp77_moon_colony_desc:0 "Сойка улетела на Луну. За ней — тысячи переселенцев."
 cp77_crystal_palace:0 "Хрустальный дворец"
 cp77_crystal_palace_desc:0 "Орбитальная станция-курорт и тайный командный центр."
 cp77_myers_eternal:0 "Вечная Майерс"
 cp77_myers_eternal_desc:0 "Президент Майерс не стареет. Президент Майерс не спит. Президент Майерс — энграмма?"
 cp77_arasaka_empire:0 "Империя Арасаки"
 cp77_arasaka_empire_desc:0 "Япония — это Арасака. Арасака — это Япония. Сабуро Арасаке 158 лет."
 cp77_saburo_eternal:0 "Вечный Сабуро"
 cp77_saburo_eternal_desc:0 "Энграмма основателя корпорации готова пережить любые тела."
 cp77_yorinobu_reforms:0 "Реформы Ёринобу"
 cp77_yorinobu_reforms_desc:0 "Наследник ненавидит империю отца и хочет её разобрать на части."
 cp77_soulkiller_nation:0 "Нация Soulkiller"
 cp77_soulkiller_nation_desc:0 "Каждый гражданин оцифрован. Тела хранятся на складах. На всякий случай."
 cp77_digital_emperor:0 "Цифровой император"
 cp77_digital_emperor_desc:0 "Сабуро стал ИИ. Ему больше не нужны ни сон, ни совесть."
 cp77_relic_world:0 "Relic 2.0"
 cp77_relic_world_desc:0 "Арасака раздала «бесплатные» биочипы всему миру. Ничего плохого же не случится?"
 cp77_kang_tao:0 "Государство Кан Тао"
 cp77_kang_tao_desc:0 "Молодая и агрессивная корпорация умных пушек правит Китаем."
 cp77_sovoil:0 "СовОйл"
 cp77_sovoil_desc:0 "Советский Союз пережил XX век благодаря нефти, газу и полной беспринципности."
 cp77_eec:0 "ЕЭС"
 cp77_eec_desc:0 "Европа объединилась вокруг евродоллара и бюрократии."
 cp77_free_state:0 "Дух Свободных штатов"
 cp77_free_state_desc:0 "Здесь не любят Вашингтон, налоги и Милитех. Особенно Милитех."
 cp77_chooh2:0 "Поля CHOOH2"
 cp77_chooh2_desc:0 "Генномодифицированная кукуруза — топливо будущего. И настоящего. И, видимо, религия."
 cp77_corn_empire:0 "Кукурузный трон"
 cp77_corn_empire_desc:0 "Император правит с трона из початков. Подданные обязаны носить жёлтое."
 cp77_biotechnica_forests:0 "Леса Биотехники"
 cp77_biotechnica_forests_desc:0 "ГМО-секвойи растут по метру в неделю и, кажется, иногда переговариваются."
 cp77_bigfoot:0 "Министерство снежного человека"
 cp77_bigfoot_desc:0 "Он существует. У него есть пропуск в министерство. Он голосовал."
 cp77_druid_ai:0 "ИИ-друид"
 cp77_druid_ai_desc:0 "Лес обрёл разум и требует уважения. Лесорубов стало меньше."
 cp77_nomad_horde:0 "Великая орда"
 cp77_nomad_horde_desc:0 "Пыль до горизонта. Моторы ревут. Это идут кочевники."
 cp77_zca_arctic_wall:0 "Арктическая стена"
 cp77_zca_arctic_wall_desc:0 "Каждый айсберг под наблюдением."
 cp77_zca_ice_routes:0 "Ледовые трассы"
 cp77_zca_ice_routes_desc:0 "Северный морской путь работает круглый год."
 cp77_zca_syrup:0 "Сиропная экономика"
 cp77_zca_syrup_desc:0 "Валюта обеспечена кленовым сиропом."
 cp77_zca_moose:0 "Кибер-лоси"
 cp77_zca_moose_desc:0 "Лучшая пограничная служба на континенте."
 cp77_zmx_cartel_state:0 "Картель-государство"
 cp77_zmx_cartel_state_desc:0 "Порядок через страх и щедрость."
 cp77_zmx_dia:0 "Вечный День мёртвых"
 cp77_zmx_dia_desc:0 "Маски, свечи, музыка — каждый день."
 cp77_zmx_bones:0 "Хромовые скелеты"
 cp77_zmx_bones_desc:0 "Неубиваемые солдаты Санта-Муэрте."
 cp77_zcm_fortress:0 "Корпоративная крепость"
 cp77_zcm_fortress_desc:0 "Сто тысяч солдат на квадратный километр."
 cp77_zcm_tolls:0 "Плата за проход"
 cp77_zcm_tolls_desc:0 "Казна полна. Граждане — нет."
 cp77_zbr_biofarms:0 "Фермы Биотехники"
 cp77_zbr_biofarms_desc:0 "Еда, топливо и лекарства из одного растения."
 cp77_zbr_samba:0 "Самба-брейнданс"
 cp77_zbr_samba_desc:0 "Счастье обязательно."
 cp77_zad_crown:0 "Корона синдиката"
 cp77_zad_crown_desc:0 "Абсолютная власть и абсолютная роскошь."
 cp77_zad_gold:0 "Золотая лихорадка"
 cp77_zad_gold_desc:0 "Все ищут золото. Все находят."
 cp77_zsc_empire:0 "Империя льда"
 cp77_zsc_empire_desc:0 "Контроль над последним неосвоенным континентом."
 cp77_zsc_fish:0 "Рыбная экономика"
 cp77_zsc_fish_desc:0 "Валюта плавает."
 cp77_zsc_slide:0 "Великое скольжение"
 cp77_zsc_slide_desc:0 "Быстро, весело, по льду."
 cp77_zeu_superpower:0 "Сверхдержава эдди"
 cp77_zeu_superpower_desc:0 "Валютные санкции страшнее ракет."
 cp77_zeu_crystal:0 "Хрустальный дворец ЕКА"
 cp77_zeu_crystal_desc:0 "Самая дорогая недвижимость во вселенной."
 cp77_zeu_cucumbers:0 "Стандарт огурцов"
 cp77_zeu_cucumbers_desc:0 "Идеальный порядок во всём."
 cp77_zuk_empire:0 "Империя акций"
 cp77_zuk_empire_desc:0 "Солнце не заходит над портфелем Его Величества."
 cp77_zuk_mi6:0 "MI6 2.0"
 cp77_zuk_mi6_desc:0 "Слежка с британской вежливостью."
 cp77_zuk_queue:0 "Национальная очередь"
 cp77_zuk_queue_desc:0 "Порядок превыше всего."
 cp77_zee_night:0 "Ночное правительство"
 cp77_zee_night_desc:0 "День отменён указом."
 cp77_zee_night_army:0 "Армия ночи"
 cp77_zee_night_army_desc:0 "Атакуют только после заката."
 cp77_zsv_hegemony:0 "Энергетическая гегемония"
 cp77_zsv_hegemony_desc:0 "Мир на нефтяной игле."
 cp77_zsv_moon:0 "Лунный город «Гагарин»"
 cp77_zsv_moon_desc:0 "Советский человек на Луне — навсегда."
 cp77_zme_green:0 "Зелёный пояс"
 cp77_zme_green_desc:0 "Пустыня отступает."
 cp77_zme_isotopes:0 "Благословение изотопов"
 cp77_zme_isotopes_desc:0 "Мутации делают нас сильнее."
 cp77_zaf_monopoly:0 "Минеральная монополия"
 cp77_zaf_monopoly_desc:0 "Мир зависит от наших рудников."
 cp77_zaf_animals:0 "Права животных"
 cp77_zaf_animals_desc:0 "Саванна голосует."
 cp77_zaf_rhino:0 "Кавалерия носорогов"
 cp77_zaf_rhino_desc:0 "Танки, которые сами себя чинят."
 cp77_zsh_lords:0 "Повелители света"
 cp77_zsh_lords_desc:0 "Энергетическая сверхдержава."
 cp77_zsh_pyramids:0 "Пирамиды-аркологии"
 cp77_zsh_pyramids_desc:0 "Вечные здания для вечного фараона."
 cp77_zch_empire:0 "Империя Кан Тао"
 cp77_zch_empire_desc:0 "От Тибета до Тихого океана."
 cp77_zch_exams:0 "Цифровые экзамены"
 cp77_zch_exams_desc:0 "Бюрократия идеальна и бесчеловечна."
 cp77_zch_terracotta:0 "Терракотовая армия"
 cp77_zch_terracotta_desc:0 "Не устают, не спят, не сдаются."
 cp77_zin_digital:0 "Цифровая сверхдержава"
 cp77_zin_digital_desc:0 "Мир работает на наших серверах."
 cp77_zin_musical:0 "Вечный мюзикл"
 cp77_zin_musical_desc:0 "Песни вместо законов."
 cp77_zse_dividends:0 "Акционерное государство"
 cp77_zse_dividends_desc:0 "Каждый гражданин — миноритарий."
 cp77_zse_pirates:0 "Пиратская федерация"
 cp77_zse_pirates_desc:0 "Море — наша страна."
 cp77_zse_pontoons:0 "Понтонная экономика"
 cp77_zse_pontoons_desc:0 "Налоговая гавань, которая сама приплывает к клиенту."
 cp77_zau_pacific:0 "Хозяева Тихого океана"
 cp77_zau_pacific_desc:0 "Острова и моря — наши."
 cp77_zau_guzzoline:0 "Бензиновая экономика"
 cp77_zau_guzzoline_desc:0 "Топливо дороже золота."
 cp77_zau_hop:0 "Прыжковая доктрина"
 cp77_zau_hop_desc:0 "Ни один окоп не спасёт."
 cp77_zca_north_shield:0 "Северный щит"
 cp77_zca_north_shield_desc:0 "Канада укрылась за льдом и лесами от войн юга."
 cp77_zmx_cartel_shadow:0 "Тень картелей"
 cp77_zmx_cartel_shadow_desc:0 "Картели — второе правительство страны. А иногда первое."
 cp77_zcm_occupation:0 "Оккупационный режим"
 cp77_zcm_occupation_desc:0 "Центральная Америка десятилетиями была полигоном корпоративных войн."
 cp77_zbr_junta:0 "Хунта и корпорации"
 cp77_zbr_junta_desc:0 "Генералы и директора делят страну пополам."
 cp77_zad_syndicate:0 "Синдикат"
 cp77_zad_syndicate_desc:0 "Федерацией управляет союз картелей, горнодобывающих корпораций и генералов."
 cp77_zsc_antarctic:0 "Антарктические амбиции"
 cp77_zsc_antarctic_desc:0 "Конфедерация первой построила корпоративные базы во льдах."
 cp77_zeu_eurobucks:0 "Евродоллар"
