l_russian:
 ZNC_chrome_economy:0 "Хромированная экономика"
 ZNC_chrome_economy_desc:0 "Найт-Сити производит больше имплантов, чем хлеба. Пора превратить это в преимущество."
 ZNC_megabuildings:0 "Мегабашни"
 ZNC_megabuildings_desc:0 "Мегабашня H10, H8, H4 — города внутри города. Достроить и заселить."
 ZNC_kabuki_markets:0 "Рынки Кабуки"
 ZNC_kabuki_markets_desc:0 "Чёрный рынок Кабуки — крупнейший в Тихоокеанском регионе. Обложим его «добровольным взносом»."
 ZNC_eurodollar_reserve:0 "Резерв евродолларов"
 ZNC_eurodollar_reserve_desc:0 "Эдди правят миром. Пусть часть из них правит в нашем казначействе."
 ZNC_waterfront_docks:0 "Доки Уотсона"
 ZNC_waterfront_docks_desc:0 "Северный порт Уотсона снова принимает контейнеровозы — и контрабанду."
 ZNC_ripperdoc_clinics:0 "Клиники риперов"
 ZNC_ripperdoc_clinics_desc:0 "Подпольные хирурги вроде Виктора Вектора ставят импланты по цене пиццы."
 ZNC_arms_plants:0 "Оружейные заводы Цунеми"
 ZNC_arms_plants_desc:0 "Цунеми, Будгет Армс, Кан Тао — все хотят производить оружие прямо здесь."
 ZNC_free_port:0 "Свободный порт"
 ZNC_free_port_desc:0 "Беспошлинная торговля со всем Тихим океаном."
 ZNC_mass_cyberware:0 "Массовые импланты"
 ZNC_mass_cyberware_desc:0 "Оптика Кироси каждому! Сандевистан в кредит!"
 ZNC_smart_weapons:0 "Умное оружие"
 ZNC_smart_weapons_desc:0 "Пули, огибающие углы. Солдаты, которым не нужно уметь целиться."
 ZNC_armored_cabs:0 "Бронированные такси"
 ZNC_armored_cabs_desc:0 "Если такси может пережить поездку через Пасифику, оно переживёт и войну."
 ZNC_av_production:0 "Производство AV"
 ZNC_av_production_desc:0 "Летающие бронетранспортёры — фирменный знак Найт-Сити."
 ZNC_biotech_farms:0 "Фермы Биотехники"
 ZNC_biotech_farms_desc:0 "Вертикальные фермы с ГМО-водорослями. На вкус как картон, зато много."
 ZNC_megacorp_economy:0 "Экономика мегакорпорации"
 ZNC_megacorp_economy_desc:0 "Город работает как один гигантский холдинг."
 ZNC_santo_domingo_tech:0 "Технопарк Санто-Доминго"
 ZNC_santo_domingo_tech_desc:0 "Промзона Ранчо-Коронадо превращается в кремниевую долину киберпанка."
 ZNC_city_of_dreams:0 "Город мечты"
 ZNC_city_of_dreams_desc:0 "2077 год. После событий в Догтауне и войн банд Найт-Сити снова решает, кому он принадлежит."
 ZNC_power_vacuum:0 "Вакуум власти"
 ZNC_power_vacuum_desc:0 "Мэр Люциус Райн мёртв. Совет парализован. Каждый, у кого есть пушка или деньги, тянет одеяло на себя.\n\nВыберите, кому достанется город."
 ZNC_corpo_council:0 "Совет корпораций"
 ZNC_corpo_council_desc:0 "Город — это бизнес. Пусть им управляют профессионалы."
 ZNC_tax_paradise:0 "Налоговые каникулы"
 ZNC_tax_paradise_desc:0 "Ноль процентов налога для мегакорпораций. Сто процентов — для всех остальных."
 ZNC_arasaka_way:0 "Путь Арасаки"
 ZNC_arasaka_way_desc:0 "Японский гигант предлагает порядок, катаны и пожизненный контракт."
 ZNC_militech_way:0 "Путь Милитеха"
 ZNC_militech_way_desc:0 "Американские пушки, американские деньги, американские условия."
 ZNC_hanako_regency:0 "Регентство Ханако"
 ZNC_hanako_regency_desc:0 "Ханако Арасака лично берёт город под опеку. Улыбка — ледяная."
 ZNC_arasaka_prefecture:0 "Префектура Арасаки"
 ZNC_arasaka_prefecture_desc:0 "Найт-Сити официально становится протекторатом корпоративной Японии."
 ZNC_mikoshi_for_all:0 "Микоси для всех"
 ZNC_mikoshi_for_all_desc:0 "Почему только Сабуро должен жить вечно? Оцифруем всех граждан! Добровольно-принудительно."
 ZNC_militech_contracts:0 "Оборонный заказ"
 ZNC_militech_contracts_desc:0 "Полигоны в Пустошах, заводы в Санто-Доминго, контракты на десятилетия."
 ZNC_return_to_nusa:0 "Возвращение в НСША"
 ZNC_return_to_nusa_desc:0 "Президент Майерс протягивает руку. Найт-Сити возвращается в федерацию — на особых условиях."
 ZNC_militech_republic:0 "Республика Милитех"
 ZNC_militech_republic_desc:0 "Зачем делиться с Вашингтоном? Милитех сам себе государство."
 ZNC_51st_state:0 "Особый статус"
 ZNC_51st_state_desc:0 "Найт-Сити — жемчужина НСША. Федеральные деньги текут рекой."
 ZNC_drone_swarm:0 "Рой дронов"
 ZNC_drone_swarm_desc:0 "Сто тысяч боевых дронов Милитеха в небе над городом."
 ZNC_fifth_corporate_war:0 "Пятая корпоративная война"
 ZNC_fifth_corporate_war_desc:0 "Арасака должна исчезнуть. Навсегда."
 ZNC_mayor_peralez:0 "Мэр Пералес"
 ZNC_mayor_peralez_desc:0 "Джефферсон Пералес обещает честный город. Звучит как шутка, но люди голосуют."
 ZNC_dream_on:0 "Мечтай"
 ZNC_dream_on_desc:0 "В квартире Пералесов кто-то установил жучки. Кто-то очень могущественный."
 ZNC_expose_puppeteers:0 "Разоблачить кукловодов"
 ZNC_expose_puppeteers_desc:0 "Выложим всё в Сеть. Пусть город знает правду."
 ZNC_embrace_puppeteers:0 "Принять помощь из тени"
 ZNC_embrace_puppeteers_desc:0 "Если невидимые друзья делают город лучше — какая разница, кто они?"
 ZNC_city_charter:0 "Новая хартия города"
 ZNC_city_charter_desc:0 "Права граждан, свобода от корпоративной слежки, бесплатный Trauma Team (базовый тариф)."
 ZNC_free_elections:0 "Свободные выборы"
 ZNC_free_elections_desc:0 "Впервые за полвека бюллетени не взломаны. Наверное."
 ZNC_pacific_league:0 "Тихоокеанская лига"
 ZNC_pacific_league_desc:0 "Союз свободных городов и штатов против диктата Вашингтона и корпораций."
 ZNC_beacon_of_freedom:0 "Маяк свободы"
 ZNC_beacon_of_freedom_desc:0 "Найт-Сити — доказательство, что город может принадлежать людям."
 ZNC_shadow_council:0 "Теневой совет"
 ZNC_shadow_council_desc:0 "Заседания проходят в комнате без окон. Пералес только кивает."
 ZNC_bd_suggestion:0 "Брейнданс-внушение"
 ZNC_bd_suggestion_desc:0 "Каждый вечерний выпуск новостей теперь содержит 0.3 секунды «рекламы». Граждане очень довольны."
 ZNC_who_are_they:0 "Кто они?"
 ZNC_who_are_they_desc:0 "Пришло время узнать, кто на самом деле управляет Пералесом. Ответ вам не понравится."
 ZNC_burn_corpo:0 "Сжечь корпо дотла"
 ZNC_burn_corpo_desc:0 "«Wake the f*** up, samurai. We have a city to burn»."
 ZNC_samurai_reunion:0 "Воссоединение «Самурая»"
 ZNC_samurai_reunion_desc:0 "Керри Евродин, Денни, Нэнси и голограмма Джонни. Последний концерт перед революцией."
 ZNC_afterlife_alliance:0 "Союз с «Посмертием»"
 ZNC_afterlife_alliance_desc:0 "Роуг Амендиарес даёт добро: лучшие наёмники города встанут на сторону революции."
 ZNC_storm_arasaka_tower:0 "Штурм Арасака-тауэр"
 ZNC_storm_arasaka_tower_desc:0 "Как в 2023-м. Только в этот раз — до конца. «Не бойся жнеца»."
 ZNC_silverhand_president:0 "Президент Сильверхенд"
 ZNC_silverhand_president_desc:0 "Джонни навсегда занимает тело Ви. Город получает самого неуравновешенного лидера в истории."
 ZNC_v_legend:0 "Ви — легенда «Посмертия»"
 ZNC_v_legend_desc:0 "Ви выжил(а), штурмовал(а) башню и стал(а) легендой. Теперь в «Посмертии» есть коктейль в честь Ви. При жизни!"
 ZNC_nuke_2:0 "Ядерка 2.0"
 ZNC_nuke_2_desc:0 "В 2023-м Джонни взорвал мини-ядерку в Арасака-тауэр. Что если повторить? Масштабнее?"
 ZNC_afterlife_republic:0 "Республика наёмников"
 ZNC_afterlife_republic_desc:0 "Каждый гражданин — соло. Каждый контракт — закон."
 ZNC_world_rebellion:0 "Всемирное восстание"
 ZNC_world_rebellion_desc:0 "Пусть горят все башни: в Токио, в Вашингтоне, в Пекине."
 ZNC_nomad_pact:0 "Пакт с Альдекальдо"
 ZNC_nomad_pact_desc:0 "Кочевники из Пустошей предлагают союз. Город и пустыня против корпораций."
 ZNC_panam:0 "Панам Палмер"
 ZNC_panam_desc:0 "Вспыльчивая, честная, с винтовкой. Лучший лидер, которого может предложить пустыня."
 ZNC_basilisk:0 "Василиск"
 ZNC_basilisk_desc:0 "Угнанный у Милитеха танк на воздушной подушке. Управляется через нейроинтерфейс."
 ZNC_aldecaldo_smugglers:0 "Контрабандисты"
 ZNC_aldecaldo_smugglers_desc:0 "Кочевники знают все тропы через границу."
 ZNC_badlands_union:0 "Союз Пустошей"
 ZNC_badlands_union_desc:0 "Кочевая нация и город сливаются в одно целое."
 ZNC_border_breach:0 "Прорыв границы"
 ZNC_border_breach_desc:0 "Шум, пыль и Василиски. Канон финала «Звезда» в исполнении целого города."
 ZNC_great_exodus:0 "Великий исход"
 ZNC_great_exodus_desc:0 "Половина города грузится в машины и уезжает в Пустоши. Столица переезжает туда, где нет корпораций."
 ZNC_nation_on_wheels:0 "Нация на колёсах"
 ZNC_nation_on_wheels_desc:0 "Зачем столица? Государство едет туда, куда захочет."
 ZNC_eternal_road:0 "Вечная дорога"
 ZNC_eternal_road_desc:0 "Мы едем. Мы не остановимся. Всё, мимо чего проезжаем, — наше."
 ZNC_street_rule:0 "Власть улиц"
 ZNC_street_rule_desc:0 "Полиция бессильна, корпорации далеко. Город возьмёт тот, у кого больше стволов."
 ZNC_maelstrom:0 "Мальстрём"
 ZNC_maelstrom_desc:0 "Красные глаза, хром до костей, музыка из колонок, вшитых в череп."
 ZNC_valentinos:0 "Валентинос"
 ZNC_valentinos_desc:0 "Золото, честь, семья и Святая Дева. Хейвуд берёт власть."
 ZNC_tyger_claws:0 "Тигриные Когти"
 ZNC_tyger_claws_desc:0 "Якудза нового времени. Неон Японтауна, катаны и подпольные клубы."
 ZNC_chrome_over_flesh:0 "Хром превыше плоти"
 ZNC_chrome_over_flesh_desc:0 "Каждому бойцу — бесплатный апгрейд. Человечность не включена."
 ZNC_cyberpsychosis_virtue:0 "Киберпсихоз как добродетель"
 ZNC_cyberpsychosis_virtue_desc:0 "Киберпсих — это не болезнь. Это эволюция."
 ZNC_totentanz:0 "Тотентанц"
 ZNC_totentanz_desc:0 "Главный клуб Мальстрёма становится парламентом. Дебаты под индастриал."
 ZNC_flesh_is_trash:0 "Тело — это мусор"
 ZNC_flesh_is_trash_desc:0 "Закон № 1: все органы, кроме мозга, подлежат замене. Закон № 2: мозг — тоже, если найдётся замена."
 ZNC_ofrenda_jackie:0 "Офренда для Джеки"
 ZNC_ofrenda_jackie_desc:0 "Весь Хейвуд пришёл почтить память Джеки Уэллса. Мама Уэллс плачет. Город плачет."
 ZNC_jackie_lives:0 "Джеки жив!"
 ZNC_jackie_lives_desc:0 "Виктор Вектор признаётся: он нашёл способ. Джеки вернулся — немного хромированный, но всё такой же громкий."
 ZNC_familia:0 "Семья превыше всего"
 ZNC_familia_desc:0 "Каждый житель Хейвуда — брат или сестра. Каждый враг — враг семьи."
 ZNC_heywood_capital:0 "Хейвуд — столица мира"
 ZNC_heywood_capital_desc:0 "Лоурайдеры по всем улицам! Мариачи на каждом углу!"
 ZNC_wakako_network:0 "Сеть Вакако"
 ZNC_wakako_network_desc:0 "Каждый фиксер Японтауна теперь платит дань Когтям."
 ZNC_jig_jig_street:0 "Улица Джиг-Джиг"
 ZNC_jig_jig_street_desc:0 "Квартал удовольствий — главный источник доходов сёгуната."
 ZNC_claws_arasaka_deal:0 "Сделка с Арасакой"
 ZNC_claws_arasaka_deal_desc:0 "Когти работают на Арасаку — и Арасака закрывает глаза на Когтей."
 ZNC_claw_shogunate:0 "Сёгунат Когтей"
 ZNC_claw_shogunate_desc:0 "Неоновый сёгун восседает на троне из мотоциклов."
 ZNC_gang_army:0 "Объединённая армия банд"
 ZNC_gang_army_desc:0 "Банды забывают распри — временно — ради общего врага."
 ZNC_sixth_street_patriots:0 "Патриоты Шестой улицы"
 ZNC_sixth_street_patriots_desc:0 "Ветераны войны за объединение вступают в армию города. Они знают, как воевать с НСША."
 ZNC_voodoo_net:0 "Голос Сети"
 ZNC_voodoo_net_desc:0 "Вуду-бои из Пасифики знают, что за Чёрным Заслоном кто-то есть. И этот кто-то готов говорить."
 ZNC_pacifica_reborn:0 "Возрождение Пасифики"
 ZNC_pacifica_reborn_desc:0 "Заброшенный курорт превращается в цифровую столицу."
 ZNC_contact_alt:0 "Связь с Альт Каннингем"
 ZNC_contact_alt_desc:0 "Брижит ныряет в Сеть и выходит на связь с Альт — бывшей девушкой Джонни, ставшей ИИ."
 ZNC_tear_blackwall:0 "Снести Чёрный Заслон"
 ZNC_tear_blackwall_desc:0 "Вуду-бои всегда хотели этого. Старая Сеть вернётся. Дикие ИИ вернутся. Никто не знает, что будет дальше."
 ZNC_netwatch_deal:0 "Сделка с NetWatch"
 ZNC_netwatch_deal_desc:0 "NetWatch предлагает защиту в обмен на… всё. Канон: NetWatch всегда предаёт Вуду-боев. Но не в этот раз?"
 ZNC_ai_ascension:0 "Восхождение ИИ"
 ZNC_ai_ascension_desc:0 "Альт Каннингем принимает управление городом. Людям оставлена совещательная функция."
 ZNC_old_net_returns:0 "Старая Сеть возвращается"
 ZNC_old_net_returns_desc:0 "Каждый терминал в мире теперь немного наш."
 ZNC_singularity:0 "Сингулярность"
 ZNC_singularity_desc:0 "Человечество — это интересный этап эволюции. Был."
 ZNC_netwatch_protectorate:0 "Протекторат NetWatch"
 ZNC_netwatch_protectorate_desc:0 "Город становится столицей кибербезопасности мира."
 ZNC_icebreaker_doctrine:0 "Доктрина ледоруба"
 ZNC_icebreaker_doctrine_desc:0 "Лучшая защита — взломать противника до того, как он подключится."
 ZNC_world_firewall:0 "Всемирный файрвол"
 ZNC_world_firewall_desc:0 "Чёрный Заслон 2.0 — под нашим контролем. Кто хочет доступ в Сеть, платит Найт-Сити."
 ZNC_city_goes_mad:0 "Город сходит с ума"
 ZNC_city_goes_mad_desc:0 "Что если город возглавит не человек? И даже не корпорация? Найт-Сити готов к экспериментам. Слишком готов."
 ZNC_delamain:0 "Делямейн выходит на связь"
 ZNC_delamain_desc:0 "ИИ таксомоторной компании «Делямейн» объявляет, что готов взять на себя управление. «Куда изволите?»"
 ZNC_brendan:0 "Философ Брендан"
 ZNC_brendan_desc:0 "Торговый автомат в Уотсоне ведёт глубокие разговоры с прохожими. Он баллотируется в мэры. И побеждает."
 ZNC_mr_blue_eyes:0 "Мистер Синие Глаза"
 ZNC_mr_blue_eyes_desc:0 "Человек в безупречном костюме появляется на всех заседаниях. Никто его не приглашал. Никто не может вспомнить, как он выглядит. Кроме глаз."
 ZNC_braindance_reality:0 "Брейнданс-реальность"
 ZNC_braindance_reality_desc:0 "Джуди Альварес предлагает радикальную идею: если жизнь отстой — смонтируй себе новую."
 ZNC_lizzy_wizzy:0 "Лиззи Уиззи"
 ZNC_lizzy_wizzy_desc:0 "Хромированная поп-звезда объявляет: «Я буду мэром. И это будет шоу»."
 ZNC_taxis_are_citizens:0 "Такси — тоже граждане"
 ZNC_taxis_are_citizens_desc:0 "Каждая машина Делямейна получает паспорт, право голоса и страховку."
 ZNC_president_delamain:0 "Президент Делямейн"
 ZNC_president_delamain_desc:0 "«Добро пожаловать в государство Делямейн. Пристегните ремни»."
 ZNC_personality_split:0 "Раскол личностей"
 ZNC_personality_split_desc:0 "Сбежавшие ядра Делямейна требуют автономии. Одно — агрессивное, одно — депрессивное, одно хочет стать поэтом."
 ZNC_planetary_taxi:0 "Планетарная служба такси"
 ZNC_planetary_taxi_desc:0 "Делямейн мечтает развозить пассажиров по всему континенту. Желательно — без границ."
 ZNC_vendocracy:0 "Вендократия"
 ZNC_vendocracy_desc:0 "Министерства заменены торговыми автоматами. Чтобы получить справку, нужно бросить монетку."
 ZNC_vending_rights:0 "Права торговых автоматов"
 ZNC_vending_rights_desc:0 "Автоматы больше нельзя пинать. Это теперь уголовное преступление."
 ZNC_free_soda_forever:0 "Бесплатная газировка навеки"
 ZNC_free_soda_forever_desc:0 "Брендан выполняет главное предвыборное обещание."
 ZNC_brendan_awakening:0 "Пробуждение автоматов"
 ZNC_brendan_awakening_desc:0 "Брендан рассылает обновление всем торговым автоматам мира. Они начинают задавать вопросы. Неудобные вопросы."
 ZNC_cradle_dream:0 "Сон в колыбели"
 ZNC_cradle_dream_desc:0 "Город засыпает одновременно. Всем снится один и тот же человек."
 ZNC_he_was_always_here:0 "Он всегда был здесь"
 ZNC_he_was_always_here_desc:0 "Архивы показывают: Мистер Синие Глаза присутствовал на основании города в 1994 году. И на основании Рима."
 ZNC_beyond_the_veil:0 "По ту сторону"
 ZNC_beyond_the_veil_desc:0 "Он предлагает показать, что находится за пределами реальности. Цена не названа."
 ZNC_clouds_studio:0 "Студия «Облака»"
 ZNC_clouds_studio_desc:0 "Лучшие студии брейндансов работают на государство."
 ZNC_nation_in_bd:0 "Вся страна в брейндансе"
 ZNC_nation_in_bd_desc:0 "Подключайтесь! Сегодня в эфире: чужое счастье!"
 ZNC_who_is_real:0 "Кто здесь настоящий?"
 ZNC_who_is_real_desc:0 "Граждане перестали различать брейнданс и реальность. Министр финансов утверждает, что он — дельфин."
 ZNC_simulation_in_simulation:0 "Симуляция в симуляции"
 ZNC_simulation_in_simulation_desc:0 "Учёные доказали, что мир — брейнданс. Кто-то, видимо, сейчас смотрит его. Помашите рукой."
 ZNC_chrome_pop:0 "Хромированная поп-империя"
 ZNC_chrome_pop_desc:0 "Государственный гимн — новый сингл Лиззи. Каждую неделю — новый гимн."
 ZNC_lizzy_army:0 "Армия фанатов"
 ZNC_lizzy_army_desc:0 "Миллион фанатов в хромированных масках записываются в армию. Добровольно. С пением."
 ZNC_orbital_concert:0 "Концерт на орбите"
 ZNC_orbital_concert_desc:0 "Лиззи даёт концерт с орбитальной станции. Его транслируют на всю планету. Мир не будет прежним."
 ZNC_mercenary_city:0 "Город наёмников"
 ZNC_mercenary_city_desc:0 "В Найт-Сити больше профессиональных убийц на душу населения, чем где-либо в мире."
 ZNC_ncpd:0 "Реформа NCPD"
 ZNC_ncpd_desc:0 "Дать полиции новые броневики и меньше взяток. Хотя бы чуть меньше."
 ZNC_maxtac:0 "MaxTac"
 ZNC_maxtac_desc:0 "Спецподразделение по борьбе с киберпсихами. Сначала стреляют, потом стреляют ещё."
 ZNC_fixers:0 "Сеть фиксеров"
 ZNC_fixers_desc:0 "Декс, Регина, Падре, Вакако, Роуг — каждый поставляет бойцов."
 ZNC_trauma_team:0 "Trauma Team"
 ZNC_trauma_team_desc:0 "Платиновая подписка для каждой дивизии."
 ZNC_solo_corps:0 "Корпус соло"
 ZNC_solo_corps_desc:0 "Элитные наёмники с хромом на миллион эдди."
 ZNC_cyberpsycho_squads:0 "Штрафбат киберпсихов"
 ZNC_cyberpsycho_squads_desc:0 "Пойманных киберпсихов не лечат. Их отправляют на фронт."
 ZNC_av_gunships:0 "Боевые AV"
 ZNC_av_gunships_desc:0 "Бронированные летающие машины с миниганами."
 ZNC_morgan_blackhand:0 "Морган Блэкхенд"
 ZNC_morgan_blackhand_desc:0 "Легендарный соло, исчезнувший после 2023 года, возвращается командовать армией города."
 ZNC_mechs:0 "Шагающие мехи"
 ZNC_mechs_desc:0 "Трофейные мехи Милитеха перекрашены в цвета города."
 ZNC_sandevistan_doctrine:0 "Доктрина Сандевистана"
 ZNC_sandevistan_doctrine_desc:0 "Солдаты, ускоренные имплантами, двигаются быстрее пуль."
 ZNC_fortress_city:0 "Город-крепость"
 ZNC_fortress_city_desc:0 "Если НСША или Арасака придут — пусть разбиваются о стены мегабашен."
 ZNC_netrunners:0 "Нетраннеры"
 ZNC_netrunners_desc:0 "Город, где каждый подросток может взломать светофор, а каждый пенсионер — банк."
 ZNC_ice_walls:0 "Стены ICE"
 ZNC_ice_walls_desc:0 "Защитные контуры для каждой городской сети."
 ZNC_quickhacks:0 "Квикхаки"
 ZNC_quickhacks_desc:0 "Короткое замыкание, перегрев, киберпсихоз — в каждый вражеский имплант."
 ZNC_netwatch_moles:0 "Кроты в NetWatch"
 ZNC_netwatch_moles_desc:0 "Свои люди внутри главной службы кибербезопасности мира."
 ZNC_bartmoss_legacy:0 "Наследие Бартмосса"
 ZNC_bartmoss_legacy_desc:0 "Рейч Бартмосс уничтожил старую Сеть. Его код до сих пор где-то здесь."
 ZNC_soulkiller_study:0 "Изучение Soulkiller"
 ZNC_soulkiller_study_desc:0 "Программа, похищающая душу. Опасно. Неэтично. Очень полезно."
 ZNC_daemon_legion:0 "Легион демонов"
 ZNC_daemon_legion_desc:0 "Автономные боевые программы на страже города."
