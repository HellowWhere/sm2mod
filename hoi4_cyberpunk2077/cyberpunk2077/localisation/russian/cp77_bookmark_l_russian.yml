 CP77_BOOKMARK:0 "2077: Город мечты"
 CP77_BOOKMARK_DESC:0 "Найт-Сити, 2077 год. Корпорации, банды, кочевники и ИИ за Чёрным Заслоном делят мир. Кем станете вы — легендой или удобрением?"
 CP77_ZNC_BM:0 "Свободный город на западном побережье. Семь политических путей: от корпоративной префектуры Арасаки до президента-такси и вендократии торгового автомата Брендана."
 CP77_USA_BM:0 "Президент Розалинд Майерс собирает расколотую Америку. Вторая война за объединение, Догтаун, Сойка и Луна — или вечная энграмма Майерс."
 CP77_JAP_BM:0 "Корпоративная Япония Арасаки. Ёринобу против отца, Ханако против брата, Микоси против всего человечества."
 CP77_OTHERS_BM:0 "Свободные штаты, Кан Тао, СовОйл, ЕЭС и все остальные — мир 2077 года открыт."
 CP77_ZFT_BM:0 "Свободный штат Техас: нефть, кукуруза CHOOH2 и, возможно, Кукурузный император."
 CP77_ZBL_BM:0 "Кочевники Пустошей: семьи на колёсах, Василиски и Великая орда."
 CP77_ZFP_BM:0 "Свободные Штаты Северо-Запада: леса Биотехники, снежный человек-министр и ИИ-друид."
