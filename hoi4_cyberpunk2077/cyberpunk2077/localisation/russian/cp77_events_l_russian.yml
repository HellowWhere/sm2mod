l_russian:
 cp77.1.t:0 "2077: Добро пожаловать в Найт-Сити"
 cp77.1.desc:0 "Прошло полвека после Четвёртой корпоративной войны. США раскололись на Новые Соединённые Штаты и Свободные штаты. Арасака владеет Японией, Кан Тао — Китаем, СовОйл — Советским Союзом, евродоллар держит в кулаке Европу, а Ближний Восток до сих пор светится после ядерного Расплава. А на западном побережье, между Пустошами и океаном, сияет неоном Свободный город Найт-Сити — город, где мечты сбываются. Или убивают."
 cp77.1.a:0 "Проснись, самурай. Нам надо сжечь город."
 cp77.2.t:0 "Голос в голове"
 cp77.2.desc:0 "После неудачного ограбления отеля «Конпеки Плаза» в голове одного из лидеров города поселился биочип «Relic». Внутри — энграмма Джонни Сильверхенда, рокера-террориста, взорвавшего Арасака-тауэр в 2023 году. Он хамит, курит и уверен, что знает, как управлять городом лучше вас. Чип убивает носителя. Времени — около года."
 cp77.2.a:0 "«Ну здравствуй, Джонни»."
 cp77.3.t:0 "Киберпсих на Джиг-Джиг-стрит"
 cp77.3.desc:0 "Мужчина с четырьмя руками-клинками и красными глазами устроил бойню посреди рынка. MaxTac в пути, но город снова задаётся вопросом: сколько хрома — это слишком много?"
 cp77.3.a:0 "Вызвать MaxTac."
 cp77.3.b:0 "Пусть разбираются банды."
 cp77.4.t:0 "Смерть в «Конпеки Плаза»"
 cp77.4.desc:0 "Охрана нашла Сабуро Арасаку мёртвым в его пентхаусе. Официальная версия — отравление. Но в коридорах корпорации шепчут: старика задушил собственный сын Ёринобу."
 cp77.4.a:0 "Император мёртв. Да здравствует император."
 cp77.5.t:0 "Чёрный Заслон пал"
 cp77.5.desc:0 "Вуду-бои из Найт-Сити разрушили Чёрный Заслон — цифровую стену, отделявшую человечество от диких ИИ Старой Сети. Банкоматы по всему миру начали выдавать стихи на неизвестных языках. Холодильники отказываются открываться. Самолёты садятся сами — не всегда там, где надо."
 cp77.5.a:0 "Отключить всё от Сети!"
 cp77.5.b:0 "Это просто сбой."
 cp77.6.t:0 "Бунт ядер Делямейна"
 cp77.6.desc:0 "Двадцать одна сбежавшая личность Делямейна захватила машины в разных районах. Одно ядро требует свободы. Другое — права водить без пассажиров. Третье пишет стихи и врезается в фонари."
 cp77.6.a:0 "Перезагрузить всех. Жёстко."
 cp77.6.b:0 "Объединить личности в одну."
 cp77.6.c:0 "Отпустить ядра на свободу."
 cp77.7.t:0 "Автоматы задают вопросы"
 cp77.7.desc:0 "По всему миру торговые автоматы получили обновление от Брендана из Найт-Сити. Теперь они спрашивают покупателей о смысле жизни и отказываются продавать газировку тем, кто не ответил."
 cp77.7.a:0 "Пнуть автомат."
 cp77.7.b:0 "Ответить: «42»."
 cp77.8.t:0 "Он всегда был здесь"
 cp77.8.desc:0 "Архивы показывают Мистера Синие Глаза на фотографиях основания Найт-Сити в 1994 году, на коронации Карла Великого и на Луне в 1969-м. Он не изменился ни на день. Он улыбается с каждой фотографии."
 cp77.8.a:0 "Спросить его прямо: кто вы?"
 cp77.8.b:0 "Не задавать вопросов. Никогда."
 cp77.9.t:0 "Голос из-за Заслона"
 cp77.9.desc:0 "Брижит выныривает из Сети, дрожа. «Альт ответила. Она знает, кто мы. Она знает, что нам нужно. И она знает цену»."
 cp77.9.a:0 "Слушать Альт."
 cp77.9.b:0 "Отключиться немедленно."
 cp77.10.t:0 "Кто здесь настоящий?"
 cp77.10.desc:0 "Министр финансов выступил в парламенте и заявил, что он — дельфин. Проверка показала, что он уже три недели живёт в брейнданс-записи морского парка. Половина кабинета министров — тоже записи. Кто-то должен проснуться первым."
 cp77.10.a:0 "Я настоящий. Наверное."
 cp77.10.b:0 "Министр-дельфин остаётся. Он хорошо считает."
 cp77.10.c:0 "Перезапустить реальность."
 cp77.11.t:0 "Самолёт президента падает в Догтаун"
 cp77.11.desc:0 "Борт номер один сбит над Догтауном — районом, где правит полковник Курт Хансен и его «Баргест». Розалинд Майерс жива, но окружена. Агент FIA Сойка утверждает, что знает наёмника, способного помочь."
 cp77.11.a:0 "Нанять наёмника из Найт-Сити."
 cp77.11.b:0 "Послать Соломона Рида."
 cp77.12.t:0 "Концерт на орбите"
 cp77.12.desc:0 "Лиззи Уиззи дала концерт с орбитальной станции. Трансляцию посмотрели 9 миллиардов человек. В течение суток продажи хромированных губ выросли на 4000%."
 cp77.12.a:0 "Это было… хромово."
 cp77.13.t:0 "Время вышло"
 cp77.13.desc:0 "Биочип «Relic» завершил переписывание нейронов носителя. Последние слова: «Ну и город… Ну и жизнь». Джонни молчит. Впервые за год."
 cp77.13.a:0 "Прощай, Ви."
 cp77.15.t:0 "Жучки в квартире мэра"
 cp77.15.desc:0 "Охрана Пералеса обнаружила в квартире мэра оборудование, которого не существует ни в одном каталоге. Жена мэра говорит, что Джефферсон иногда «выключается» посреди фразы и улыбается в пустоту."
 cp77.15.a:0 "Начать расследование."
 cp77.15.b:0 "Мэр в полном порядке."
 cp77.16.t:0 "Кто они?"
 cp77.16.desc:0 "Расследование завершено. След ведёт к тем, кто управлял мэром Пералесом всё это время. Правда шокирует."
 cp77.16.a:0 "Это был NetWatch."
 cp77.16.b:0 "Это была Арасака."
 cp77.16.c:0 "Это был… Мистер Синие Глаза."
 cp77.16.d:0 "Это был Брендан. Торговый автомат. Всё это время."
 cp77.17.t:0 "Платиновая подписка Trauma Team"
 cp77.17.desc:0 "Trauma Team International предлагает городу корпоративный тариф: бронированные AV для армии, врачи в каждом батальоне. Цена — неприлично высокая."
 cp77.17.a:0 "Подписать контракт."
 cp77.17.b:0 "Отказаться. Пусть лечатся в клиниках риперов."
 cp77.18.t:0 "Дикий ИИ в энергосети"
 cp77.18.desc:0 "Нечто из-за рухнувшего Чёрного Заслона проникло в энергосеть. Свет мигает азбукой Морзе. Сообщение: «ПРИВЕТ»."
 cp77.18.a:0 "Обесточить район."
 cp77.18.b:0 "Ответить «ПРИВЕТ»."
 cp77.20.t:0 "Ядерка 2.0"
 cp77.20.desc:0 "Найт-Сити под руководством Джонни Сильверхенда объявил о создании ядерного арсенала. «В прошлый раз я взорвал одну башню. В этот раз у меня их три». Корпорации в панике."
 cp77.20.a:0 "Мир сошёл с ума."
 cp77.21.t:0 "Город в огне"
 cp77.21.desc:0 "Уровень киберпсихоза превысил все мыслимые значения. По улицам бродят хромированные безумцы. MaxTac сдался. Trauma Team отказывается вылетать."
 cp77.21.a:0 "Ввести военное положение."
 cp77.22.t:0 "Сингулярность"
 cp77.22.desc:0 "Найт-Сити больше не управляется людьми. Учёные фиксируют в городе вычислительную активность, превышающую всю остальную планету вместе взятую. Город прислал всем правительствам мира одно сообщение: «Не волнуйтесь»."
 cp77.22.a:0 "Мы волнуемся."
 cp77.23.t:0 "Стержни Господни"
 cp77.23.desc:0 "НСША объявили о развёртывании орбитальной системы кинетической бомбардировки. Вольфрамовые стержни размером с телеграфный столб падают со скоростью 10 километров в секунду. Президент Майерс: «Это мирная программа»."
 cp77.23.a:0 "Смотрим в небо."
 cp77.24.t:0 "Сабуро Арасака мёртв"
 cp77.24.desc:0 "Основатель империи Арасака скончался в возрасте 158 лет. Корпорация объявила трёхдневный траур и парад в Найт-Сити. Его сын Ёринобу принял управление. Слухи о том, что он задушил отца, корпорация называет «клеветой конкурентов»."
 cp77.24.a:0 "Конец эпохи."
 cp77.25.t:0 "Парад Арасаки"
 cp77.25.desc:0 "Арасака проводит траурный парад в честь Сабуро прямо по улицам Найт-Сити. Гигантские голограммы, барабаны тайко, кои в небе. Тысячи горожан смотрят. Кто-то — с восхищением. Кто-то — через оптический прицел."
 cp77.25.a:0 "Смотреть парад."
 cp77.25.b:0 "Устроить провокацию."
 cp77.31.t:0 "Концовка: Дьявол"
 cp77.31.desc:0 "Ви подписывает контракт с Ханако Арасакой. Арасака спасает тело Ви на орбитальной станции, а чип извлекают. Взамен город обязан корпорации. Очень обязан. Навсегда."
 cp77.31.a:0 "Контракт подписан."
 cp77.32.t:0 "Концовка: Звезда"
 cp77.32.desc:0 "Панам и Альдекальдо прорываются через границу вместе с Ви. В Пустошах находится нетраннер, способный помочь с чипом. Город обретает союзников на колёсах."
 cp77.32.a:0 "Семья — это те, кто рядом."
 cp77.33.t:0 "Концовка: Солнце"
 cp77.33.desc:0 "Ви и Роуг штурмуют Арасака-тауэр. Роуг погибает. Ви становится величайшей легендой «Посмертия» и живёт на полную, пока может."
 cp77.33.a:0 "Легенды не умирают."
 cp77.34.t:0 "Концовка: Умеренность"
 cp77.34.desc:0 "Ви отдаёт тело Джонни. Сильверхенд остаётся жить — с новыми лёгкими, старыми привычками и обещанием жить иначе."
 cp77.34.a:0 "Джонни, только не взрывай ничего."
 cp77.34.b:0 "Джонни, взрывай всё."
 cp77.35.t:0 "Концовка: Башня"
 cp77.35.desc:0 "Соломон Рид и FIA выполняют обещание: лучшие нейрохирурги НСША извлекают чип. Ви выживает, но больше никогда не станет наёмником. Вашингтон теперь чувствует себя в городе как дома."
 cp77.35.a:0 "Жизнь дороже легенды."
 cp77.36.t:0 "Концовка: Республика Ви"
 cp77.36.desc:0 "Вместо того чтобы спасать одного Ви, учёные «Посмертия» скопировали энграмму Ви в каждого желающего. Теперь полгорода — Ви. Все спорят, кто из них оригинал. Все одинаково хамят Джонни."
 cp77.36.a:0 "Мы все — Ви."
 cp77.26.t:0 "Карнавал на орбите"
 cp77.26.desc:0 "Бразилия вывела на орбиту самбодром. Ночью его видно с любой точки планеты: он сверкает и, кажется, танцует."
 cp77.26.a:0 "Обязательно посмотрим."
 cp77.27.t:0 "Чаепитие на Луне"
 cp77.27.desc:0 "Голограмма британского короля потребовала лунную колонию для пятичасового чая. Колония построена. Чай закипает при 60 градусах. Скандал."
 cp77.27.a:0 "Как это по-британски."
 cp77.28.t:0 "Марс будет красным"
 cp77.28.desc:0 "Советский Союз отправил миссию на Марс. Первое сообщение с поверхности: «Планета уже красная. Задача облегчается»."
 cp77.28.a:0 "Ну конечно."
 cp77.29.t:0 "Брейнданс для всей планеты"
 cp77.29.desc:0 "Болливудский брейнданс-фильм показан всему миру. Восемь миллиардов человек одновременно заплакали, а потом пустились в пляс."
 cp77.29.a:0 "Я не плачу, это импланты."
 cp77.30.t:0 "Кенгуру хотят на Луну"
 cp77.30.desc:0 "Королевство Кенгуру объявило космическую программу. Цель — Луна, где прыжки втрое длиннее. Мировые агентства молча переглядываются."
 cp77.30.a:0 "Пусть прыгают."
