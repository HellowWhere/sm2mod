l_russian:
 CP77_JAP_arasaka_empire:0 "Империя Арасаки"
 CP77_JAP_arasaka_empire_desc:0 "Сабуро Арасаке 158 лет. Его корпорация владеет Японией. Его сыну это не нравится."
 CP77_JAP_zaibatsu_industry:0 "Дзайбацу XXI века"
 CP77_JAP_zaibatsu_industry_desc:0 "Заводы Арасаки — самые автоматизированные в мире."
 CP77_JAP_saburo_will:0 "Воля Сабуро"
 CP77_JAP_saburo_will_desc:0 "Старик ещё жив. Но надолго ли? И кто унаследует империю?"
 CP77_JAP_arasaka_military:0 "Силы безопасности Арасаки"
 CP77_JAP_arasaka_military_desc:0 "Лучшие корпоративные солдаты планеты."
 CP77_JAP_arasaka_tech:0 "Технологии Арасаки"
 CP77_JAP_arasaka_tech_desc:0 "Relic, Soulkiller, Микоси. Наука без тормозов."
 CP77_JAP_cyberware_monopoly:0 "Монополия на импланты"
 CP77_JAP_cyberware_monopoly_desc:0 "Каждый третий имплант в мире — от Арасаки."
 CP77_JAP_tokyo_megacity:0 "Мегаполис Токио"
 CP77_JAP_tokyo_megacity_desc:0 "Город-гигант на сорок миллионов жителей и миллиард камер."
 CP77_JAP_yorinobu_coup:0 "Переворот Ёринобу"
 CP77_JAP_yorinobu_coup_desc:0 "Канон: в пентхаусе отеля «Конпеки Плаза» Ёринобу душит отца. Корпорация переходит к сыну-бунтарю."
 CP77_JAP_saburo_eternal:0 "Вечный Сабуро"
 CP77_JAP_saburo_eternal_desc:0 "Сабуро не умрёт. Его энграмма ждёт в Микоси нового тела."
 CP77_JAP_dismantle_arasaka:0 "Распустить Арасаку"
 CP77_JAP_dismantle_arasaka_desc:0 "Ёринобу делает невозможное: корпорацию делят на сотню независимых компаний."
 CP77_JAP_hanako_countercoup:0 "Контрпереворот Ханако"
 CP77_JAP_hanako_countercoup_desc:0 "Ханако и верные отцу генералы свергают Ёринобу. Его тело ещё пригодится."
 CP77_JAP_tiger_claws_pact:0 "Пакт с Тигриными Когтями"
 CP77_JAP_tiger_claws_pact_desc:0 "Ёринобу всегда дружил с бандами. Теперь они — новая полиция."
 CP77_JAP_free_japan:0 "Свободная Япония"
 CP77_JAP_free_japan_desc:0 "Впервые за век Япония принадлежит японцам, а не корпорации."
 CP77_JAP_cyber_shinto:0 "Кибер-синто"
 CP77_JAP_cyber_shinto_desc:0 "Жрецы объявили: ками живут в Сети. Каждый роутер — святилище. Каждый ИИ — божество."
 CP77_JAP_saburo_in_yorinobu:0 "Сабуро в теле сына"
 CP77_JAP_saburo_in_yorinobu_desc:0 "Энграмма отца загружена в мозг сына. Сабуро снова жив. Ёринобу — нет."
 CP77_JAP_corporate_shogunate:0 "Корпоративный сёгунат"
 CP77_JAP_corporate_shogunate_desc:0 "Император — декорация. Сёгун — генеральный директор."
 CP77_JAP_mikoshi:0 "Проект «Микоси»"
 CP77_JAP_mikoshi_desc:0 "Цифровой некрополь Арасаки, где хранятся украденные души."
 CP77_JAP_soulkiller_nation:0 "Нация Soulkiller"
 CP77_JAP_soulkiller_nation_desc:0 "Зачем нужны тела, если можно хранить граждан в Микоси? Это так эффективно!"
 CP77_JAP_digital_emperor:0 "Цифровой император"
 CP77_JAP_digital_emperor_desc:0 "Сабуро отказывается от тела вообще. Теперь он везде."
 CP77_JAP_relic_for_all:0 "Relic 2.0 для всего мира"
 CP77_JAP_relic_for_all_desc:0 "Арасака раздаёт бесплатные биочипы всем желающим. В каждом — маленький Сабуро."
 CP77_JAP_adam_smasher:0 "Адам Смэшер"
 CP77_JAP_adam_smasher_desc:0 "Самый опасный киборг в мире. От человека в нём остались только мозг и злоба."
 CP77_JAP_tower_in_nc:0 "Башня в Найт-Сити"
 CP77_JAP_tower_in_nc_desc:0 "Новая Арасака-тауэр возвышается над Найт-Сити. Город должен вернуться под контроль."
 CP77_JAP_arasaka_navy:0 "Флот Арасаки"
 CP77_JAP_arasaka_navy_desc:0 "Авианосцы с логотипом корпорации."
 CP77_JAP_claim_night_city:0 "Вернуть Найт-Сити"
 CP77_JAP_claim_night_city_desc:0 "Если город не хочет быть префектурой добровольно…"
 CP77_JAP_kang_tao_war:0 "Война с Кан Тао"
 CP77_JAP_kang_tao_war_desc:0 "Молодой китайский конкурент слишком быстро растёт."
 CP77_JAP_fifth_corporate_war:0 "Пятая корпоративная война"
 CP77_JAP_fifth_corporate_war_desc:0 "Арасака против Милитеха. Последняя битва за мир."
