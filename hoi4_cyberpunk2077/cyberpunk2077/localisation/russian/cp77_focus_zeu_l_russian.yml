l_russian:
 ZEU_root:0 "Сообщество 2077"
 ZEU_root_desc:0 "Европа пережила Коллапс благодаря одной вещи — общей валюте. Теперь эдди правят миром."
 ZEU_p0_0:0 "Еврократия навсегда"
 ZEU_p0_0_desc:0 "Брюссель знает, что лучше для 500 миллионов граждан."
 ZEU_p0_1:0 "Единый рынок"
 ZEU_p0_1_desc:0 "Ни одной границы от Лиссабона до Хельсинки."
 ZEU_p0_2:0 "Евробизнес"
 ZEU_p0_2_desc:0 "Европейские корпорации выходят на мировой рынок."
 ZEU_p0_3:0 "Сверхдержава эдди"
 ZEU_p0_3_desc:0 "Кто контролирует валюту, контролирует мир."
 ZEU_p1_0:0 "Еврокосмос"
 ZEU_p1_0_desc:0 "Европейское космическое агентство владеет Хрустальным дворцом на орбите."
 ZEU_p1_1:0 "Хрустальный дворец"
 ZEU_p1_1_desc:0 "Орбитальный курорт и банк для сверхбогатых."
 ZEU_p1_2:0 "Лунные концессии"
 ZEU_p1_2_desc:0 "Добыча гелия-3 на Луне."
 ZEU_p1_3:0 "Орбитальная оборона"
 ZEU_p1_3_desc:0 "Никто не смеет угрожать Европе с орбиты."
 ZEU_p2_0:0 "ИИ-бюрократ из Брюсселя"
 ZEU_p2_0_desc:0 "Систему документооборота ЕЭС подключили к ИИ. Он начал регулировать всё. Даже регулирование."
 ZEU_p2_1:0 "Регламент о форме огурцов 2.0"
 ZEU_p2_1_desc:0 "Все овощи теперь стандартизированы. Даже генномодифицированные."
 ZEU_p2_2:0 "Очередь в бесконечность"
 ZEU_p2_2_desc:0 "Чтобы объявить войну, нужно подать заявку. Рассмотрение — 18 месяцев."
 ZEU_p2_3:0 "Европейский регламент для всего мира"
 ZEU_p2_3_desc:0 "ИИ рассылает свои регламенты всем странам. Те почему-то подчиняются."
 ZEU_eco_0:0 "Рурская индустрия 2.0"
 ZEU_eco_0_desc:0 "Сердце европейской промышленности."
 ZEU_eco_1:0 "Еврокорпоративные заводы"
 ZEU_eco_1_desc:0 "Оружие для всего Сообщества."
 ZEU_eco_2:0 "Европейская Биотехника"
 ZEU_eco_2_desc:0 "Генная инженерия по евростандартам."
 ZEU_eco_3:0 "Франкфуртская биржа"
 ZEU_eco_3_desc:0 "Сердце евродоллара."
 ZEU_eco_4:0 "Роттердамский мегапорт"
 ZEU_eco_4_desc:0 "Крупнейший порт мира."
 ZEU_eco_5:0 "Термояд ITER"
 ZEU_eco_5_desc:0 "Неисчерпаемая энергия."
 ZEU_eco_6:0 "Европейская сеть"
 ZEU_eco_6_desc:0 "Самая защищённая Сеть мира."
 ZEU_mil_0:0 "Еврокорпус"
 ZEU_mil_0_desc:0 "Единая армия Сообщества."
 ZEU_mil_1:0 "Евротанки"
 ZEU_mil_1_desc:0 "Тяжёлая бронетехника."
 ZEU_mil_2:0 "Европейские AV"
 ZEU_mil_2_desc:0 "Воздушное превосходство."
 ZEU_mil_3:0 "Доктрина сдерживания"
 ZEU_mil_3_desc:0 "Война — последний аргумент. Но аргумент."
 ZEU_mil_4:0 "Объединённый флот"
 ZEU_mil_4_desc:0 "Атлантика и Средиземноморье."
