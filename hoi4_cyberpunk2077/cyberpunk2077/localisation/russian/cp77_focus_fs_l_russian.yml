l_russian:
 CP77_FS_independence:0 "Свобода от Вашингтона"
 CP77_FS_independence_desc:0 "Мы вышли из Союза во время Коллапса и не собираемся возвращаться."
 CP77_FS_local_militia:0 "Народное ополчение"
 CP77_FS_local_militia_desc:0 "Каждый гражданин с винтовкой — солдат Свободного штата."
 CP77_FS_free_trade:0 "Свободная торговля"
 CP77_FS_free_trade_desc:0 "Никаких федеральных пошлин."
 CP77_FS_border_forts:0 "Пограничные укрепления"
 CP77_FS_border_forts_desc:0 "Бетон и колючая проволока на границе с НСША."
 CP77_FS_corp_investors:0 "Корпоративные инвесторы"
 CP77_FS_corp_investors_desc:0 "Арасака с радостью вложится в любого врага Милитеха."
 CP77_FS_mercs_from_nc:0 "Наёмники из Найт-Сити"
 CP77_FS_mercs_from_nc_desc:0 "Лучшие соло всегда к услугам того, кто платит."
 CP77_FS_union_of_free_states:0 "Союз Свободных штатов"
 CP77_FS_union_of_free_states_desc:0 "Вместе мы сильнее, чем Майерс думает."
 CP77_FS_industrial_push:0 "Индустриальный рывок"
 CP77_FS_industrial_push_desc:0 "Заводы строятся быстрее, чем Вашингтон успевает вводить санкции."
 CP77_FS_resist_nusa:0 "Сопротивление НСША"
 CP77_FS_resist_nusa_desc:0 "Ни шагу назад перед федералами."
 CP77_FS_research_cooperation:0 "Научное сотрудничество"
 CP77_FS_research_cooperation_desc:0 "Университеты свободных штатов объединяют усилия."
 CP77_FS_join_nusa:0 "Вернуться в НСША"
 CP77_FS_join_nusa_desc:0 "Может, Майерс не так плоха? По крайней мере, у неё есть армия."
 CP77_FS_free_forever:0 "Свободны навсегда"
 CP77_FS_free_forever_desc:0 "Ни Вашингтон, ни корпорации не будут нами править."
 CP77_FS_petrochem_deal:0 "Сделка с Петрохемом"
 CP77_FS_petrochem_deal_desc:0 "Петрохем выращивает кукурузу для топлива CHOOH2. Её поля простираются до горизонта."
 CP77_FS_chooh2_fields:0 "Бескрайние поля CHOOH2"
 CP77_FS_chooh2_fields_desc:0 "Техас превращается в одно огромное кукурузное поле."
 CP77_FS_corn_kingdom:0 "Кукурузное королевство"
 CP77_FS_corn_kingdom_desc:0 "Генеральный директор Петрохема объявляет себя королём Техаса. Корона — из золотых початков."
 CP77_FS_corn_emperor:0 "Император кукурузы"
 CP77_FS_corn_emperor_desc:0 "Кукурузная империя Техас заявляет права на всю Америку. Кукуруза должна расти везде."
 CP77_FS_aldecaldo_council:0 "Совет кланов"
 CP77_FS_aldecaldo_council_desc:0 "Альдекальдо, Джоды, Бакеры собираются у костра решать судьбу Пустошей."
 CP77_FS_raffen_shiv_purge:0 "Изгнать Раффен Шив"
 CP77_FS_raffen_shiv_purge_desc:0 "Кочевники-отступники грабят караваны. Хватит."
 CP77_FS_war_on_wraiths:0 "Война с Призраками"
 CP77_FS_war_on_wraiths_desc:0 "Банда «Призраки» нападает на всех подряд. Пора показать им, что такое кочевая месть."
 CP77_FS_nomad_horde:0 "Великая орда"
 CP77_FS_nomad_horde_desc:0 "Все кланы объединяются в одну орду. Её цель — вся Америка."
 CP77_FS_biotechnica_forests:0 "Леса Биотехники"
 CP77_FS_biotechnica_forests_desc:0 "Генетически модифицированные леса Каскадии растут на глазах."
 CP77_FS_cascadia_republic:0 "Республика Каскадия"
 CP77_FS_cascadia_republic_desc:0 "Самый демократичный из Свободных штатов. Здесь даже голосуют без взлома."
 CP77_FS_bigfoot_ministry:0 "Министерство снежного человека"
 CP77_FS_bigfoot_ministry_desc:0 "Генетики Биотехники случайно вывели снежного человека. Он оказался прекрасным администратором."
 CP77_FS_druid_ai:0 "ИИ-друид"
 CP77_FS_druid_ai_desc:0 "Лес обрёл разум через корневую сеть датчиков. Он требует место в парламенте."
