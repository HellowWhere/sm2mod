l_russian:
 ZCM_root:0 "Наследие центральноамериканских войн"
 ZCM_root_desc:0 "Здесь воевали все: США, корпорации, партизаны. Кто будет хозяином теперь?"
 ZCM_p0_0:0 "Верность Милитеху"
 ZCM_p0_0_desc:0 "Зона остаётся витриной корпорации."
 ZCM_p0_1:0 "Полигоны Милитеха"
 ZCM_p0_1_desc:0 "Новое оружие испытывают здесь."
 ZCM_p0_2:0 "Авиабазы Панамы"
 ZCM_p0_2_desc:0 "Небо над каналом — наше."
 ZCM_p0_3:0 "Корпоративная крепость"
 ZCM_p0_3_desc:0 "Зона превращается в одну большую военную базу."
 ZCM_p1_0:0 "Освободительная армия"
 ZCM_p1_0_desc:0 "Партизаны выходят из джунглей."
 ZCM_p1_1:0 "Джунгли — наша крепость"
 ZCM_p1_1_desc:0 "Партизанская доктрина."
 ZCM_p1_2:0 "Изгнать корпорации"
 ZCM_p1_2_desc:0 "Национализировать всё, что оставил Милитех."
 ZCM_p1_3:0 "Боливарианский союз"
 ZCM_p1_3_desc:0 "Объединить Центральную Америку и Анды."
 ZCM_p2_0:0 "Канальная республика"
 ZCM_p2_0_desc:0 "ИИ шлюзов Панамского канала объявил себя правительством. Сборы идут исправно."
 ZCM_p2_1:0 "Плата за всё"
 ZCM_p2_1_desc:0 "Проезд, проход, вдох — всё платно."
 ZCM_p2_2:0 "Шлюзы для армии"
 ZCM_p2_2_desc:0 "Канал можно закрыть для врагов в одну секунду."
 ZCM_p2_3:0 "Бесконечная очередь"
 ZCM_p2_3_desc:0 "ИИ создаёт очередь кораблей длиной в океан. Весь мир ждёт."
 ZCM_eco_0:0 "Восстановление"
 ZCM_eco_0_desc:0 "Отстроить разрушенные войной города."
 ZCM_eco_1:0 "Банановые корпорации 2.0"
 ZCM_eco_1_desc:0 "ГМО-фрукты для всего мира."
 ZCM_eco_2:0 "Панамский канал"
 ZCM_eco_2_desc:0 "Главная водная артерия полушария."
 ZCM_eco_3:0 "Офшоры"
 ZCM_eco_3_desc:0 "Деньги любят тишину и тропики."
 ZCM_eco_4:0 "Геотермальные станции"
 ZCM_eco_4_desc:0 "Вулканы работают на нас."
 ZCM_eco_5:0 "Подпольные лаборатории"
 ZCM_eco_5_desc:0 "Здесь можно всё. Совсем всё."
 ZCM_eco_6:0 "Трофейные арсеналы"
 ZCM_eco_6_desc:0 "Склады оружия со всех войн."
 ZCM_mil_0:0 "Ветераны джунглей"
 ZCM_mil_0_desc:0 "Десятилетия войны — лучший учитель."
 ZCM_mil_1:0 "Снайперы сельвы"
 ZCM_mil_1_desc:0 "Невидимы в зелени."
 ZCM_mil_2:0 "Ганшипы"
 ZCM_mil_2_desc:0 "Летающие крепости."
 ZCM_mil_3:0 "Наёмники всех мастей"
 ZCM_mil_3_desc:0 "Здесь всегда найдётся, кого нанять."
 ZCM_mil_4:0 "Бункеры"
 ZCM_mil_4_desc:0 "Сеть укрытий под каждым холмом."
