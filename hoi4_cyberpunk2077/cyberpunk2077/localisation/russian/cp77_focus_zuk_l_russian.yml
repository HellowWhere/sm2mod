l_russian:
 ZUK_root:0 "Корона и Сити"
 ZUK_root_desc:0 "Британия осталась вне ЕЭС и выжила. Теперь у неё король-акционер и самая мокрая Сеть в мире."
 ZUK_p0_0:0 "Корпоративная монархия"
 ZUK_p0_0_desc:0 "Король — председатель совета директоров. Парламент — ревизионная комиссия."
 ZUK_p0_1:0 "Королевские облигации"
 ZUK_p0_1_desc:0 "Каждый подданный — инвестор."
 ZUK_p0_2:0 "Королевский флот возрождён"
 ZUK_p0_2_desc:0 "Британия снова правит морями. Хотя бы некоторыми."
 ZUK_p0_3:0 "Империя акций"
 ZUK_p0_3_desc:0 "Колонии больше не нужны — достаточно контрольных пакетов."
 ZUK_p1_0:0 "Лондонская сеть"
 ZUK_p1_0_desc:0 "Нетраннеры Лондона — лучшие в Европе."
 ZUK_p1_1:0 "MI6 2.0"
 ZUK_p1_1_desc:0 "Разведка в каждой Сети."
 ZUK_p1_2:0 "Кембриджские лаборатории"
 ZUK_p1_2_desc:0 "ИИ-исследования на грани Чёрного Заслона."
 ZUK_p1_3:0 "Цифровой Ла-Манш"
 ZUK_p1_3_desc:0 "Файрвол вокруг острова."
 ZUK_p2_0:0 "Король-голограмма"
 ZUK_p2_0_desc:0 "Король давно умер, но его голограмма продолжает пить чай и раздавать титулы."
 ZUK_p2_1:0 "Чайный рацион"
 ZUK_p2_1_desc:0 "Чай выдаётся по карточкам. Страна на грани бунта."
 ZUK_p2_2:0 "Очередь как национальная идея"
 ZUK_p2_2_desc:0 "Британцы стоят в очереди даже в брейндансе. Дисциплина невероятна."
 ZUK_p2_3:0 "Чаепитие на Луне"
 ZUK_p2_3_desc:0 "Голограмма короля требует колонию на Луне. Исключительно для пятичасового чая."
 ZUK_eco_0:0 "Северные заводы"
 ZUK_eco_0_desc:0 "Манчестер и Бирмингем снова работают."
 ZUK_eco_1:0 "Сити Лондона"
 ZUK_eco_1_desc:0 "Тёмные деньги всего мира."
 ZUK_eco_2:0 "Нефть Северного моря"
 ZUK_eco_2_desc:0 "Последние капли."
 ZUK_eco_3:0 "Шотландские верфи"
 ZUK_eco_3_desc:0 "Корабли для короны."
 ZUK_eco_4:0 "Порт Лондона"
 ZUK_eco_4_desc:0 "Торговля со всем миром."
 ZUK_eco_5:0 "Технокластер Оксфорда"
 ZUK_eco_5_desc:0 "Наука и импланты."
 ZUK_eco_6:0 "Королевские арсеналы"
 ZUK_eco_6_desc:0 "Британское оружие."
 ZUK_mil_0:0 "Британская армия"
 ZUK_mil_0_desc:0 "Маленькая, но профессиональная."
 ZUK_mil_1:0 "САС"
 ZUK_mil_1_desc:0 "Лучший спецназ Европы."
 ZUK_mil_2:0 "Королевские ВВС"
 ZUK_mil_2_desc:0 "Традиции воздушной войны."
 ZUK_mil_3:0 "Бронированные кэбы"
 ZUK_mil_3_desc:0 "Лондонские такси с пушками."
 ZUK_mil_4:0 "Королевский флот"
 ZUK_mil_4_desc:0 "Морская мощь."
