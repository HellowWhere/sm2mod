l_russian:
 ZME_root:0 "Земля после Расплава"
 ZME_root_desc:0 "Ядерная война 90-х превратила Ближний Восток в пустошь. Пора решить, что строить на пепле."
 ZME_p0_0:0 "Очищение земли"
 ZME_p0_0_desc:0 "Дезактивация и восстановление."
 ZME_p0_1:0 "Зелёный пояс"
 ZME_p0_1_desc:0 "Генномодифицированные растения, поглощающие радиацию."
 ZME_p0_2:0 "Новые города"
 ZME_p0_2_desc:0 "Аркологии на месте руин."
 ZME_p0_3:0 "Возрождение"
 ZME_p0_3_desc:0 "Регион, который все списали, снова живёт."
 ZME_p1_0:0 "Нефтяные бароны"
 ZME_p1_0_desc:0 "Кто контролирует скважины, контролирует всё."
 ZME_p1_1:0 "Свинцовые скважины"
 ZME_p1_1_desc:0 "Роботы добывают радиоактивную нефть."
 ZME_p1_2:0 "Армия в свинцовой броне"
 ZME_p1_2_desc:0 "Солдаты, которым радиация нипочём."
 ZME_p1_3:0 "Нефтяная война"
 ZME_p1_3_desc:0 "Отобрать у СовОйла его рынки."
 ZME_p2_0:0 "Светящиеся"
 ZME_p2_0_desc:0 "Культ мутантов поклоняется реактору. Они светятся в темноте и считают это благословением."
 ZME_p2_1:0 "Благословение изотопов"
 ZME_p2_1_desc:0 "Радиация — это дар. Граждане это чувствуют. Буквально."
 ZME_p2_2:0 "Поклонение реактору"
 ZME_p2_2_desc:0 "Строим реакторы как храмы."
 ZME_p2_3:0 "Сияющий крестовый поход"
 ZME_p2_3_desc:0 "Пророк хочет поделиться светом со всем миром."
 ZME_eco_0:0 "Восстановление промышленности"
 ZME_eco_0_desc:0 "Из руин — к заводам."
 ZME_eco_1:0 "Уцелевшие скважины"
 ZME_eco_1_desc:0 "Нефть всё ещё здесь."
 ZME_eco_2:0 "Солнечные поля"
 ZME_eco_2_desc:0 "Пустыня даёт энергию."
 ZME_eco_3:0 "Торговые пути пустоши"
 ZME_eco_3_desc:0 "Караваны через мёртвые земли."
 ZME_eco_4:0 "Порты Залива"
 ZME_eco_4_desc:0 "Морская торговля."
 ZME_eco_5:0 "Подземные лаборатории"
 ZME_eco_5_desc:0 "Бункеры стали институтами."
 ZME_eco_6:0 "Мастерские пустоши"
 ZME_eco_6_desc:0 "Оружие из обломков."
 ZME_mil_0:0 "Кланы пустыни"
 ZME_mil_0_desc:0 "Воины, выросшие среди руин."
 ZME_mil_1:0 "Пустынные рейдеры"
 ZME_mil_1_desc:0 "Быстрые машины и тяжёлые пулемёты."
 ZME_mil_2:0 "Противорадиационная защита"
 ZME_mil_2_desc:0 "Броня для заражённых зон."
 ZME_mil_3:0 "Дроны пустоши"
 ZME_mil_3_desc:0 "Глаза в небе."
 ZME_mil_4:0 "Бункерная сеть"
 ZME_mil_4_desc:0 "Город под землёй."
