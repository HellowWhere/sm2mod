l_russian:
 ZCH_root:0 "Восход Кан Тао"
 ZCH_root_desc:0 "Кан Тао — самая быстрорастущая корпорация мира. Её цель — сбросить Арасаку с трона."
 ZCH_p0_0:0 "Кан Тао навсегда"
 ZCH_p0_0_desc:0 "Корпорация и государство окончательно сливаются."
 ZCH_p0_1:0 "Умное оружие для всех"
 ZCH_p0_1_desc:0 "Пули Кан Тао находят цель сами."
 ZCH_p0_2:0 "Шестая корпоративная война"
 ZCH_p0_2_desc:0 "Арасака должна пасть."
 ZCH_p0_3:0 "Корпоративная империя Азии"
 ZCH_p0_3_desc:0 "Азия принадлежит Кан Тао."
 ZCH_p1_0:0 "Партия возвращается"
 ZCH_p1_0_desc:0 "Старая гвардия Компартии свергает корпоратов."
 ZCH_p1_1:0 "Национализация Кан Тао"
 ZCH_p1_1_desc:0 "Корпорация становится наркоматом."
 ZCH_p1_2:0 "Красная ось"
 ZCH_p1_2_desc:0 "Союз с Советским Союзом."
 ZCH_p1_3:0 "Революция в Азии"
 ZCH_p1_3_desc:0 "Красное знамя над Юго-Восточной Азией."
 ZCH_p2_0:0 "Цифровая династия"
 ZCH_p2_0_desc:0 "Алгоритм вычислил Мандат Неба. Его получил ИИ, загруженный в Запретный город."
 ZCH_p2_1:0 "Цифровые экзамены"
 ZCH_p2_1_desc:0 "Все чиновники сдают экзамен ИИ. Проходит один из миллиона."
 ZCH_p2_2:0 "Великий файрвол"
 ZCH_p2_2_desc:0 "Стена в Сети длиной в десять тысяч ли."
 ZCH_p2_3:0 "Терракотовая армия 2.0"
 ZCH_p2_3_desc:0 "Миллион боевых роботов из керамики и стали."
 ZCH_eco_0:0 "Мастерская мира"
 ZCH_eco_0_desc:0 "Самое большое производство на планете."
 ZCH_eco_1:0 "Заводы Кан Тао"
 ZCH_eco_1_desc:0 "Умное оружие конвейером."
 ZCH_eco_2:0 "Редкоземельные металлы"
 ZCH_eco_2_desc:0 "Без них нет имплантов."
 ZCH_eco_3:0 "Шанхайская биржа"
 ZCH_eco_3_desc:0 "Финансовый центр Азии."
 ZCH_eco_4:0 "Верфи Шанхая"
 ZCH_eco_4_desc:0 "Флот Тихого океана."
 ZCH_eco_5:0 "Шэньчжэньские лаборатории"
 ZCH_eco_5_desc:0 "Импланты дешевле и лучше."
 ZCH_eco_6:0 "Мегаполис Чунцин"
 ZCH_eco_6_desc:0 "Город на 50 миллионов."
 ZCH_mil_0:0 "Армия Кан Тао"
 ZCH_mil_0_desc:0 "Корпоративные солдаты."
 ZCH_mil_1:0 "Умная пехота"
 ZCH_mil_1_desc:0 "Каждый солдат — с умной винтовкой."
 ZCH_mil_2:0 "Мехи Кан Тао"
 ZCH_mil_2_desc:0 "Шагающие танки."
 ZCH_mil_3:0 "AV-армады"
 ZCH_mil_3_desc:0 "Тысячи AV в небе."
 ZCH_mil_4:0 "Миллионная армия"
 ZCH_mil_4_desc:0 "Людские резервы бесконечны."
