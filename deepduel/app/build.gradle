plugins {
    id 'com.android.application' version '8.7.3'
}

def ciBuild = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
// Private signing key of the RuStore build. It comes from CI secrets and is never stored in the repository.
def ruKeystore = System.getenv('RUSTORE_KEYSTORE_FILE')

android {
    namespace 'com.deepduel.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deepduel.game'
        minSdk 26
        targetSdk 35
        versionCode ciBuild
        versionName "1.0.${ciBuild}"
    }

    // One fixed key for every build, so a new APK installs over the old one
    // and the server data stored on the phone survives updates.
    signingConfigs {
        shared {
            storeFile file('deepduel.keystore')
            storePassword 'deepduel'
            keyAlias 'deepduel'
            keyPassword 'deepduel'
        }
        rustore {
            if (ruKeystore) {
                storeFile file(ruKeystore)
                storePassword System.getenv('RUSTORE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RUSTORE_KEY_ALIAS')
                keyPassword System.getenv('RUSTORE_KEY_PASSWORD')
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    // global  - the APK from GitHub (com.deepduel.game), signed with the shared public key;
    //           language follows the phone (Russian for Russian phones, English otherwise)
    // rustore - the build for RuStore (com.deepduel.game.ru): Russian, ruble prices, its own private key.
    //           Without the key secrets it is signed with the shared key - fine for testing, NOT for the store.
    // itch    - the English build for itch.io (com.deepduel.game.en), named "Deep Duel"
    flavorDimensions 'store'
    productFlavors {
        global {
            dimension 'store'
            buildConfigField 'String', 'STORE', '"global"'
            buildConfigField 'String', 'LANG', '"auto"'
            signingConfig signingConfigs.shared
        }
        itch {
            dimension 'store'
            applicationIdSuffix '.en'
            buildConfigField 'String', 'STORE', '"itch"'
            buildConfigField 'String', 'LANG', '"en"'
            signingConfig signingConfigs.shared
        }
        rustore {
            dimension 'store'
            applicationIdSuffix '.ru'
            buildConfigField 'String', 'STORE', '"rustore"'
            buildConfigField 'String', 'LANG', '"ru"'
            signingConfig ruKeystore ? signingConfigs.rustore : signingConfigs.shared
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            // signed per flavor, see productFlavors
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The HTML5 client (deepduel/client/web) is packed into the APK as assets/web.
    sourceSets {
        main {
            assets.srcDirs = [rootProject.file('client')]
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/module-info.class', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':server')
}
